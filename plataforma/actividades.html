<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title id="dynamic-title">Guía Local | Actividades</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{
      --panel:#fff;
      --text:#172437;
      --muted:#66758b;
      --blue:#1f5fb8;
      --primary:#006699;
      --accent:#ff7f50;
      --soft:#f5e1d4;
      --border:#e4cbb8;
      --shadow:0 10px 30px rgba(28,43,78,.07);
      --danger:#c62828;
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      max-width:100%;
      height:auto;
      margin:0;
      overflow-x:hidden;
      overflow-y:visible;
      background:transparent!important;
      color:var(--text);
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      touch-action:pan-y;
      overscroll-behavior:auto;
    }

    body.gld-modulo-preparando .wrap{
      visibility:hidden;
      pointer-events:none;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      margin:24px auto 32px;
      padding:0 18px;
    }

    .header{
      display:flex;
      gap:16px;
      align-items:center;
      margin-bottom:12px;
      flex-wrap:wrap;
      background:#fff;
      border:1px solid #e6eefc;
      border-radius:16px;
      padding:12px 14px;
      box-shadow:0 8px 22px rgba(33,49,86,.06);
      width:100%;
    }

    .activity-symbol{
      width:84px;
      height:84px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      background:linear-gradient(135deg,#ffffff,#f5e1d4);
      border:1px solid #e8c4a8;
      color:#d35400;
      font-size:2.8rem;
      box-shadow:0 8px 22px rgba(0,102,153,.09);
    }

    .title-block{display:flex;flex-direction:column;gap:6px;min-width:0}
    .title{
      font-size:2.05rem;
      font-weight:950;
      letter-spacing:-.02em;
      color:#0f2e58;
      margin:0;
      line-height:1.06;
      word-break:break-word;
    }
    .subtitle{margin:0;color:var(--muted);font-weight:650;font-size:1.02rem;word-break:break-word}

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:16px 0 10px;
      align-items:center;
      width:100%;
    }

    .cta-row{
      width:100%;
      margin:0 0 18px;
    }

    .search{
      flex:1;
      min-width:220px;
      padding:12px 14px;
      border-radius:14px;
      border:1.5px solid #d7e1f7;
      background:#fff;
      font-size:1rem;
    }

    .select{
      padding:11px 12px;
      border-radius:14px;
      border:1.5px solid #d7e1f7;
      background:#fff;
      font-weight:800;
      font-size:1rem;
    }

    .gld-activity-access{
      display:grid;
      grid-template-columns:48px minmax(0,1fr) auto;
      align-items:center;
      gap:10px;
      width:100%;
      min-height:66px;
      padding:9px 11px;
      border-radius:14px;
      text-decoration:none;
      background:linear-gradient(135deg,#fff6ec 0%,#ffe5d4 100%);
      color:#b84b00;
      border:1px solid #ffc89f;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
    }
    .gld-activity-access .access-icon{
      width:44px;height:44px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#ffb86b,#ff7a2a);
      color:#fff;font-size:1.55rem;
      border:1px solid rgba(184,75,0,.12);
    }
    .gld-activity-access strong{display:block;font-size:.98rem;line-height:1.2;margin-bottom:2px}
    .gld-activity-access span{display:block;font-size:.82rem;line-height:1.3;color:#655875}
    .gld-activity-access b{font-size:1.2rem;line-height:1}

    .activities{
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
    }

    .activity-card{
      display:flex;
      flex-direction:column;
      gap:0;
      width:100%;
      background:linear-gradient(180deg,#fff 0%,#fffaf6 100%);
      border:2px solid #e6c3a7;
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .card-head{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:11px 14px;
      background:linear-gradient(90deg,#fff3e8 0%,#f5e1d4 100%);
      border-bottom:1px solid #e5c3a8;
      text-align:center;
    }

    .organizer{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
      min-width:0;
    }
    .organizer-label{
      color:#d35400;
      font-weight:950;
      font-size:.92rem;
      letter-spacing:.015em;
    }
    .organizer-logo{
      width:48px;
      height:48px;
      object-fit:contain;
      border-radius:12px;
      background:#fff;
      border:2px solid #ffb27a;
      padding:4px;
      display:block;
    }
    .organizer-name{
      color:#0f2e58;
      font-size:1.06rem;
      font-weight:950;
      line-height:1.15;
      overflow-wrap:anywhere;
    }

    .card-body{
      width:100%;
      padding:15px 16px 16px;
      min-width:0;
    }

    .title-card{
      margin:0;
      color:#102f5b;
      font-size:1.55rem;
      line-height:1.15;
      font-weight:950;
      overflow-wrap:anywhere;
    }

    .category-group{
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      margin-top:9px;
    }

    .category-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      max-width:100%;
      padding:7px 11px;
      border-radius:999px;
      background:#f5e1d4;
      color:#d35400;
      font-weight:900;
      font-size:.93rem;
    }
    .category-logo{
      width:26px;height:26px;object-fit:contain;border-radius:6px;
      background:#fff;border:1px solid #ecd1bc;padding:2px;
    }

    .desc{
      margin:13px 0 0;
      color:#34465a;
      line-height:1.5;
      font-size:1.02rem;
      text-align:justify;
      white-space:pre-line;
      overflow-wrap:anywhere;
    }

    .schedule-title{
      margin:16px 0 8px;
      font-weight:950;
      color:#0f2e58;
      display:flex;
      align-items:center;
      gap:7px;
    }

    .schedule-list{
      display:flex;
      flex-direction:column;
      gap:9px;
      width:100%;
    }

    .schedule-item{
      padding:10px 11px;
      border:1px solid #ead3c1;
      border-radius:12px;
      background:#fff;
    }

    .schedule-line{
      display:flex;
      gap:8px;
      align-items:flex-start;
      margin:3px 0;
      line-height:1.4;
      color:#3e4d60;
      overflow-wrap:anywhere;
    }
    .schedule-line i{color:#d35400;flex:0 0 auto;margin-top:2px}
    .schedule-line strong{color:#0f2e58}

    .map-link{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:6px;
      color:#1f5fb8;
      font-weight:900;
      text-decoration:underline dotted;
    }

    .contact-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:15px;
    }

    .action-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:42px;
      padding:9px 12px;
      border-radius:10px;
      border:1px solid #c9dce5;
      background:#fff;
      color:#006699;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
    }
    .action-btn.primary{
      background:#006699;
      border-color:#d35400;
      color:#fff;
    }

    .gallery{
      width:100%;
      margin-top:15px;
      display:flex;
      flex-direction:column;
      gap:9px;
      align-items:center;
    }

    .gallery-main{
      width:100%;
      max-width:760px;
      max-height:560px;
      object-fit:contain;
      border-radius:14px;
      background:#f6f2ee;
      border:1px solid #e7d3c3;
      cursor:pointer;
      display:block;
    }

    .gallery-thumbs{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:center;
      width:100%;
    }
    .gallery-thumb{
      width:62px;height:62px;object-fit:cover;border-radius:8px;
      border:2px solid transparent;background:#eee;cursor:pointer;
    }
    .gallery-thumb.active{border-color:#ff7f50}

    .banner-tarjeta{
      width:100%;
      text-align:center;
      margin:2px 0 2px;
      display:flex;
      justify-content:center;
      position:relative;
      flex-direction:column;
      align-items:center;
      gap:.6rem;
    }
    .banner-tarjeta .banner-media{
      width:min(90vw,360px);
      max-width:360px;
      aspect-ratio:9/16;
      display:flex;align-items:center;justify-content:center;
      background:#000;border-radius:1em;overflow:hidden;
      box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;
    }
    .banner-tarjeta .banner-media iframe,
    .banner-tarjeta .banner-media video,
    .banner-tarjeta .banner-media img{
      width:100%;height:100%;object-fit:contain;display:block;border:none;
    }
    .banner-tarjeta .cta-btn,.banner-tarjeta .replay-btn,.activity-video-sound-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:42px;padding:10px 14px;border-radius:10px;border:none;
      font-weight:850;text-decoration:none;cursor:pointer;
    }
    .banner-tarjeta .cta-btn{background:#006699;color:#fff;box-shadow:0 3px 10px rgba(0,102,153,.18);}
    .banner-tarjeta .replay-btn,.activity-video-sound-btn{background:#f4f7fb;color:#006699;border:1px solid #e3eaf4;}

    .empty{
      width:100%;
      padding:20px;
      text-align:center;
      border-radius:14px;
      background:#fff;
      border:1px solid #e6eefc;
      color:#66758b;
      font-weight:800;
    }

    .paginacion-zocalo{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      background:#f5e1d4;
      border-radius:1.5em;
      padding:.6em;
      margin:1.2em auto 0;
      width:100%;
      box-sizing:border-box;
    }
    .paginacion-zocalo[hidden]{display:none!important}
    .pagination-bar{
      display:inline-block;
      vertical-align:middle;
      margin:0 10px;
      background:#fff;
      border-radius:1.5em;
      padding:.4em 1.1em;
      font-size:1em;
      width:auto;
      white-space:nowrap;
    }
    .pagination-bar button,.pagination-bar span{
      margin:0 2px;padding:3px 10px;border:none;background:none;
      border-radius:4px;cursor:pointer;font-size:1em;
    }
    .pagination-bar span.active{background:#006699;color:#fff;font-weight:bold}
    .pagination-bar button[disabled],.paginacion-zocalo>button[disabled]{opacity:.5;cursor:not-allowed}
    .paginacion-zocalo>button{
      min-height:38px;padding:7px 12px;border:0;border-radius:9px;
      background:#fff;color:#006699;font-weight:900;cursor:pointer;
    }

    .modal-img-viewer{
      display:none;
      position:fixed;
      z-index:9999;
      inset:0;
      width:100vw;
      height:100vh;
      background:rgba(18,35,52,.95);
      justify-content:center;
      align-items:center;
      flex-direction:column;
      padding:12px;
    }
    .modal-img-viewer.open{display:flex}
    .modal-img-viewer img{
      max-width:94vw;
      max-height:84vh;
      object-fit:contain;
      border-radius:14px;
      background:#fff;
    }
    .modal-img-viewer .close-btn{
      position:absolute;top:14px;right:18px;border:0;background:none;
      color:#fff;font-size:2.2rem;font-weight:900;cursor:pointer;
    }

    @media(max-width:760px){
      .wrap{margin:0 auto 24px;padding:10px 10px 18px}
      .header{padding:10px;border-radius:14px;gap:10px;flex-wrap:nowrap}
      .activity-symbol{width:58px;height:58px;border-radius:12px;font-size:2rem}
      .title{font-size:1.28rem}
      .subtitle{font-size:.86rem}
      .controls{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0 10px}
      .cta-row{margin:0 0 14px}
      .search,.select,.gld-activity-access{width:100%;min-width:0;min-height:46px;font-size:16px;margin:0}
      .activities{gap:12px}
      .activity-card{border-radius:14px}
      .card-body{padding:12px}
      .title-card{font-size:1.32rem}
      .desc{text-align:left;font-size:.98rem}
      .contact-actions{display:grid;grid-template-columns:1fr}
      .action-btn{width:100%}
      .paginacion-zocalo{border-radius:14px;padding:8px;gap:5px;flex-wrap:wrap}
      .paginacion-zocalo>button{min-height:42px;padding:8px 12px}
      .pagination-bar{order:3;width:100%;margin:4px 0 0;padding:6px;text-align:center;white-space:normal}
      .pagination-bar button,.pagination-bar span{padding:7px 9px;margin:2px}
      .banner-tarjeta .banner-media{width:min(92vw,320px);max-width:100%}
      .banner-tarjeta .cta-btn,.banner-tarjeta .replay-btn,.activity-video-sound-btn{width:min(92vw,320px);}
    }
  </style>
</head>
<body class="gld-modulo-preparando">
  <div class="wrap" role="main">
    <div class="header">
      <div class="activity-symbol" aria-hidden="true"><i class="ri-run-line"></i></div>
      <div class="title-block">
        <h1 class="title" id="main-title">ACTIVIDADES</h1>
        <p class="subtitle" id="subtitle">Conocé todas las actividades que ofrece la ciudad, en un solo lugar.</p>
      </div>
    </div>

    <div class="controls" role="region" aria-label="Filtros de actividades">
      <input id="search" class="search" type="search" placeholder="Buscar por actividad, categoría, anunciante, día o lugar...">
      <select id="categoryFilter" class="select" aria-label="Filtrar por categoría">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <div class="cta-row">
      <a class="gld-activity-access" href="https://guialocal.ar/login-anunciantes/" target="_top" rel="noopener">
        <span class="access-icon" aria-hidden="true"><i class="ri-add-circle-line"></i></span>
        <span><strong>Sumá tu actividad</strong>Ingresá al panel para publicar y gestionar tus actividades.</span>
        <b aria-hidden="true">›</b>
      </a>
    </div>

    <div class="activities" id="activities" aria-live="polite"></div>

    <div class="paginacion-zocalo" id="paginador-abajo" hidden>
      <button type="button" id="btnAnterior" disabled>Anterior</button>
      <span id="paginationBar" class="pagination-bar"></span>
      <button type="button" id="btnSiguiente">Siguiente</button>
    </div>
  </div>

  <div class="modal-img-viewer" id="modalImgViewer" tabindex="-1" aria-modal="true" role="dialog" aria-label="Galería de imágenes">
    <button class="close-btn" id="modalImgClose" type="button" aria-label="Cerrar">&times;</button>
    <img src="" alt="Vista ampliada" id="modalImgMain">
  </div>

<script>
(() => {
  'use strict';

  const WEBAPP_URL = 'https://login.liqkoargentina.workers.dev/actividades';
  const BANNERS_URL = 'https://opensheet.elk.sh/170kTZ-ViCPxPli86g-n_XMuMv1S3O0-DbGwNFGYVnjY/banners';
  const CITY_CONTEXT_KEY = 'gld_ciudad_contexto';
  const ITEMS_PER_PAGE = 6;

  let actividadesData = [];
  let actividadesFiltradas = [];
  let currentPage = 1;
  let banners = [];
  const bannersPromise = fetch(BANNERS_URL).then(r=>r.json()).catch(()=>[]);

  const params = new URLSearchParams(window.location.search || '');
  let ciudadContexto = {
    pais_id:String(params.get('pais_id') || '').trim(),
    provincia_id:String(params.get('provincia_id') || '').trim(),
    ciudad_id:String(params.get('ciudad_id') || params.get('ciudadId') || '').trim(),
    pais:String(params.get('pais') || '').trim(),
    provincia:String(params.get('provincia') || '').trim(),
    ciudad:String(params.get('ciudad') || '').trim()
  };

  try{
    const saved = JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY) || 'null');
    if(saved){
      ['pais_id','provincia_id','ciudad_id','pais','provincia','ciudad'].forEach(k=>{
        if(!ciudadContexto[k] && saved[k]) ciudadContexto[k] = String(saved[k]).trim();
      });
    }
  }catch(e){}

  function gldActividadAvisar(estado, detalle){
    try{
      window.parent.postMessage({
        tipo:'gldModuloEstado',
        modulo:'actividades',
        estado:String(estado || ''),
        detalle:String(detalle || '')
      }, '*');
    }catch(e){}
  }

  function escapeHtml(v){
    return String(v ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function safeUrl(v){
    const s = String(v || '').trim();
    return /^https?:\/\//i.test(s) ? s : '';
  }

  function normalizeText(v){
    return String(v || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .trim();
  }

  function updateHeading(){
    const city = String(ciudadContexto.ciudad || '').trim();
    const title = document.getElementById('main-title');
    const subtitle = document.getElementById('subtitle');
    const docTitle = document.getElementById('dynamic-title');
    if(title) title.textContent = city ? `ACTIVIDADES EN ${city.toUpperCase()}` : 'ACTIVIDADES';
    if(subtitle) subtitle.textContent = 'Conocé todas las actividades que ofrece la ciudad, en un solo lugar.';
    if(docTitle) docTitle.textContent = city ? `Guía Local ${city} | Actividades` : 'Guía Local | Actividades';
  }

  async function fetchJsonConTimeout(url, ms=8000){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), ms);
    try{
      const r = await fetch(url,{signal:controller.signal,cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }finally{
      clearTimeout(timer);
    }
  }

  function getHorarios(a){
    return Array.isArray(a && a.horarios) ? a.horarios : [];
  }

  function horarioTexto(h){
    const dia = String(h && h.dia_semana || '').trim();
    const desde = String(h && h.hora_desde || '').trim();
    const hasta = String(h && h.hora_hasta || '').trim();
    if(dia && desde && hasta) return `${dia} · ${desde} a ${hasta} hs`;
    if(dia && desde) return `${dia} · ${desde} hs`;
    return dia || desde || '';
  }

  function lugarTexto(h){
    return String(
      h && (
        h.nombre_lugar ||
        h.lugar_texto ||
        h.nombre_sede ||
        h.lugar ||
        h.sede
      ) || ''
    ).trim();
  }

  function hydrateCategories(){
    const select = document.getElementById('categoryFilter');
    if(!select) return;
    const current = select.value || '';
    const map = new Map();

    actividadesData.forEach(a=>{
      const cat = String(a && a.categoria || '').trim();
      if(!cat) return;
      const key = normalizeText(cat);
      if(!map.has(key)) map.set(key,cat);
    });

    const cats = [...map.values()].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
    select.innerHTML = '<option value="">Todas las categorías</option>';
    cats.forEach(cat=>{
      const o = document.createElement('option');
      o.value = cat;
      o.textContent = cat;
      select.appendChild(o);
    });
    if(current && cats.includes(current)) select.value = current;
  }

  function actividadSearchText(a){
    const hs = getHorarios(a);
    return normalizeText([
      a.nombre,
      a.categoria,
      a.descripcion,
      a.anunciante_nombre,
      ...hs.flatMap(h=>[
        h.dia_semana,h.hora_desde,h.hora_hasta,h.nombre_lugar,
        h.lugar_texto,h.direccion,h.sector,h.responsable,h.observaciones
      ])
    ].join(' '));
  }

  function applyFilters(){
    const q = normalizeText(document.getElementById('search')?.value || '');
    const cat = String(document.getElementById('categoryFilter')?.value || '').trim();

    actividadesFiltradas = actividadesData.filter(a=>{
      if(cat && String(a.categoria || '').trim() !== cat) return false;
      if(!q) return true;
      return actividadSearchText(a).includes(q);
    });

    renderActivities(1);
  }

  function contactData(a){
    const c = (a && a.contacto && typeof a.contacto === 'object') ? a.contacto : {};
    return {
      telefono:String(c.telefono || c.telefono2 || a.telefono || '').trim(),
      whatsapp:String(c.whatsapp || c.whatsapp2 || a.whatsapp || '').trim(),
      mail:String(c.mail || c.mail2 || a.mail || '').trim(),
      instagram:String(c.instagram || a.instagram || '').trim(),
      web:String(a.web || c.web || '').trim()
    };
  }

  function onlyDigits(v){ return String(v || '').replace(/\D+/g,''); }

  function renderContactActions(a){
    const c = contactData(a);
    const parts = [];

    if(c.whatsapp){
      const digits = onlyDigits(c.whatsapp);
      if(digits) parts.push(`<a class="action-btn primary" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(digits)}"><i class="ri-whatsapp-line"></i> WhatsApp</a>`);
    }

    if(c.telefono){
      parts.push(`<a class="action-btn" href="tel:${escapeHtml(c.telefono)}"><i class="ri-phone-line"></i> Llamar</a>`);
    }

    if(c.mail){
      parts.push(`<a class="action-btn" href="mailto:${escapeHtml(c.mail)}"><i class="ri-mail-line"></i> Email</a>`);
    }

    const ig = safeUrl(c.instagram);
    if(ig){
      parts.push(`<a class="action-btn" target="_blank" rel="noopener" href="${escapeHtml(ig)}"><i class="ri-instagram-line"></i> Instagram</a>`);
    }

    const web = safeUrl(c.web);
    if(web){
      parts.push(`<a class="action-btn" target="_blank" rel="noopener" href="${escapeHtml(web)}"><i class="ri-global-line"></i> Web</a>`);
    }

    const ins = String(a.inscripcion || '').trim();
    const insUrl = safeUrl(ins);
    if(insUrl){
      parts.unshift(`<a class="action-btn primary" target="_blank" rel="noopener" href="${escapeHtml(insUrl)}"><i class="ri-edit-box-line"></i> Inscripción</a>`);
    }

    return parts.length ? `<div class="contact-actions">${parts.join('')}</div>` : '';
  }

  function renderSchedules(a){
    const horarios = getHorarios(a);
    if(!horarios.length) return '';

    const items = horarios.map(h=>{
      const ht = horarioTexto(h);
      const lugar = lugarTexto(h);
      const dir = String(h.direccion || '').trim();
      const sector = String(h.sector || '').trim();
      const responsable = String(h.responsable || '').trim();
      const obs = String(h.observaciones || '').trim();
      const maps = safeUrl(h.maps);

      return `<div class="schedule-item">
        ${ht ? `<div class="schedule-line"><i class="ri-calendar-schedule-line"></i><strong>${escapeHtml(ht)}</strong></div>` : ''}
        ${lugar ? `<div class="schedule-line"><i class="ri-map-pin-line"></i><span>${escapeHtml(lugar)}</span></div>` : ''}
        ${dir ? `<div class="schedule-line"><i class="ri-road-map-line"></i><span>${escapeHtml(dir)}</span></div>` : ''}
        ${sector ? `<div class="schedule-line"><i class="ri-layout-grid-line"></i><span>${escapeHtml(sector)}</span></div>` : ''}
        ${responsable ? `<div class="schedule-line"><i class="ri-user-star-line"></i><span>${escapeHtml(responsable)}</span></div>` : ''}
        ${obs ? `<div class="schedule-line"><i class="ri-information-line"></i><span>${escapeHtml(obs)}</span></div>` : ''}
        ${maps ? `<a class="map-link" href="${escapeHtml(maps)}" target="_blank" rel="noopener"><i class="ri-navigation-line"></i> Cómo llegar</a>` : ''}
      </div>`;
    }).join('');

    return `<div class="schedule-title"><i class="ri-time-line"></i> Días, horarios y lugares</div>
            <div class="schedule-list">${items}</div>`;
  }

  function getImages(a){
    return ['img1','img2','img3','img4','img5']
      .map(k=>safeUrl(a && a[k]))
      .filter(Boolean);
  }

  function renderGallery(a,index){
    const imgs = getImages(a);
    if(!imgs.length) return '';

    return `<div class="gallery" data-gallery="${index}">
      <img class="gallery-main" src="${escapeHtml(imgs[0])}" alt="${escapeHtml(a.nombre || 'Actividad')}" loading="lazy" data-full="${escapeHtml(imgs[0])}">
      ${imgs.length>1 ? `<div class="gallery-thumbs">${imgs.map((src,i)=>
        `<img class="gallery-thumb ${i===0?'active':''}" src="${escapeHtml(src)}" alt="" loading="lazy" data-src="${escapeHtml(src)}">`
      ).join('')}</div>` : ''}
    </div>`;
  }

  function isVideoFile(url){
    return typeof url==='string' && /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
  }

  function isYouTube(url){
    return typeof url==='string' && /youtu(be\.com|\.be)/i.test(url);
  }

  function getYouTubeEmbedUrl(url){
    try{
      let id='';
      const u=new URL(url);
      if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1);
      else{
        id=u.searchParams.get('v')||'';
        if(!id){ const parts=u.pathname.split('/').filter(Boolean); id=parts.pop()||''; }
      }
      if(!id) return '';
      const p=new URLSearchParams({
        rel:0,playsinline:1,enablejsapi:1,modestbranding:1,
        autoplay:1,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3
      });
      return `https://www.youtube.com/embed/${id}?${p.toString()}`;
    }catch(e){ return ''; }
  }

  function activityYtCommand(frame,func,args){
    try{
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:Array.isArray(args)?args:[]}), '*');
      }
    }catch(e){}
  }

  function attachActivitySoundButton(media,banner){
    if(!media || !banner) return;
    const old=banner.querySelector('.activity-video-sound-btn');
    if(old) old.remove();

    let muted=true;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='activity-video-sound-btn';

    function paint(){
      btn.textContent=muted ? '🔊 Activar sonido' : '🔇 Silenciar';
      btn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
    }

    btn.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      muted=!muted;
      if(String(media.tagName||'').toLowerCase()==='video'){
        media.muted=muted;
        if(!muted) media.volume=1;
        try{ const p=media.play(); if(p&&p.catch) p.catch(()=>{}); }catch(err){}
      }else{
        if(muted){ activityYtCommand(media,'mute'); }
        else{
          activityYtCommand(media,'unMute');
          activityYtCommand(media,'setVolume',[100]);
          activityYtCommand(media,'playVideo');
          setTimeout(()=>activityYtCommand(media,'playVideo'),80);
        }
      }
      paint();
    };

    const cta=banner.querySelector('.cta-btn');
    if(cta) banner.insertBefore(btn, cta);
    else banner.appendChild(btn);
    paint();
  }

  function renderBanner(banner,idx){
    const id=`activity-banner-${idx}-${Math.floor(Math.random()*10000)}`;
    const cta=(banner.cta&&banner.cta.trim()) ? banner.cta.trim() : 'https://www.guialocal.ar/';
    const replay=`<button class="replay-btn" data-target-id="${id}">Reproducir nuevamente</button>`;

    if(banner.img){
      return `<div class="banner-tarjeta">
        <div id="${id}" class="banner-media"><img src="${banner.img}" alt="Banner"></div>
        ${replay}
        <a class="cta-btn" href="${cta}" target="_blank" rel="noopener noreferrer">Visitá el micrositio del anunciante</a>
      </div>`;
    }
    if(banner.media && isVideoFile(banner.media)){
      const poster=banner.poster ? `poster="${banner.poster}"` : '';
      return `<div class="banner-tarjeta">
        <div id="${id}" class="banner-media">
          <video class="banner-media-video" data-src="${banner.media}" ${poster} muted playsinline preload="metadata"></video>
        </div>
        ${replay}
        <a class="cta-btn" href="${cta}" target="_blank" rel="noopener noreferrer">Visitá el micrositio del anunciante</a>
      </div>`;
    }
    if(banner.media && isYouTube(banner.media)){
      const embed=getYouTubeEmbedUrl(banner.media);
      return `<div class="banner-tarjeta">
        <div id="${id}" class="banner-media" data-src="${embed}"></div>
        ${replay}
        <a class="cta-btn" href="${cta}" target="_blank" rel="noopener noreferrer">Visitá el micrositio del anunciante</a>
      </div>`;
    }
    return '';
  }

  function initActivityBanners(){
    document.querySelectorAll('.banner-tarjeta').forEach(banner=>{
      const host=banner.querySelector('.banner-media');
      if(!host) return;

      const native=host.querySelector('video');
      if(native){
        const src=native.dataset.src||'';
        if(src && !native.src){
          native.src=src;
          native.muted=true;
          native.playsInline=true;
          native.autoplay=true;
          try{ const p=native.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
        }
        attachActivitySoundButton(native,banner);
        const replay=banner.querySelector('.replay-btn');
        native.onended=()=>{ if(replay) replay.style.display='inline-flex'; };
        return;
      }

      const ds=host.dataset.src||'';
      if(ds && !host.querySelector('iframe')){
        const iframe=document.createElement('iframe');
        iframe.src=ds;
        iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
        iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');
        iframe.setAttribute('allowfullscreen','true');
        host.appendChild(iframe);
        attachActivitySoundButton(iframe,banner);
      }
    });

    document.querySelectorAll('.banner-tarjeta .replay-btn').forEach(btn=>{
      btn.onclick=function(){
        const host=document.getElementById(btn.dataset.targetId||'');
        if(!host) return;
        const video=host.querySelector('video');
        const iframe=host.querySelector('iframe');
        if(video){
          try{ video.currentTime=0; video.play(); btn.style.display='none'; }catch(e){}
        }else if(iframe){
          activityYtCommand(iframe,'seekTo',[0,true]);
          activityYtCommand(iframe,'playVideo');
          btn.style.display='none';
        }
      };
    });
  }

  function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }

  function buildBannerSequence(slots){
    if(!banners.length || slots<=0) return [];
    const out=[];
    while(out.length<slots){
      const pool=banners.slice();
      shuffleArray(pool);
      for(const b of pool){
        if(out.length>=slots) break;
        out.push(b);
      }
      if(!pool.length) break;
    }
    return out.slice(0,slots);
  }

  function renderCard(a,index){
    const logo = safeUrl(a.logo_anunciante);
    const catLogo = safeUrl(a.logo_categoria);
    const ins = String(a.inscripcion || '').trim();
    const insUrl = safeUrl(ins);

    return `<article class="activity-card">
      <div class="card-head">
        <div class="organizer">
          <span class="organizer-label">Ofrece</span>
          ${logo ? `<img class="organizer-logo" src="${escapeHtml(logo)}" alt="" loading="lazy">` : ''}
          <span class="organizer-name">${escapeHtml(a.anunciante_nombre || '')}</span>
        </div>
      </div>

      <div class="card-body">
        <h2 class="title-card">${escapeHtml(a.nombre || 'Actividad')}</h2>

        ${a.categoria ? `<div class="category-group">
          <span class="category-chip">
            ${catLogo ? `<img class="category-logo" src="${escapeHtml(catLogo)}" alt="">` : '<i class="ri-price-tag-3-line"></i>'}
            ${escapeHtml(a.categoria)}
          </span>
        </div>` : ''}

        ${a.descripcion ? `<div class="desc">${escapeHtml(a.descripcion)}</div>` : ''}

        ${ins && !insUrl ? `<div class="schedule-line" style="margin-top:13px"><i class="ri-edit-box-line"></i><span><strong>Inscripción:</strong> ${escapeHtml(ins)}</span></div>` : ''}

        ${renderSchedules(a)}
        ${renderGallery(a,index)}
        ${renderContactActions(a)}
      </div>
    </article>`;
  }

  function renderActivities(page){
    const total = actividadesFiltradas.length;
    const totalPages = Math.max(1,Math.ceil(total / ITEMS_PER_PAGE));
    currentPage = Math.min(Math.max(1,Number(page)||1),totalPages);

    const cont = document.getElementById('activities');
    if(!cont) return;

    if(!total){
      cont.innerHTML = '<div class="empty">No encontramos actividades para los filtros seleccionados.</div>';
      renderPaginator(0,1);
      return;
    }

    const start = (currentPage-1)*ITEMS_PER_PAGE;
    const slice = actividadesFiltradas.slice(start,start+ITEMS_PER_PAGE);
    const bannerSeq = buildBannerSequence(Math.floor((slice.length - 1) / 2));

    const parts = [];
    let visibleCount = 0;
    slice.forEach((a,i)=>{
      parts.push(renderCard(a,start+i));
      visibleCount++;
      if(visibleCount % 2 === 0 && i < slice.length - 1){
        const banner = bannerSeq[(visibleCount/2)-1];
        if(banner) parts.push(renderBanner(banner,`inter-${currentPage}-${visibleCount}`));
      }
    });
    cont.innerHTML = parts.join('');

    bindGalleries();
    initActivityBanners();
    renderPaginator(total,currentPage);
  }

  function paginationItems(current,total){
    if(total<=7) return Array.from({length:total},(_,i)=>i+1);
    const out=[1];
    const from=Math.max(2,current-1);
    const to=Math.min(total-1,current+1);
    if(from>2) out.push('…');
    for(let i=from;i<=to;i++) out.push(i);
    if(to<total-1) out.push('…');
    out.push(total);
    return out;
  }

  function renderPaginator(total,page){
    const box = document.getElementById('paginador-abajo');
    const bar = document.getElementById('paginationBar');
    const prev = document.getElementById('btnAnterior');
    const next = document.getElementById('btnSiguiente');
    const totalPages = Math.ceil(total / ITEMS_PER_PAGE);

    if(!box || !bar || !prev || !next) return;

    if(totalPages<=1){
      box.hidden = true;
      bar.innerHTML = '';
      return;
    }

    box.hidden = false;
    prev.disabled = page<=1;
    next.disabled = page>=totalPages;
    prev.onclick = ()=>{ if(page>1){ renderActivities(page-1); window.scrollTo({top:0,behavior:'smooth'}); } };
    next.onclick = ()=>{ if(page<totalPages){ renderActivities(page+1); window.scrollTo({top:0,behavior:'smooth'}); } };

    bar.innerHTML = '';
    paginationItems(page,totalPages).forEach(item=>{
      if(item==='…'){
        const span=document.createElement('span');
        span.textContent='…';
        bar.appendChild(span);
      }else if(item===page){
        const span=document.createElement('span');
        span.className='active';
        span.textContent=item;
        bar.appendChild(span);
      }else{
        const btn=document.createElement('button');
        btn.type='button';
        btn.textContent=item;
        btn.onclick=()=>{renderActivities(item);window.scrollTo({top:0,behavior:'smooth'});};
        bar.appendChild(btn);
      }
    });
  }

  function bindGalleries(){
    document.querySelectorAll('.gallery').forEach(g=>{
      const main = g.querySelector('.gallery-main');
      const thumbs = g.querySelectorAll('.gallery-thumb');
      thumbs.forEach(t=>{
        t.addEventListener('click',()=>{
          if(!main) return;
          const src=t.dataset.src || '';
          if(!src) return;
          main.src=src;
          main.dataset.full=src;
          thumbs.forEach(x=>x.classList.toggle('active',x===t));
        });
      });
      main?.addEventListener('click',()=>openModal(main.dataset.full || main.src));
    });
  }

  function openModal(src){
    const modal = document.getElementById('modalImgViewer');
    const img = document.getElementById('modalImgMain');
    if(!modal || !img || !src) return;
    img.src=src;
    modal.classList.add('open');
  }

  function closeModal(){
    document.getElementById('modalImgViewer')?.classList.remove('open');
  }

  document.getElementById('modalImgClose')?.addEventListener('click',closeModal);
  document.getElementById('modalImgViewer')?.addEventListener('click',e=>{
    if(e.target && e.target.id==='modalImgViewer') closeModal();
  });

  async function iniciarModuloActividades(){
    if(!ciudadContexto.ciudad_id){
      gldActividadAvisar('error','No hay una ciudad seleccionada.');
      return;
    }

    try{
      updateHeading();

      const u = new URL(WEBAPP_URL);
      u.searchParams.set('action','publicas');
      u.searchParams.set('ciudad_id',ciudadContexto.ciudad_id);
      u.searchParams.set('_ts',Date.now());

      const response = await fetchJsonConTimeout(u.toString(),8000);
      if(!response || response.success!==true){
        throw new Error((response && (response.error || response.message)) || 'Respuesta inválida.');
      }

      actividadesData = Array.isArray(response.actividades) ? response.actividades : [];
      actividadesFiltradas = actividadesData.slice();

      hydrateCategories();
      applyFilters();

      document.body.classList.remove('gld-modulo-preparando');
      gldActividadAvisar('ready');

      bannersPromise.then(raw=>{
        banners=(Array.isArray(raw)?raw:[])
          .filter(b=>{
            const a=String(b.aprobado ?? '').trim().toLowerCase();
            return a==='true' || a==='1' || a==='x';
          })
          .map(b=>({
            img:String(b.img || b.url || '').trim(),
            media:String(b.media || '').trim(),
            cta:String(b.cta || '').trim(),
            poster:String(b.poster || '').trim()
          }))
          .filter(b=>b.img || b.media);
        if(banners.length) renderActivities(currentPage);
      }).catch(()=>{});
    }catch(err){
      console.error('Actividades:',err);
      document.body.classList.add('gld-modulo-preparando');
      gldActividadAvisar('error','No se pudieron cargar las actividades. Podés reintentar sin salir de Actividades.');
    }
  }

  document.getElementById('search')?.addEventListener('input',applyFilters);
  document.getElementById('categoryFilter')?.addEventListener('change',applyFilters);

  iniciarModuloActividades();

  
})();
</script>
