<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prueba Guía</title>
</head>
<body>
  <div style="font-family:Arial,sans-serif;padding:20px">Cargando Guía de prueba...</div>
  <script>
  (async function(){
    try{
      const r=await fetch('./guia.html',{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar guia.html');
      let html=await r.text();
      const addons=[
        '<script src="https://cdn.jsdelivr.net/gh/liqko/guia-local-dolores@guia-eventos-actividades/plataforma/guia-modulos-fix.js"><\\/script>',
        '<script src="https://cdn.jsdelivr.net/gh/liqko/guia-local-dolores@guia-eventos-actividades/plataforma/eventos-programacion-publica.js"><\\/script>'
      ].join('\\n');
      html=html.replace('</body>',addons+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:20px;color:#c00"><b>Error:</b> '+String(e.message||e)+'</div>';
    }
  })();
  </script>
</body>
</html>
