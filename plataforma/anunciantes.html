        }
        function sedeAccIds(sede){
          return ((((sede||{}).relaciones||{}).acciones)||[])
            .map(x=>String(x.accion_id||'').trim()).filter(Boolean);
        }

        function sedeCumpleSegundoFiltro(sede,filtro){
          filtro=String(filtro||'').trim();
          if(!filtro) return true;
          if(filtro.startsWith('ACT:')) return sedeActIds(sede).includes(filtro.slice(4));
          if(filtro.startsWith('ACC:')) return sedeAccIds(sede).includes(filtro.slice(4));
          return true;
        }

        function tarjetaDeSede(item,sede){
          const out=Object.assign({},item);
          out.__sede_individual=true;
          out.sedes=[sede];

          [
            'telefono','telefono2','telefono3','telefono4','telefono5',
            'whatsapp','whatsapp2','whatsapp3','whatsapp4','whatsapp5',
            'mail','mail2','mail3','instagram','facebook','youtube','tiktok','linkedin','x'
          ].forEach(k=>out[k]=(sede&&sede[k])||'');

          for(let i=1;i<=10;i++) out['img'+i]=(sede&&sede['img'+i])||'';

          const rel=(sede&&sede.relaciones)||{};
          out.actividades_clave=Array.isArray(rel.actividades)?rel.actividades:[];
          out.acciones=Array.isArray(rel.acciones)?rel.acciones:[];
          out.nodos=Array.isArray(rel.nodos)?rel.nodos:[];

          out.direccion=(sede&&sede.direccion)||'';
          out.maps=(sede&&sede.maps)||'';
          out.lat=(sede&&sede.lat)||'';
          out.lng=(sede&&sede.lng)||'';
          out.ciudad=(sede&&sede.ciudad)||'';
          return out;
        }

        function textoTags(v){
          if(v === null || v === undefined) return '';
          if(Array.isArray(v)) return v.map(textoTags).join(' ');
          if(typeof v === 'object') return Object.values(v).map(textoTags).join(' ');
          return String(v).replace(/[;,|#]+/g,' ');
        }

        function textoGlobalItem(item){
          const meta = metaPorIdGlobal[String(item && item.id || '').trim()] || {};
          return [
            item.nombre,item.segmento,item.categoria,item.actividad,
            textoTags(item.tags),textoTags(meta.tags),item.adicionales,
            item.descripcion,item.link,
            ...(item.actividades_clave||[]).map(x=>x&&x.nombre),
            ...(item.acciones||[]).map(x=>x&&x.nombre),
            ...(item.nodos||[]).map(x=>x&&x.nombre),
            ...(item.sedes||[]).flatMap(s=>[
              s&&s.nombre_sede,s&&s.direccion,s&&s.ciudad,s&&s.provincia,s&&s.pais,
              textoTags(s&&s.tags)
            ])
          ].filter(Boolean).join(' ');
        }

        function render() {
          const qGlobal=normalizar(buscadorGlobal.value.trim());
          const clasificacion=String(selectClasificacion.value||'').trim();
          const accionesElegidas=accionesSeleccionadas();

          let base=serviciosData.filter(item=>{
            if(clasificacion.startsWith('SEG:')){
              return canonicalSegmentoIds(item).includes(clasificacion.slice(4));
            }
            if(clasificacion.startsWith('CAT:')){
              // Un anunciante con varias categorías aparece en CADA categoría que tenga.
              return canonicalCategoriaIds(item).includes(clasificacion.slice(4));
            }
            return true;
          });

          if(clasificacion || accionesElegidas.length || qGlobal){
            base=base.flatMap(item=>{
              const sedes=Array.isArray(item.sedes)?item.sedes:[];
              const requiereSede=clasificacion.startsWith('ACT:') || accionesElegidas.length>0;

              if(!sedes.length) return requiereSede ? [] : [item];

              return sedes
                .filter(sede=>{
                  if(clasificacion.startsWith('ACT:') && !sedeActIds(sede).includes(clasificacion.slice(4))) return false;

                  const accionesSede=sedeAccIds(sede);
                  if(accionesElegidas.some(id=>!accionesSede.includes(id))) return false;

                  return true;
                })
                .map(sede=>tarjetaDeSede(item,sede));
            });
          }

          let filtrados=base.filter(item=>{
            if(!qGlobal) return true;
            return normalizar(textoGlobalItem(item)).includes(qGlobal);
          }).sort((a,b)=>{
            if(Number(b.nivel)!==Number(a.nivel)) return Number(b.nivel)-Number(a.nivel);
            return Number(a.subnivel)-Number(b.subnivel);
          });

          // Nivel 6 siempre visible, independientemente de búsqueda/filtros.
          // Página 1: tarjetas completas. Página 2+: carrusel superior.
          // La publicidad se inserta sólo entre tarjetas normales, nunca dentro del Nivel 6.
          const destacadasSiempre=getDestacadas(serviciosData);
          const normales=filtrados.filter(item=>!(Number(item.nivel)===6));
          totalPaginas=Math.max(1,Math.ceil(normales.length/resultadosPorPagina));
          if(paginaActual>totalPaginas) paginaActual=totalPaginas;
          if(paginaActual<1) paginaActual=1;

          const inicio=(paginaActual-1)*resultadosPorPagina;
          const fin=inicio+resultadosPorPagina;
          const normalesPaginadas=normales.slice(inicio,fin);

          btnAnterior.disabled=paginaActual===1;
          btnSiguiente.disabled=paginaActual===totalPaginas;
          buildPaginationBar(paginationBar);

          if(paginaActual===1) renderDestacadas(destacadasSiempre);
          else renderDestacadasCarrusel(destacadasSiempre);
          renderNormales(normalesPaginadas,destacadasSiempre.length);
        }

        buscadorGlobal.addEventListener('input', () => {
          paginaActual = 1;
          render();
        });

        function actualizarBotonesModulosVisibles(){
          document.querySelectorAll('[data-card-actions]').forEach(zone => {
            const key = String(zone.getAttribute('data-card-actions') || '').trim();
            const item = serviciosData.find(x =>
              String(x.id || x.__id || x.id_comercio || x.nombre || '').trim() === key
            );
            if(!item) return;
            const nuevo = renderEventosActivosButton(item) + renderPromosActivasButton(item) + renderActividadesActivasButton(item);
            if(zone.innerHTML !== nuevo) zone.innerHTML = nuevo;
          });
        }

        // Primer render: sólo con los datos de la guía.
        render();

        // Segunda etapa: estos módulos recién arrancan cuando la carga principal libera el bloqueo.
        eventosCargaPromise.then(eventsLoaded => {
          rawEventsResponse = eventsLoaded || [];
          rawEventsList = Array.isArray(rawEventsResponse)
            ? rawEventsResponse
            : ((rawEventsResponse && (rawEventsResponse.data || rawEventsResponse.events)) || []);
          activeEvents = rawEventsList.filter(eventIsActive);
          actualizarBotonesModulosVisibles();
        }).catch(err => console.warn('Eventos no disponibles todavía:', err));

        promosCargaPromise.then(promosLoaded => {
          rawPromosResponse = promosLoaded || [];
          rawPromosList = Array.isArray(rawPromosResponse)
            ? rawPromosResponse
            : ((rawPromosResponse && (rawPromosResponse.promos || rawPromosResponse.data || rawPromosResponse.rows)) || []);
          activePromos = rawPromosList.filter(p => promoIsActive(p) && promoMatchesCurrentCity(p));
          actualizarBotonesModulosVisibles();
        }).catch(err => console.warn('Promos no disponibles todavía:', err));

        actividadesCargaPromise.then(resp => {
          activeActivities=(resp && Array.isArray(resp.actividades)) ? resp.actividades : [];
          actualizarBotonesModulosVisibles();
        }).catch(err => console.warn('Actividades no disponibles todavía:', err));

        const publicidadRenderPromise=publicidadCargaPromise.then(resp => {
          rawBanners = (resp && Array.isArray(resp.publicidades)) ? resp.publicidades : [];
          banners = rawBanners.map(p=>({
            publicidad_id:String(p.publicidad_id||''),
            formato:String(p.formato||'').toUpperCase(),
            titulo:String(p.titulo||''),
            media_items:Array.isArray(p.media)?p.media:[],
            cta:String(p.cta_destino||''),
            cta_texto:String(p.cta_texto||''),
            categoria_ids:[...new Set((p.segmentacion||[]).map(s=>String(s.categoria_id||'').trim()).filter(Boolean))]
          })).filter(p=>p.media_items.length);
          render();

          if(gldDestinoPendiente){
            requestAnimationFrame(()=>{
              requestAnimationFrame(()=>{
                const destino=document.getElementById(gldDestinoPendiente);
                if(destino) destino.scrollIntoView({behavior:'smooth',block:'start'});
                gldDestinoPendiente='';
              });
            });
          }
        }).catch(err => console.warn('Publicidad no disponible todavía:', err));

        // La Guía no se considera terminada hasta que la publicidad ya fue
        // incorporada al layout. Así no hay un segundo salto grande después.
        await publicidadRenderPromise;

        window.addEventListener('scroll', () => {
          const topBtn = document.getElementById('topBtn');
          if (window.scrollY > 200) topBtn.style.display = 'flex';
          else topBtn.style.display = 'none';
        }, { passive: true });

      } catch(e) {
        console.warn('Guía no disponible todavía:', e);
        const cont = document.getElementById('contenedor');
        gldMostrarReintento(cont,'La Guía está demorando más de lo habitual.',()=>cargarGuiaSeleccionada());
      }
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(id && nombre) {
          const op = document.createElement('option');
          op.value = id;
          op.textContent = nombre;
          select.appendChild(op);
        }
      });
    }

    async function cargarUbicaciones() {
      const data = await jsonpApi({action:'ubicaciones'}, 15000);
      if(!data || data.success !== true) {
        throw new Error((data && (data.error || data.message)) || 'Ubicaciones inválidas');
      }
      return data;
    }

    function iniciarBootstrapCompleto(){
      if(!bootstrapCompletoPromise){
        bootstrapCompletoPromise = jsonpApi({action:'bootstrap'}, 30000)
          .then(data=>{
            if(!data || data.success !== true){
              throw new Error((data && (data.error || data.message)) || 'Bootstrap inválido');
            }

            catalogosGlobales.segmentos = Array.isArray(data.segmentos) ? data.segmentos : [];
            catalogosGlobales.segmentosPublicos = Array.isArray(data.segmentos_publicos)
              ? data.segmentos_publicos
              : catalogosGlobales.segmentos.filter(s => {
                  const v = String(s.visible_publico ?? '').trim().toLowerCase();
                  return v === 'true' || v === '1' || v === 'x' || v === 'si' || v === 'sí';
                });
            catalogosGlobales.categorias = Array.isArray(data.categorias) ? data.categorias : [];
            catalogosGlobales.actividades = Array.isArray(data.actividades_clave) ? data.actividades_clave : [];
            catalogosGlobales.acciones = Array.isArray(data.acciones) ? data.acciones : [];
            catalogosGlobales.nodos = Array.isArray(data.nodos) ? data.nodos : [];
            relacionesSedesGlobales = (data.relaciones_sedes && typeof data.relaciones_sedes === 'object') ? data.relaciones_sedes : {};
            metaPorIdGlobal = (data.meta_por_id && typeof data.meta_por_id === 'object') ? data.meta_por_id : {};
            return data;
          })
          .catch(err=>{
            bootstrapCompletoPromise = null;
            throw err;
          });
      }
      return bootstrapCompletoPromise;
    }

    function normId(v){
      return String(v || '').trim().toLowerCase();
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(!id || !nombre) return;

        const op = document.createElement('option');
        op.value = id;
        op.textContent = nombre;
        select.appendChild(op);
      });
    }

    function perteneceAProvincia(provincia, paisSeleccionado, paises){
      const ref = normId(provincia && (provincia.pais_id || provincia.pais));
      if(!ref) return false;

      const pais = (paises || []).find(p => normId(p.pais_id) === normId(paisSeleccionado));
      if(!pais) return false;

      return ref === normId(pais.pais_id) || ref === normId(pais.nombre);
    }

    function perteneceACiudad(ciudad, provinciaSeleccionada, provincias){
      const ref = normId(ciudad && (ciudad.provincia_id || ciudad.provincia));
      if(!ref) return false;

      const provincia = (provincias || []).find(p => normId(p.provincia_id) === normId(provinciaSeleccionada));
      if(!provincia) return false;

      return ref === normId(provincia.provincia_id) || ref === normId(provincia.nombre);
    }

    async function iniciarGuiaDesdeMochila(){
      // El HTML vive dentro de un embed. La ciudad está en la URL pública de Jimdo,
      // por eso también la leemos desde la página que contiene el embed.
      let qs = new URLSearchParams(window.location.search || '');
      try{
        const ref = new URL(document.referrer || '');
        const refQs = new URLSearchParams(ref.search || '');
        if(!qs.get('ciudad_id') && refQs.get('ciudad_id')) qs = refQs;
      }catch(e){}

      let ctx = null;
      try{ ctx = JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY) || 'null'); }catch(e){}

      const subscriberSession = gldGetSubscriberSession();
      const subscriberDefaultCity = String(subscriberSession && subscriberSession.ciudad_predeterminada_id || '').trim();

      const accesoConUbicacion = String(
        qs.get('ciudad_id') ||
        (ctx && ctx.ciudad_id) ||
        subscriberDefaultCity ||
        ''
      ).trim();
      if(!accesoConUbicacion){
        try{ window.top.location.href = 'https://guialocal.ar/'; }
        catch(e){ window.location.href = 'https://guialocal.ar/'; }
        return;
      }

      if(!paisSeleccionado) paisSeleccionado = String(qs.get('pais_id') || (ctx && ctx.pais_id) || '').trim();
      if(!provinciaSeleccionada) provinciaSeleccionada = String(qs.get('provincia_id') || (ctx && ctx.provincia_id) || '').trim();
      if(!ciudadSeleccionada) ciudadSeleccionada = accesoConUbicacion;

      if(!ciudadSeleccionada && ctx && ctx.ciudad_id){
        paisSeleccionado = String(ctx.pais_id || '').trim();
        provinciaSeleccionada = String(ctx.provincia_id || '').trim();
        ciudadSeleccionada = String(ctx.ciudad_id || '').trim();
      }

      if(!ciudadSeleccionada){
        try{ window.top.location.href = 'https://guialocal.ar/'; }
        catch(e){ window.location.href = 'https://guialocal.ar/'; }
        return;
      }

      gldBloquearCargaSecundaria();
      gldSetModuloCargando('guia',true,'Cargando Guía...');
      document.body.classList.add('gld-guia-cargando');
      document.getElementById('guiaCargaPrincipal')?.classList.add('activo');

      // La lectura principal arranca YA. No espera ubicación visible, bootstrap,
      // favoritos, farmacia, efemérides ni módulos secundarios.
      const guiaInicioPromise = prefetchGuia(
        paisSeleccionado,
        provinciaSeleccionada,
        ciudadSeleccionada
      );

      const farmaInicioPromise=cargarFarmaciasTurnoGuia().catch(e=>{
        console.error('Farmacias:',e);
      });

      function nombreVisibleValido(nombre, id){
        const n=String(nombre||'').trim();
        const i=String(id||'').trim();
        if(!n) return '';
        if(i && normId(n)===normId(i)) return '';
        return n;
      }

      let ciudadNombre = nombreVisibleValido(qs.get('ciudad') || (ctx && ctx.ciudad), ciudadSeleccionada);
      let provinciaNombre = nombreVisibleValido(qs.get('provincia') || (ctx && ctx.provincia), provinciaSeleccionada);
      let paisNombre = nombreVisibleValido(qs.get('pais') || (ctx && ctx.pais), paisSeleccionado);

      // Si el contexto sólo trae IDs, resolvemos los nombres reales con el catálogo
      // de ubicaciones que ya utiliza la Guía. Los IDs nunca se muestran al usuario.
      if(!ciudadNombre || !provinciaNombre || !paisNombre){
        try{
          const ubicaciones = await cargarUbicaciones();
          const paises = Array.isArray(ubicaciones.paises) ? ubicaciones.paises : [];
          const provincias = Array.isArray(ubicaciones.provincias) ? ubicaciones.provincias : [];
          const ciudades = Array.isArray(ubicaciones.ciudades) ? ubicaciones.ciudades : [];

          let ciudadObj = ciudades.find(x => normId(x.ciudad_id || x.id) === normId(ciudadSeleccionada));

          // Cuando venimos desde Suscriptores puede llegar sólo ciudad_id.
          // Completamos provincia y país desde el catálogo real de ubicaciones.
          if(ciudadObj && !provinciaSeleccionada){
            provinciaSeleccionada=String(ciudadObj.provincia_id || '').trim();
          }

          let provinciaObj = provincias.find(x => normId(x.provincia_id || x.id) === normId(provinciaSeleccionada));
          if(provinciaObj && !paisSeleccionado){
            paisSeleccionado=String(provinciaObj.pais_id || '').trim();
          }

          let paisObj = paises.find(x => normId(x.pais_id || x.id) === normId(paisSeleccionado));

          if(!paisNombre && paisObj) paisNombre = String(paisObj.nombre || paisObj.pais || '').trim();
          if(!provinciaNombre && provinciaObj) provinciaNombre = String(provinciaObj.nombre || provinciaObj.provincia || '').trim();
          if(!ciudadNombre && ciudadObj) ciudadNombre = String(ciudadObj.nombre || ciudadObj.ciudad || '').trim();
        }catch(e){
          console.warn('No se pudieron resolver los nombres de ubicación:', e);
        }
      }

      const titulo = document.getElementById('tituloGuia');
      const sub = document.getElementById('ubicacionSubtitulo');
      if(titulo) titulo.textContent = ciudadNombre ? ciudadNombre.toUpperCase() : 'CIUDAD';
      if(sub) sub.textContent = [provinciaNombre, paisNombre]
        .filter(Boolean)
        .map(v=>String(v).toUpperCase())
        .join(' · ');

      const nuevoCtx = {
        pais_id:paisSeleccionado,
        provincia_id:provinciaSeleccionada,
        ciudad_id:ciudadSeleccionada,
        pais:paisNombre,
        provincia:provinciaNombre,
        ciudad:ciudadNombre,
        ts:Date.now()
      };
      try{ localStorage.setItem(CITY_CONTEXT_KEY, JSON.stringify(nuevoCtx)); }catch(e){}
      const farmaCiudadLabel=document.getElementById('farmaTurnoCiudad');
      if(farmaCiudadLabel && ciudadNombre) farmaCiudadLabel.textContent=`Turnos para ${ciudadNombre}`;

      // Si la persona está logueada y está visitando una ciudad distinta de su habitual,
      // ofrecemos cambiarla. Sólo se escribe en la hoja si responde que sí.
      setTimeout(()=>gldShowCityPreferencePrompt(ciudadSeleccionada,ciudadNombre),250);

      const promo = document.getElementById('moduloPromos');
      if(promo){
        const u = new URL('https://guialocal.ar/promos/');
        Object.entries(nuevoCtx).forEach(([k,v])=>{
          if(k !== 'ts' && v) u.searchParams.set(k,v);
        });
        promo.href = u.toString();
      }
      const eventos = document.getElementById('moduloEventos');
      if(eventos){
        const u = new URL(EVENTS_PAGE_URL);
        Object.entries(nuevoCtx).forEach(([k,v])=>{
          if(k !== 'ts' && v) u.searchParams.set(k,v);
        });
        eventos.href = u.toString();
      }

      const cambiar = document.getElementById('cambiarCiudad');
      if(cambiar){
        cambiar.addEventListener('click', ()=>{
          gldMarkCityChangePending();
          try{ localStorage.removeItem(CITY_CONTEXT_KEY); }catch(e){}
          gldClearCityPreferenceSkip();
          try{ window.top.location.href = 'https://guialocal.ar/'; }
          catch(e){ window.location.href = 'https://guialocal.ar/'; }
        });
      }

      const favoritosInicioPromise = subscriberSession
        ? gldCargarFavoritosAnunciantes()
        : Promise.resolve();

      // Primera etapa: publicidad y efemérides forman parte de la carga general.
      const publicidadInicioPromise = obtenerBannersPromise();
      const efemInicioPromise = cargarEfemeridesHoyGuia().catch(e=>{
        console.error('Efemérides:',e);
      });

      // Bootstrap también corre en paralelo. indice_guia ya trae la información
      // necesaria para pintar la Guía inicial; los catálogos enriquecen después.
      iniciarBootstrapCompleto().catch(e=>{
        console.error('No se pudo cargar el bootstrap de catálogos:', e);
      });

      // Favoritos forman parte de la carga inicial cuando hay sesión, usando cache inmediata si existe.
      favoritosInicioPromise.then(()=>{
        document.querySelectorAll('.gld-fav-anunciante-btn[data-anunciante-id]').forEach(btn=>{
          const id=String(btn.dataset.anuncianteId||'').trim();
          const on=gldFavoritosAnunciantes.has(id);
          btn.classList.toggle('activo',on);
          btn.textContent=on?'♥':'♡';
          btn.title=on?'Quitar de favoritos':'Agregar a favoritos';
        });
      }).catch(()=>{});

      try{
        await Promise.all([
          cargarGuiaSeleccionada(guiaInicioPromise),
          farmaInicioPromise,
          efemInicioPromise,
          publicidadInicioPromise,
          favoritosInicioPromise
        ]);
      }finally{
        // Recién acá se habilita la navegación.
        gldSetModuloCargando('guia',false);
        document.body.classList.remove('gld-guia-cargando');
        document.getElementById('guiaCargaPrincipal')?.classList.remove('activo');

        // Segunda etapa: Eventos, Promos y Actividades comienzan en segundo plano.
        if(subscriberSession) gldIniciarCargaSecundaria();
      }
    }

    iniciarGuiaDesdeMochila();

</script>
<script>
(function(){
  function isYouTubeFrame(el){
    if(!el || String(el.tagName||'').toLowerCase()!=='iframe') return false;
    const src=String(el.getAttribute('src')||'').toLowerCase();
    return src.includes('youtube.com/embed/') || src.includes('youtube-nocookie.com/embed/');
  }

  function ytCommand(frame,func){
    try{
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage(JSON.stringify({
          event:'command',
          func:func,
          args:[]
        }),'*');
      }
    }catch(e){}
  }

  function bindSoundControl(media){
    if(!media || media.dataset.gldSoundBound==='1') return;

    const tag=String(media.tagName||'').toLowerCase();
    const isNative=tag==='video';
    const isYT=isYouTubeFrame(media);
    if(!isNative && !isYT) return;

    const mediaHost=media.parentElement;
    if(!mediaHost) return;

    const banner=media.closest ? media.closest('.banner-tarjeta') : null;
    const buttonHost=banner || mediaHost;

    media.dataset.gldSoundBound='1';

    const existing=buttonHost.querySelector('.gld-media-sound-btn');
    if(existing) existing.remove();

    const btn=document.createElement('button');
    btn.type='button';
    btn.className='gld-media-sound-btn';
    btn.setAttribute('aria-label','Activar sonido del video');

    let muted=true;
    if(isNative) muted=media.muted !== false;
    else{
      const src=String(media.getAttribute('src')||'');
      muted=/[?&]mute=1(?:&|$)/.test(src);
    }

    function paint(){
      const label=muted ? '🔊 Activar sonido' : '🔇 Silenciar';
      btn.textContent=label;
      btn.setAttribute('aria-label',label.replace(/^..\s*/,''));
      btn.setAttribute('title',label.replace(/^..\s*/,''));
    }

    btn.addEventListener('click',function(ev){
      ev.preventDefault();
      ev.stopPropagation();

      muted=!muted;

      if(isNative){
        try{
          media.muted=muted;
          if(!muted) media.volume=1;
          const p=media.play();
          if(p && typeof p.catch==='function') p.catch(()=>{});
        }catch(e){}
      }else{
        if(muted){
          ytCommand(media,'mute');
        }else{
          ytCommand(media,'unMute');
          ytCommand(media,'setVolume',[100]);
          ytCommand(media,'playVideo');
          setTimeout(()=>ytCommand(media,'playVideo'),80);
        }
      }

      paint();
    });

    if(banner){
      mediaHost.insertAdjacentElement('afterend',btn);
    }else{
      buttonHost.appendChild(btn);
    }
    paint();
  }

  function scan(root){
    const base=root && root.querySelectorAll ? root : document;
    if(base.matches && (base.matches('video') || isYouTubeFrame(base))) bindSoundControl(base);
    if(base.querySelectorAll){
      base.querySelectorAll('video,iframe').forEach(function(el){
        if(String(el.tagName||'').toLowerCase()==='video' || isYouTubeFrame(el)) bindSoundControl(el);
      });
    }
  }

  function start(){
    scan(document);
    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node && node.nodeType===1) scan(node);
        });
      });
    });
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();


    /* ALTURA AUTOMÁTICA PARA EL IFRAME DE JIMDO */
    (() => {
      let ultimoAlto = 0;
      let rafAltura = 0;

      const MIN_ALTURA_IFRAME_GLD = 700;

      function medirYEnviarAltura(){
        cancelAnimationFrame(rafAltura);
        rafAltura = requestAnimationFrame(() => {
          const altoReal = Math.max(
            document.body ? document.body.scrollHeight : 0,
            document.documentElement ? document.documentElement.scrollHeight : 0
          );
          const alto = Math.max(MIN_ALTURA_IFRAME_GLD, altoReal);

          if(!alto || Math.abs(alto - ultimoAlto) < 2) return;
          ultimoAlto = alto;

          window.parent.postMessage({
            tipo:'alturaIframeGLD',
            altura:alto,
            ruta:window.location.pathname
          }, '*');
        });
      }

      window.addEventListener('load', medirYEnviarAltura);
      window.addEventListener('resize', medirYEnviarAltura);

      if('ResizeObserver' in window){
        const ro = new ResizeObserver(medirYEnviarAltura);
        if(document.body) ro.observe(document.body);
        if(document.documentElement) ro.observe(document.documentElement);
      }

      if('MutationObserver' in window && document.body){
        const mo = new MutationObserver(medirYEnviarAltura);
        mo.observe(document.body, {
          childList:true,
          subtree:true,
          attributes:true,
          characterData:false
        });
      }

      document.addEventListener('click', () => {
        setTimeout(medirYEnviarAltura, 60);
        setTimeout(medirYEnviarAltura, 350);
      });

      setTimeout(medirYEnviarAltura, 100);
      setTimeout(medirYEnviarAltura, 600);
      setTimeout(medirYEnviarAltura, 1500);
    })();

</script>
