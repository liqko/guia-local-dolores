<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guía Local · Sitio del anunciante</title><style>body{margin:0;font:16px Arial,sans-serif;color:#263238}header{padding:12px;background:#f5e1d4;display:flex;align-items:center;gap:16px}button{padding:10px 16px;border:0;border-radius:8px;background:#006699;color:white;cursor:pointer}iframe{display:block;border:0;width:100%;height:calc(100dvh - 70px)}p{padding:12px}</style></head><body><header><button type="button" onclick="history.back()">Volver a Guía Local</button><span>Sitio del anunciante</span></header><p id="notice" role="status">Si el sitio impide mostrarse dentro de la plataforma, volvé a Guía Local para consultar la ficha del anunciante.</p><iframe id="site" title="Sitio del anunciante" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" referrerpolicy="no-referrer" hidden></iframe><script>
'use strict';
try{const u=new URL(new URLSearchParams(location.search).get('url')||'');if(!['http:','https:'].includes(u.protocol))throw Error();const frame=document.getElementById('site');frame.src=u.href;frame.hidden=false;}catch{document.getElementById('notice').textContent='El enlace del anunciante no es válido. Volvé a Guía Local.';}
</script></body></html>
