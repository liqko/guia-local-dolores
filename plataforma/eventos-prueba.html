<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prueba Eventos</title>
</head>
<body>
  <div style="font-family:Arial,sans-serif;padding:20px">Cargando Eventos de prueba...</div>
  <script>
  (async function(){
    try{
      const r=await fetch('./eventos.html',{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar eventos.html');
      let html=await r.text();

      const inicio="      const infoBlock = document.createElement('div');";
      const fin="      body.appendChild(infoBlock);";
      const i=html.indexOf(inicio);
      const j=i>=0 ? html.indexOf(fin,i) : -1;
      if(i<0 || j<0) throw new Error('No se encontró el bloque de fecha/sede de Eventos');

      const nuevo=`      if (lvl === 'vip' && Array.isArray(ev && ev.programacion) && ev.programacion.length) {
        const programWrap = document.createElement('div');
        programWrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:12px;width:100%';

        const programTitle = document.createElement('div');
        programTitle.style.cssText = 'font-weight:950;color:#102f5b;font-size:1.05rem;display:flex;align-items:center;gap:7px';
        programTitle.innerHTML = '<i class="ri-calendar-schedule-line"></i> Programación';
        programWrap.appendChild(programTitle);

        const rows = ev.programacion
          .filter(r => r && (r.activo === undefined || r.activo === true || String(r.activo).toLowerCase() === 'true' || String(r.activo) === '1' || String(r.activo).toLowerCase() === 'si' || String(r.activo).toLowerCase() === 'sí'))
          .sort((a,b)=>{
            const ka = String(a.fecha||'')+' '+String(a.hora_desde||'')+' '+String(a.orden||'');
            const kb = String(b.fecha||'')+' '+String(b.hora_desde||'')+' '+String(b.orden||'');
            return ka.localeCompare(kb);
          });

        rows.forEach((p,idx)=>{
          const box = document.createElement('div');
          box.style.cssText = 'background:#fff;border:1px solid #ffc88c;border-left:4px solid #ff8a35;border-radius:12px;padding:11px 12px;box-sizing:border-box;box-shadow:0 4px 12px rgba(255,122,42,.08)';

          const d = parseToDate(p.fecha);
          const fecha = d ? capitalizarPrimeraLetra(d.toLocaleDateString('es-AR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})) : String(p.fecha||'');
          const hd = horaHumana(p.hora_desde||'');
          const hh = horaHumana(p.hora_hasta||'');
          const horario = hd && hh ? hd.replace(/ hs$/,'')+' a '+hh : (hd || hh);
          const lugar = String(p.lugar_texto || p.lugar || '').trim();
          const direccion = String(p.direccion || '').trim();
          const actividad = String(p.actividad || '').trim();
          const detalle = String(p.detalle || '').trim();
          const observaciones = String(p.observaciones || '').trim();
          const maps = safeUrl(p.maps || p.llegar || '');

          if(fecha){
            const x=document.createElement('div');
            x.style.cssText='font-weight:950;color:#174f9e;line-height:1.35';
            x.innerHTML='<i class="ri-calendar-event-line"></i> '+fecha;
            box.appendChild(x);
          }
          if(horario){
            const x=document.createElement('div');
            x.style.cssText='font-weight:850;color:#22529a;margin-top:3px';
            x.innerHTML='<i class="ri-time-line"></i> '+horario;
            box.appendChild(x);
          }
          if(actividad){
            const x=document.createElement('div');
            x.style.cssText='font-weight:950;color:#5a39b9;margin-top:8px';
            x.textContent=actividad;
            box.appendChild(x);
          }
          if(lugar){
            const x=document.createElement('div');
            x.style.cssText='font-weight:900;color:#173d70;margin-top:8px';
            x.innerHTML='<i class="ri-map-pin-2-line"></i> '+lugar;
            box.appendChild(x);
          }
          if(direccion){
            const x=document.createElement('div');
            x.style.cssText='color:#3a536e;margin-top:4px';
            x.innerHTML='<i class="ri-road-map-line"></i> '+direccion;
            box.appendChild(x);
          }
          if(maps){
            const a=document.createElement('a');
            a.href=maps; a.target='_blank'; a.rel='noopener noreferrer';
            a.style.cssText='display:inline-block;color:#0d69b5;font-weight:850;text-decoration:underline;margin-top:5px';
            a.innerHTML='<i class="ri-map-pin-line"></i> ¿Cómo llegar?';
            box.appendChild(a);
          }
          if(detalle){
            const x=document.createElement('div');
            x.style.cssText='font-weight:800;color:#374a5e;margin-top:7px';
            x.textContent=detalle;
            box.appendChild(x);
          }
          if(observaciones){
            const x=document.createElement('div');
            x.style.cssText='color:#66788a;font-style:italic;margin-top:4px';
            x.textContent=observaciones;
            box.appendChild(x);
          }
          programWrap.appendChild(box);
        });

        body.appendChild(programWrap);
      } else {
        const infoBlock = document.createElement('div');
        infoBlock.className = 'info-block';
        const fechaHum = formatRangoFechasHumano(ev);
        const hrRaw = (ev && ev.hora_unificada && String(ev.hora_unificada).trim()) ? ev.hora_unificada :
                      ((ev && ev.hora && String(ev.hora).trim()) ? ev.hora : (ev ? (ev.hora2 || '') : ''));
        let hrShown = horaHumana(hrRaw);
        if (/^Sat\\s+Dec\\s+30\\s+1899/i.test(String(hrShown || ''))) hrShown = '';
        if (fechaHum || hrShown){
          const line = document.createElement('div');
          line.className = 'line';
          line.innerHTML = '<i class="ri-calendar-event-line"></i><div class="text">'+(fechaHum ? fechaHum : '')+((fechaHum && hrShown) ? ' • ' : '')+(hrShown ? hrShown : '')+'</div>';
          infoBlock.appendChild(line);
        }
        if (ev && ev.lugar){
          const line = document.createElement('div');
          line.className = 'line';
          line.innerHTML = '<i class="ri-map-pin-line"></i><div class="text">'+ev.lugar+'</div>';
          infoBlock.appendChild(line);
        }
        if (ev && ev.direccion){
          const line = document.createElement('div');
          line.className = 'line';
          line.innerHTML = '<i class="ri-road-map-line"></i><div class="muted"><strong>Dirección:</strong> '+ev.direccion+'</div>';
          infoBlock.appendChild(line);
          const llegarUrl = safeUrl(ev && ev.llegar ? ev.llegar : '');
          if (llegarUrl){
            const mapA = document.createElement('a');
            mapA.href = llegarUrl;
            mapA.className = 'map-link';
            mapA.target = '_blank';
            mapA.rel = 'noopener noreferrer';
            mapA.innerHTML = '<i class="ri-map-pin-2-line"></i> ¿Cómo llegar?';
            infoBlock.appendChild(mapA);
          }
        }
        body.appendChild(infoBlock);
      }`;

      html=html.slice(0,i)+nuevo+html.slice(j+fin.length);
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:20px;color:#c00"><b>Error:</b> '+String(e.message||e)+'</div>';
    }
  })();
  </script>
</body>
</html>
