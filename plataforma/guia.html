n      const rawList = Array.isArray(response) ? response : (response.data || response.events || []);\n\n      eventosData = rawList.map(ev => {\n        const desde = getFechaDesdeRaw(ev);\n        const hasta = getFechaHastaRaw(ev);\n        const past = isPastDate(desde, hasta);\n        return { ...ev, _isPast: past };\n      })\n      .filter(ev => !ev._isPast)\n      .sort((a, b) => {\n        const dateA = parseToDate(getFechaDesdeRaw(a));\n        const dateB = parseToDate(getFechaDesdeRaw(b));\n        if (!dateA && !dateB) return 0;\n        if (!dateA) return 1;\n        if (!dateB) return -1;\n        return dateA - dateB;\n      });\n\n      const eventosCiudad = eventosData.filter(ev=>\n        !ciudadContexto.ciudad_id ||\n        String(ev && ev.ciudad_id || '').trim() === String(ciudadContexto.ciudad_id || '').trim()\n      );\n\n      hydrateCategoryFilterFromEvents(eventosCiudad);\n\n      if(initialEventKeys.length || initialOrganizerFilter || initialAdvertiserIdFilter){\n        eventosFiltrados = eventosCiudad.filter(matchesInitialAdvertiser);\n        const searchEl = document.getElementById('search');\n        if(searchEl && initialOrganizerFilter) searchEl.value = initialOrganizerFilter;\n        renderEventos(eventosFiltrados, 1);\n        const subtitleEl = document.getElementById('subtitle');\n        if(subtitleEl && initialOrganizerFilter){\n          subtitleEl.textContent = eventosFiltrados.length\n            ? `Eventos activos de ${initialOrganizerFilter}`\n            : `No encontramos eventos activos de ${initialOrganizerFilter}`;\n        }\n      } else {\n        applyEventFilters();\n      }\n    }\n\n    fetch(eventsEndpointCiudad)\n      .then(res => res.json())\n      .then(procesarEventosResponse)\n      .catch(err => {\n        console.error(err);\n        document.getElementById('events').innerHTML = `<p class=\"error\" style=\"text-align:center;padding:20px;\">Error al cargar los eventos.<\/p>`;\n      });\n\n    fetch(CITIES_ENDPOINT)\n      .then(res => res.json())\n      .then(citiesResponse => {\n        ciudadesData = Array.isArray(citiesResponse) ? citiesResponse : (citiesResponse.ciudades || []);\n        resolverCiudadVisible(ciudadesData);\n        updateCityHeading();\n      })\n      .catch(()=>{});\n\n    fetch(urlBanners)\n      .then(res => res.json())\n      .then(rawBanners => {\n        if (rawBanners && Array.isArray(rawBanners)) {\n          banners = rawBanners\n            .filter(b => {\n              const apr = (b.aprobado !== undefined) ? String(b.aprobado).trim().toLowerCase() : '';\n              return apr === 'true' || apr === '1' || apr === 'x';\n            })\n            .map(b => ({\n              img: (b.img || b.url || '').trim(),\n              media: (b.media || '').trim(),\n              cta: (b.cta || '').trim(),\n              poster: (b.poster || '').trim()\n            }));\n          if(eventosFiltrados.length) renderEventos(eventosFiltrados, currentPage || 1);\n        }\n      })\n      .catch(()=>{});\n\n    document.getElementById('search').addEventListener('input', applyEventFilters);\n    document.getElementById('categoryFilter').addEventListener('change', applyEventFilters);\n\n    document.getElementById('volverGuia')?.addEventListener('click', ()=>{\n      navegarArriba(contextoUrl('https://guialocal.ar/guia/', true));\n    });\n\n    document.getElementById('irPromos')?.addEventListener('click', (e)=>{\n      e.preventDefault();\n      navegarArriba(contextoUrl('https://guialocal.ar/promos/', true));\n    });\n\n    document.getElementById('cambiarCiudad')?.addEventListener('click', ()=>{\n      try{ localStorage.removeItem(CITY_CONTEXT_KEY); }catch(e){}\n      navegarArriba('https://guialocal.ar/');\n    });\n\n    document.getElementById('btnSumaEvento').onclick = () => {\n      window.open(SUMA_EVENTO_URL, '_blank', 'noopener');\n    };\n\n    if(!ciudadContexto.ciudad_id){\n      navegarArriba('https://guialocal.ar/');\n    }\n  \n\n    /* ALTURA AUTOMÁTICA PARA EL IFRAME DE JIMDO */\n    (() => {\n      let ultimoAlto = 0;\n      let rafAltura = 0;\n\n      const MIN_ALTURA_IFRAME_GLD = 700;\n\n      function medirYEnviarAltura(){\n        cancelAnimationFrame(rafAltura);\n        rafAltura = requestAnimationFrame(() => {\n          const altoReal = Math.max(\n            document.body ? document.body.scrollHeight : 0,\n            document.documentElement ? document.documentElement.scrollHeight : 0\n          );\n          const alto = Math.max(MIN_ALTURA_IFRAME_GLD, altoReal);\n\n          if(!alto || Math.abs(alto - ultimoAlto) < 2) return;\n          ultimoAlto = alto;\n\n          window.parent.postMessage({\n            tipo:'alturaIframeGLD',\n            altura:alto,\n            ruta:window.location.pathname\n          }, '*');\n        });\n      }\n\n      window.addEventListener('load', medirYEnviarAltura);\n      window.addEventListener('resize', medirYEnviarAltura);\n\n      if('ResizeObserver' in window){\n        const ro = new ResizeObserver(medirYEnviarAltura);\n        if(document.body) ro.observe(document.body);\n        if(document.documentElement) ro.observe(document.documentElement);\n      }\n\n      if('MutationObserver' in window && document.body){\n        const mo = new MutationObserver(medirYEnviarAltura);\n        mo.observe(document.body, {\n          childList:true,\n          subtree:true,\n          attributes:true,\n          characterData:false\n        });\n      }\n\n      document.addEventListener('click', () => {\n        setTimeout(medirYEnviarAltura, 60);\n        setTimeout(medirYEnviarAltura, 350);\n      });\n\n      document.addEventListener('input', () => setTimeout(medirYEnviarAltura, 80));\n      document.addEventListener('change', () => setTimeout(medirYEnviarAltura, 80));\n\n      setTimeout(medirYEnviarAltura, 100);\n      setTimeout(medirYEnviarAltura, 600);\n      setTimeout(medirYEnviarAltura, 1500);\n    })();\n\n\n    const FARMACIAS_ENDPOINT = \"https://script.google.com/macros/s/AKfycbzXJ5wk0EYGQOQzQ5-kik0lOcuVp78zAacJgs5x4I3TrgTpySaqW4qVjzyqQUXSO4ARfA/exec\";\n\n    function farmaIsoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}\n    function farmaShiftDate(iso,days){const m=String(iso||'').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);const d=m?new Date(+m[1],+m[2]-1,+m[3],12):new Date();d.setDate(d.getDate()+days);return farmaIsoDate(d)}\n    function farmaHumanDate(iso){const m=String(iso||'').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);if(!m)return iso;const d=new Date(+m[1],+m[2]-1,+m[3],12);return new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(d)}\n    function farmaEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}\n    async function farmaFetchTurnos(fecha){\n      const ciudadId = typeof ciudadContexto !== 'undefined'\n        ? String(ciudadContexto.ciudad_id||'').trim()\n        : (typeof ciudadSeleccionada !== 'undefined' ? String(ciudadSeleccionada||'').trim() : '');\n      if(!ciudadId) throw new Error('No hay ciudad seleccionada');\n      const u=new URL(FARMACIAS_ENDPOINT);\n      u.searchParams.set('action','turnos');\n      u.searchParams.set('ciudad_id',ciudadId);\n      u.searchParams.set('fecha',fecha);\n      u.searchParams.set('_ts',Date.now());\n      const r=await fetch(u.toString(),{cache:'no-store'});\n      const data=await r.json();\n      if(!r.ok || !data || data.success!==true) throw new Error((data&&data.error)||'No se pudieron cargar los turnos');\n      return data;\n    }\n    function farmaContactLinks(t){\n      const links=[],tel=String(t.telefono||'').trim(),wa=String(t.whatsapp||'').replace(/\\D/g,''),maps=String(t.maps||'').trim(),mail=String(t.mail||'').trim();\n      if(tel)links.push(`<a href=\"tel:${farmaEsc(tel.replace(/\\s+/g,''))}\">📞 Llamar<\/a>`);\n      if(wa)links.push(`<a href=\"https://wa.me/${farmaEsc(wa)}\" target=\"_blank\" rel=\"noopener\">💬 WhatsApp<\/a>`);\n      if(maps)links.push(`<a href=\"${farmaEsc(maps)}\" target=\"_blank\" rel=\"noopener\">📍 Cómo llegar<\/a>`);\n      if(mail)links.push(`<a href=\"mailto:${farmaEsc(mail)}\">✉️ Mail<\/a>`);\n      return links.join('');\n    }\n    function farmaCardHtml(t){\n      const nombre=String(t.nombre_sede||t.nombre_ref||'Farmacia').trim();\n      const horario=(t.hora_desde||t.hora_hasta)?`De ${farmaEsc(t.hora_desde||'')} a ${farmaEsc(t.hora_hasta||'')}`:'';\n      return `<article class=\"farma-turno-card\"><div class=\"farma-turno-name\">${farmaEsc(nombre)}<\/div>${horario?`<div class=\"farma-turno-time\">${horario}<\/div>`:''}${t.direccion?`<div class=\"farma-turno-dir\">${farmaEsc(t.direccion)}<\/div>`:''}${t.observaciones?`<div class=\"farma-turno-dir\">${farmaEsc(t.observaciones)}<\/div>`:''}<div class=\"farma-turno-actions\">${farmaContactLinks(t)}<\/div><\/article>`;\n    }\n    async function cargarFarmaciasTurnoCiudad(){\n      const hoyBox=document.getElementById('farmaTurnoHoy'),semanaBox=document.getElementById('farmaTurnoSemanaContenido'),ciudadBox=document.getElementById('farmaTurnoCiudad');\n      if(!hoyBox||!semanaBox)return;\n      let ciudadNombre='';\n      try{\n        if(typeof ciudadContexto!=='undefined') ciudadNombre=String(ciudadContexto.ciudad||'').trim();\n        else {\n          const saved=JSON.parse(localStorage.getItem('gld_ciudad_contexto')||'null');\n          ciudadNombre=String(saved&&saved.ciudad||'').trim();\n        }\n      }catch(e){}\n      if(ciudadBox)ciudadBox.textContent=ciudadNombre?`Turnos para ${ciudadNombre}`:'';\n      const hoy=farmaIsoDate(new Date());\n      try{\n        const data=await farmaFetchTurnos(hoy),turnos=Array.isArray(data.turnos)?data.turnos:[];\n        hoyBox.innerHTML=turnos.length?turnos.map(farmaCardHtml).join(''):'<div class=\"farma-state\">No hay farmacia de turno informada para hoy.<\/div>';\n      }catch(e){hoyBox.innerHTML=`<div class=\"farma-state error\">${farmaEsc(e.message||String(e))}<\/div>`}\n      const fechas=Array.from({length:7},(_,i)=>farmaShiftDate(hoy,i+1));\n      semanaBox.innerHTML='<div class=\"farma-state\">Cargando próximos días...<\/div>';\n      const respuestas=await Promise.all(fechas.map(f=>farmaFetchTurnos(f).catch(()=>({turnos:[]}))));\n      semanaBox.innerHTML=respuestas.map((data,i)=>{const turnos=Array.isArray(data.turnos)?data.turnos:[];return `<div class=\"farma-week-day\"><div class=\"farma-week-date\">${farmaEsc(farmaHumanDate(fechas[i]))}<\/div>${turnos.length?turnos.map(farmaCardHtml).join(''):'<div>Sin información cargada.<\/div>'}<\/div>`}).join('');\n    }\n    document.addEventListener('DOMContentLoaded',()=>{\n      document.getElementById('irFarmaciaTurno')?.addEventListener('click',()=>{\n        document.getElementById('farmaciaTurnoSection')?.scrollIntoView({behavior:'smooth',block:'start'});\n      });\n      setTimeout(()=>{try{cargarFarmaciasTurnoCiudad()}catch(e){}},0);\n    });\n\n<\/script>\n\n<style>\n  /* En la app unificada el marco de ciudad pertenece a la Guía principal. */\n  .city-shell,\n  .farma-turno-global,\n  #farmaciaTurnoSection,\n  .farma-turno-section{display:none!important}\n  html,body{min-height:0!important}\n<\/style>\n<script>\n  /* Evita consultas duplicadas de Farmacias dentro del módulo central. */\n  try{\n    window.cargarFarmaciasTurnoCiudad = async function(){ return true; };\n  }catch(e){}\n<\/script>\n<\/body>\n<\/html>";

  const navGuia = document.getElementById('moduloGuia');
  const navPromos = document.getElementById('moduloPromos');
  const navEventos = document.getElementById('moduloEventos');
  const host = document.getElementById('moduloCentralHost');
  const promoFrame = document.getElementById('moduloPromosFrame');
  const eventFrame = document.getElementById('moduloEventosFrame');

  const inlineModuleState = {
    promos: {loaded:false, filtered:false},
    eventos: {loaded:false, filtered:false}
  };

  function setNavActive(key){
    [navGuia,navPromos,navEventos].forEach(el=>el && el.classList.remove('activo'));
    if(key==='guia') navGuia?.classList.add('activo');
    if(key==='promos') navPromos?.classList.add('activo');
    if(key==='eventos') navEventos?.classList.add('activo');
  }

  function resizeInlineFrame(frame){
    if(!frame) return;
    try{
      const doc=frame.contentDocument;
      if(!doc) return;
      const h=Math.max(
        doc.documentElement?.scrollHeight||0,
        doc.body?.scrollHeight||0,
        520
      );
      frame.style.height=h+'px';
    }catch(e){}
  }

  function installFrameAutoHeight(frame){
    if(!frame || frame.dataset.autoHeight==='1') return;
    frame.dataset.autoHeight='1';
    frame.addEventListener('load',()=>{
      resizeInlineFrame(frame);
      try{
        const doc=frame.contentDocument;
        if(!doc) return;
        const ro=new ResizeObserver(()=>resizeInlineFrame(frame));
        if(doc.documentElement) ro.observe(doc.documentElement);
        if(doc.body) ro.observe(doc.body);
        frame.__gldResizeObserver=ro;
      }catch(e){}
      setTimeout(()=>resizeInlineFrame(frame),250);
      setTimeout(()=>resizeInlineFrame(frame),1000);
      setTimeout(()=>resizeInlineFrame(frame),2500);
    });
  }

  installFrameAutoHeight(promoFrame);
  installFrameAutoHeight(eventFrame);

  function loadInlineModule(key, filtered){
    const state=inlineModuleState[key];
    const frame=key==='promos'?promoFrame:eventFrame;
    const source=key==='promos'?PROMOS_INLINE_HTML:EVENTOS_INLINE_HTML;
    if(!state || !frame) return;

    const mustReload =
      !state.loaded ||
      !!filtered ||
      (state.filtered && !filtered);

    if(mustReload){
      frame.srcdoc=source;
      state.loaded=true;
      state.filtered=!!filtered;
    }
  }

  window.mostrarModuloCiudad = function(key, options={}){
    const filtered=!!options.filtered;
    document.body.classList.remove('modo-promos','modo-eventos');
    host?.classList.remove('activo');
    promoFrame?.classList.remove('activo');
    eventFrame?.classList.remove('activo');

    if(key==='promos'){
      document.body.classList.add('modo-promos');
      host?.classList.add('activo');
      promoFrame?.classList.add('activo');
      loadInlineModule('promos',filtered);
    }else if(key==='eventos'){
      document.body.classList.add('modo-eventos');
      host?.classList.add('activo');
      eventFrame?.classList.add('activo');
      loadInlineModule('eventos',filtered);
    }else{
      key='guia';
    }

    setNavActive(key);
  };

  navGuia?.addEventListener('click',(e)=>{
    e.preventDefault();
    window.mostrarModuloCiudad('guia');
  });

  navPromos?.addEventListener('click',(e)=>{
    e.preventDefault();
    try{ localStorage.removeItem('gld_promos_filter'); }catch(err){}
    window.mostrarModuloCiudad('promos',{filtered:false});
  });

  navEventos?.addEventListener('click',(e)=>{
    e.preventDefault();
    try{ localStorage.removeItem('gld_eventos_filter'); }catch(err){}
    window.mostrarModuloCiudad('eventos',{filtered:false});
  });

  // Los accesos de cada ficha conservan el filtro ya guardado por la Guía,
  // pero ahora cambian sólo el contenido central.
  document.addEventListener('click',(e)=>{
    const promoLink=e.target.closest && e.target.closest('a.promos-activas-btn');
    if(promoLink){
      e.preventDefault();
      window.mostrarModuloCiudad('promos',{filtered:true});
      return;
    }

    const eventLink=e.target.closest && e.target.closest('a.eventos-activos-btn');
    if(eventLink){
      e.preventDefault();
      window.mostrarModuloCiudad('eventos',{filtered:true});
    }
  });

  setNavActive('guia');
})();
</script>
</body>
</html>
