              else { btnIzq.style.display = 'flex'; btnDer.style.display = 'flex'; }
            }
            function close() { try { modal.remove(); } catch(e) {} document.removeEventListener('keydown', keyHandler); }
            btnCerrar.addEventListener('click', function(e){ e.stopPropagation(); close(); });
            btnIzq.addEventListener('click', function(e){ e.stopPropagation(); show(current - 1); });
            btnDer.addEventListener('click', function(e){ e.stopPropagation(); show(current + 1); });
            modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
            function keyHandler(e){ if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(current - 1); else if (e.key === 'ArrowRight') show(current + 1); }
            document.addEventListener('keydown', keyHandler);
            show(current);
          } catch (err) { console.warn('mostrarModalGaleria error', err); }
        };

        function canonicalSegmentoIds(item) {
          const rawParts = [
            item && item.segmento_id,
            item && item.segmento
          ]
            .filter(Boolean)
            .flatMap(v => String(v).split(/[;,|]+/))
            .map(v => String(v).trim())
            .filter(Boolean);

          const ids = [];

          rawParts.forEach(raw => {
            const rawNorm = normalizar(raw);

            const found = (catalogosGlobales.segmentos || []).find(s => {
              const sid = String(s.segmento_id || '').trim();
              const snombre = normalizar(s.nombre || '');
              return sid === raw || snombre === rawNorm;
            });

            if(found && found.segmento_id){
              ids.push(String(found.segmento_id).trim());
            } else {
              ids.push(raw);
            }
          });

          return [...new Set(ids)];
        }

        function canonicalCategoriaIds(item) {
          const rawParts = [
            item && item.categoria_id,
            item && item.categoria
          ]
            .filter(Boolean)
            .flatMap(v => String(v).split(/[;,|]+/))
            .map(v => String(v).trim())
            .filter(Boolean);

          const ids = [];

          rawParts.forEach(raw => {
            const rawNorm = normalizar(raw);

            const found = (catalogosGlobales.categorias || []).find(c => {
              const cid = String(c.categoria_id || '').trim();
              const cnombre = normalizar(c.nombre || '');
              return cid === raw || cnombre === rawNorm;
            });

            if(found && found.categoria_id){
              ids.push(String(found.categoria_id).trim());
            } else {
              ids.push(raw);
            }
          });

          return [...new Set(ids)];
        }

        function sedeNombreVisible(nombre){
          const raw=String(nombre||'').trim();
          if(!raw) return '';
          const n=normalizar(raw);
          if(n==='sede' || n==='sede principal') return '';
          return raw;
        }

        function sedeActIds(sede){
          return ((((sede||{}).relaciones||{}).actividades)||[])
            .map(x=>String(x.actividad_id||'').trim()).filter(Boolean);
        }
        function sedeAccIds(sede){
          return ((((sede||{}).relaciones||{}).acciones)||[])
            .map(x=>String(x.accion_id||'').trim()).filter(Boolean);
        }

        function sedeCumpleSegundoFiltro(sede,filtro){
          filtro=String(filtro||'').trim();
          if(!filtro) return true;
          if(filtro.startsWith('ACT:')) return sedeActIds(sede).includes(filtro.slice(4));
          if(filtro.startsWith('ACC:')) return sedeAccIds(sede).includes(filtro.slice(4));
          return true;
        }

        function tarjetaDeSede(item,sede){
          const out=Object.assign({},item);
          out.__sede_individual=true;
          out.sedes=[sede];

          [
            'telefono','telefono2','telefono3','telefono4','telefono5',
            'whatsapp','whatsapp2','whatsapp3','whatsapp4','whatsapp5',
            'mail','mail2','mail3','instagram','facebook','youtube','tiktok','linkedin','x'
          ].forEach(k=>out[k]=(sede&&sede[k])||'');

          for(let i=1;i<=10;i++) out['img'+i]=(sede&&sede['img'+i])||'';

          const rel=(sede&&sede.relaciones)||{};
          out.actividades_clave=Array.isArray(rel.actividades)?rel.actividades:[];
          out.acciones=Array.isArray(rel.acciones)?rel.acciones:[];
          out.nodos=Array.isArray(rel.nodos)?rel.nodos:[];

          out.direccion=(sede&&sede.direccion)||'';
          out.maps=(sede&&sede.maps)||'';
          out.lat=(sede&&sede.lat)||'';
          out.lng=(sede&&sede.lng)||'';
          out.ciudad=(sede&&sede.ciudad)||'';
          return out;
        }

        function textoTags(v){
          if(v === null || v === undefined) return '';
          if(Array.isArray(v)) return v.map(textoTags).join(' ');
          if(typeof v === 'object') return Object.values(v).map(textoTags).join(' ');
          return String(v).replace(/[;,|#]+/g,' ');
        }

        function textoGlobalItem(item){
          const meta = metaPorIdGlobal[String(item && item.id || '').trim()] || {};
          return [
            item.nombre,item.segmento,item.categoria,item.actividad,
            textoTags(item.tags),textoTags(meta.tags),item.adicionales,
            item.descripcion,item.link,
            ...(item.actividades_clave||[]).map(x=>x&&x.nombre),
            ...(item.acciones||[]).map(x=>x&&x.nombre),
            ...(item.nodos||[]).map(x=>x&&x.nombre),
            ...(item.sedes||[]).flatMap(s=>[
              s&&s.nombre_sede,s&&s.direccion,s&&s.ciudad,s&&s.provincia,s&&s.pais,
              textoTags(s&&s.tags)
            ])
          ].filter(Boolean).join(' ');
        }

        function render() {
          const qGlobal=normalizar(buscadorGlobal.value.trim());
          const clasificacion=String(selectClasificacion.value||'').trim();
          const accionesElegidas=accionesSeleccionadas();

          let base=serviciosData.filter(item=>{
            if(clasificacion.startsWith('SEG:')){
              return canonicalSegmentoIds(item).includes(clasificacion.slice(4));
            }
            if(clasificacion.startsWith('CAT:')){
              // Un anunciante con varias categorías aparece en CADA categoría que tenga.
              return canonicalCategoriaIds(item).includes(clasificacion.slice(4));
            }
            return true;
          });

          if(clasificacion || accionesElegidas.length || qGlobal){
            base=base.flatMap(item=>{
              const sedes=Array.isArray(item.sedes)?item.sedes:[];
              const requiereSede=clasificacion.startsWith('ACT:') || accionesElegidas.length>0;

              if(!sedes.length) return requiereSede ? [] : [item];

              return sedes
                .filter(sede=>{
                  if(clasificacion.startsWith('ACT:') && !sedeActIds(sede).includes(clasificacion.slice(4))) return false;

                  const accionesSede=sedeAccIds(sede);
                  if(accionesElegidas.some(id=>!accionesSede.includes(id))) return false;

                  return true;
                })
                .map(sede=>tarjetaDeSede(item,sede));
            });
          }

          let filtrados=base.filter(item=>{
            if(!qGlobal) return true;
            return normalizar(textoGlobalItem(item)).includes(qGlobal);
          }).sort((a,b)=>{
            if(Number(b.nivel)!==Number(a.nivel)) return Number(b.nivel)-Number(a.nivel);
            return Number(a.subnivel)-Number(b.subnivel);
          });

          const destacadas=(paginaActual===1)?getDestacadas(filtrados):[];
          const normales=filtrados.filter(item=>!(Number(item.nivel)===6));
          totalPaginas=Math.max(1,Math.ceil(normales.length/resultadosPorPagina));
          if(paginaActual>totalPaginas) paginaActual=totalPaginas;
          if(paginaActual<1) paginaActual=1;

          const inicio=(paginaActual-1)*resultadosPorPagina;
          const fin=inicio+resultadosPorPagina;
          const normalesPaginadas=normales.slice(inicio,fin);

          btnAnterior.disabled=paginaActual===1;
          btnSiguiente.disabled=paginaActual===totalPaginas;
          buildPaginationBar(paginationBar);

          renderDestacadas(destacadas);
          renderNormales(normalesPaginadas,destacadas.length);
        }

        buscadorGlobal.addEventListener('input', () => {
          paginaActual = 1;
          render();
        });

        function actualizarBotonesModulosVisibles(){
          document.querySelectorAll('[data-card-actions]').forEach(zone => {
            const key = String(zone.getAttribute('data-card-actions') || '').trim();
            const item = serviciosData.find(x =>
              String(x.id || x.__id || x.id_comercio || x.nombre || '').trim() === key
            );
            if(!item) return;
            const nuevo = renderEventosActivosButton(item) + renderPromosActivasButton(item);
            if(zone.innerHTML !== nuevo) zone.innerHTML = nuevo;
          });
        }

        // Primer render: sólo con los datos de la guía.
        render();

        // Segundo plano independiente: cada módulo actualiza apenas llega.
        // Ya no esperamos al recurso más lento para mostrar Eventos o Promos.
        eventsPromise.then(eventsLoaded => {
          rawEventsResponse = eventsLoaded || [];
          rawEventsList = Array.isArray(rawEventsResponse)
            ? rawEventsResponse
            : ((rawEventsResponse && (rawEventsResponse.data || rawEventsResponse.events)) || []);
          activeEvents = rawEventsList.filter(eventIsActive);
          actualizarBotonesModulosVisibles();
        }).catch(err => console.warn('Eventos no disponibles todavía:', err));

        promosPromise.then(promosLoaded => {
          rawPromosResponse = promosLoaded || [];
          rawPromosList = Array.isArray(rawPromosResponse)
            ? rawPromosResponse
            : ((rawPromosResponse && (rawPromosResponse.promos || rawPromosResponse.data || rawPromosResponse.rows)) || []);
          activePromos = rawPromosList.filter(p => promoIsActive(p) && promoMatchesCurrentCity(p));
          actualizarBotonesModulosVisibles();
        }).catch(err => console.warn('Promos no disponibles todavía:', err));

        bannersPromise.then(bannersLoaded => {
          rawBanners = Array.isArray(bannersLoaded) ? bannersLoaded : [];
          if (rawBanners.length) {
            banners = rawBanners
              .filter(b => {
                const apr = (b.aprobado !== undefined) ? String(b.aprobado).trim().toLowerCase() : '';
                return apr === 'true' || apr === '1' || apr === 'x';
              })
              .map(b => ({
                img: (b.img || b.url || '').trim(),
                media: (b.media || '').trim(),
                cta: (b.cta || '').trim(),
                poster: (b.poster || '').trim()
              }));
            render();
          }
        }).catch(err => console.warn('Banners no disponibles todavía:', err));

        window.addEventListener('scroll', () => {
          const topBtn = document.getElementById('topBtn');
          if (window.scrollY > 200) topBtn.style.display = 'flex';
          else topBtn.style.display = 'none';
        }, { passive: true });

      } catch(e) {
        console.error('Error cargando datos:', e);
        const cont = document.getElementById('contenedor');
        if(cont) cont.innerHTML = '<div class="no-tags-msg">No se pudo cargar la guía.</div>';
      }
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(id && nombre) {
          const op = document.createElement('option');
          op.value = id;
          op.textContent = nombre;
          select.appendChild(op);
        }
      });
    }

    async function cargarUbicaciones() {
      const data = await jsonpApi({action:'ubicaciones'}, 15000);
      if(!data || data.success !== true) {
        throw new Error((data && (data.error || data.message)) || 'Ubicaciones inválidas');
      }
      return data;
    }

    function iniciarBootstrapCompleto(){
      if(!bootstrapCompletoPromise){
        bootstrapCompletoPromise = jsonpApi({action:'bootstrap'}, 30000)
          .then(data=>{
            if(!data || data.success !== true){
              throw new Error((data && (data.error || data.message)) || 'Bootstrap inválido');
            }

            catalogosGlobales.segmentos = Array.isArray(data.segmentos) ? data.segmentos : [];
            catalogosGlobales.segmentosPublicos = Array.isArray(data.segmentos_publicos)
              ? data.segmentos_publicos
              : catalogosGlobales.segmentos.filter(s => {
                  const v = String(s.visible_publico ?? '').trim().toLowerCase();
                  return v === 'true' || v === '1' || v === 'x' || v === 'si' || v === 'sí';
                });
            catalogosGlobales.categorias = Array.isArray(data.categorias) ? data.categorias : [];
            catalogosGlobales.actividades = Array.isArray(data.actividades_clave) ? data.actividades_clave : [];
            catalogosGlobales.acciones = Array.isArray(data.acciones) ? data.acciones : [];
            catalogosGlobales.nodos = Array.isArray(data.nodos) ? data.nodos : [];
            relacionesSedesGlobales = (data.relaciones_sedes && typeof data.relaciones_sedes === 'object') ? data.relaciones_sedes : {};
            metaPorIdGlobal = (data.meta_por_id && typeof data.meta_por_id === 'object') ? data.meta_por_id : {};
            return data;
          })
          .catch(err=>{
            bootstrapCompletoPromise = null;
            throw err;
          });
      }
      return bootstrapCompletoPromise;
    }

    function normId(v){
      return String(v || '').trim().toLowerCase();
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(!id || !nombre) return;

        const op = document.createElement('option');
        op.value = id;
        op.textContent = nombre;
        select.appendChild(op);
      });
    }

    function perteneceAProvincia(provincia, paisSeleccionado, paises){
      const ref = normId(provincia && (provincia.pais_id || provincia.pais));
      if(!ref) return false;

      const pais = (paises || []).find(p => normId(p.pais_id) === normId(paisSeleccionado));
      if(!pais) return false;

      return ref === normId(pais.pais_id) || ref === normId(pais.nombre);
    }

    function perteneceACiudad(ciudad, provinciaSeleccionada, provincias){
      const ref = normId(ciudad && (ciudad.provincia_id || ciudad.provincia));
      if(!ref) return false;

      const provincia = (provincias || []).find(p => normId(p.provincia_id) === normId(provinciaSeleccionada));
      if(!provincia) return false;

      return ref === normId(provincia.provincia_id) || ref === normId(provincia.nombre);
    }

    async function iniciarGuiaDesdeMochila(){
      // El HTML vive dentro de un embed. La ciudad está en la URL pública de Jimdo,
      // por eso también la leemos desde la página que contiene el embed.
      let qs = new URLSearchParams(window.location.search || '');
      try{
        const ref = new URL(document.referrer || '');
        const refQs = new URLSearchParams(ref.search || '');
        if(!qs.get('ciudad_id') && refQs.get('ciudad_id')) qs = refQs;
      }catch(e){}

      let ctx = null;
      try{ ctx = JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY) || 'null'); }catch(e){}

      const accesoConUbicacion = String(qs.get('ciudad_id') || (ctx && ctx.ciudad_id) || '').trim();
      if(!accesoConUbicacion){
        try{ window.top.location.href = 'https://guialocal.ar/'; }
        catch(e){ window.location.href = 'https://guialocal.ar/'; }
        return;
      }

      if(!paisSeleccionado) paisSeleccionado = String(qs.get('pais_id') || (ctx && ctx.pais_id) || '').trim();
      if(!provinciaSeleccionada) provinciaSeleccionada = String(qs.get('provincia_id') || (ctx && ctx.provincia_id) || '').trim();
      if(!ciudadSeleccionada) ciudadSeleccionada = accesoConUbicacion;

      if(!ciudadSeleccionada && ctx && ctx.ciudad_id){
        paisSeleccionado = String(ctx.pais_id || '').trim();
        provinciaSeleccionada = String(ctx.provincia_id || '').trim();
        ciudadSeleccionada = String(ctx.ciudad_id || '').trim();
      }

      if(!ciudadSeleccionada){
        try{ window.top.location.href = 'https://guialocal.ar/'; }
        catch(e){ window.location.href = 'https://guialocal.ar/'; }
        return;
      }

      function nombreVisibleValido(nombre, id){
        const n=String(nombre||'').trim();
        const i=String(id||'').trim();
        if(!n) return '';
        if(i && normId(n)===normId(i)) return '';
        return n;
      }

      let ciudadNombre = nombreVisibleValido(qs.get('ciudad') || (ctx && ctx.ciudad), ciudadSeleccionada);
      let provinciaNombre = nombreVisibleValido(qs.get('provincia') || (ctx && ctx.provincia), provinciaSeleccionada);
      let paisNombre = nombreVisibleValido(qs.get('pais') || (ctx && ctx.pais), paisSeleccionado);

      // Si el contexto sólo trae IDs, resolvemos los nombres reales con el catálogo
      // de ubicaciones que ya utiliza la Guía. Los IDs nunca se muestran al usuario.
      if(!ciudadNombre || !provinciaNombre || !paisNombre){
        try{
          const ubicaciones = await cargarUbicaciones();
          const paises = Array.isArray(ubicaciones.paises) ? ubicaciones.paises : [];
          const provincias = Array.isArray(ubicaciones.provincias) ? ubicaciones.provincias : [];
          const ciudades = Array.isArray(ubicaciones.ciudades) ? ubicaciones.ciudades : [];

          const paisObj = paises.find(x => normId(x.pais_id || x.id) === normId(paisSeleccionado));
          const provinciaObj = provincias.find(x => normId(x.provincia_id || x.id) === normId(provinciaSeleccionada));
          const ciudadObj = ciudades.find(x => normId(x.ciudad_id || x.id) === normId(ciudadSeleccionada));

          if(!paisNombre && paisObj) paisNombre = String(paisObj.nombre || paisObj.pais || '').trim();
          if(!provinciaNombre && provinciaObj) provinciaNombre = String(provinciaObj.nombre || provinciaObj.provincia || '').trim();
          if(!ciudadNombre && ciudadObj) ciudadNombre = String(ciudadObj.nombre || ciudadObj.ciudad || '').trim();
        }catch(e){
          console.warn('No se pudieron resolver los nombres de ubicación:', e);
        }
      }

      const titulo = document.getElementById('tituloGuia');
      const sub = document.getElementById('ubicacionSubtitulo');
      if(titulo) titulo.textContent = ciudadNombre ? ciudadNombre.toUpperCase() : 'CIUDAD';
      if(sub) sub.textContent = [provinciaNombre, paisNombre]
        .filter(Boolean)
        .map(v=>String(v).toUpperCase())
        .join(' · ');

      const nuevoCtx = {
        pais_id:paisSeleccionado,
        provincia_id:provinciaSeleccionada,
        ciudad_id:ciudadSeleccionada,
        pais:paisNombre,
        provincia:provinciaNombre,
        ciudad:ciudadNombre,
        ts:Date.now()
      };
      try{ localStorage.setItem(CITY_CONTEXT_KEY, JSON.stringify(nuevoCtx)); }catch(e){}

      const promo = document.getElementById('moduloPromos');
      if(promo){
        const u = new URL('https://guialocal.ar/promos/');
        Object.entries(nuevoCtx).forEach(([k,v])=>{
          if(k !== 'ts' && v) u.searchParams.set(k,v);
        });
        promo.href = u.toString();
      }
      const eventos = document.getElementById('moduloEventos');
      if(eventos){
        const u = new URL(EVENTS_PAGE_URL);
        Object.entries(nuevoCtx).forEach(([k,v])=>{
          if(k !== 'ts' && v) u.searchParams.set(k,v);
        });
        eventos.href = u.toString();
      }

      const cambiar = document.getElementById('cambiarCiudad');
      if(cambiar){
        cambiar.addEventListener('click', ()=>{
          try{ localStorage.removeItem(CITY_CONTEXT_KEY); }catch(e){}
          try{ window.top.location.href = 'https://guialocal.ar/'; }
          catch(e){ window.location.href = 'https://guialocal.ar/'; }
        });
      }

      try{
        await iniciarBootstrapCompleto();
      }catch(e){
        console.error('No se pudo cargar el bootstrap de catálogos:', e);
      }

      await Promise.all([
        cargarGuiaSeleccionada(),
        cargarFarmaciasTurnoGuia(),
        cargarEfemeridesHoyGuia()
      ]);
    }

    iniciarGuiaDesdeMochila();

</script>

<script>
(function(){
  function isYouTubeFrame(el){
    if(!el || String(el.tagName||'').toLowerCase()!=='iframe') return false;
    const src=String(el.getAttribute('src')||'').toLowerCase();
    return src.includes('youtube.com/embed/') || src.includes('youtube-nocookie.com/embed/');
  }

  function ytCommand(frame,func){
    try{
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage(JSON.stringify({
          event:'command',
          func:func,
          args:[]
        }),'*');
      }
    }catch(e){}
  }

  function bindSoundControl(media){
    if(!media || media.dataset.gldSoundBound==='1') return;

    const tag=String(media.tagName||'').toLowerCase();
    const isNative=tag==='video';
    const isYT=isYouTubeFrame(media);
    if(!isNative && !isYT) return;

    const mediaHost=media.parentElement;
    if(!mediaHost) return;

    const banner=media.closest ? media.closest('.banner-tarjeta') : null;
    const buttonHost=banner || mediaHost;

    media.dataset.gldSoundBound='1';

    const existing=buttonHost.querySelector('.gld-media-sound-btn');
    if(existing) existing.remove();

    const btn=document.createElement('button');
    btn.type='button';
    btn.className='gld-media-sound-btn';
    btn.setAttribute('aria-label','Activar sonido del video');

    let muted=true;
    if(isNative) muted=media.muted !== false;
    else{
      const src=String(media.getAttribute('src')||'');
      muted=/[?&]mute=1(?:&|$)/.test(src);
    }

    function paint(){
      const label=muted ? '🔊 Activar sonido' : '🔇 Silenciar';
      btn.textContent=label;
      btn.setAttribute('aria-label',label.replace(/^..\s*/,''));
      btn.setAttribute('title',label.replace(/^..\s*/,''));
    }

    btn.addEventListener('click',function(ev){
      ev.preventDefault();
      ev.stopPropagation();

      muted=!muted;

      if(isNative){
        try{
          media.muted=muted;
          if(!muted) media.volume=1;
          const p=media.play();
          if(p && typeof p.catch==='function') p.catch(()=>{});
        }catch(e){}
      }else{
        if(muted){
          ytCommand(media,'mute');
        }else{
          ytCommand(media,'unMute');
          ytCommand(media,'setVolume',[100]);
          ytCommand(media,'playVideo');
          setTimeout(()=>ytCommand(media,'playVideo'),80);
        }
      }

      paint();
    });

    if(banner){
      mediaHost.insertAdjacentElement('afterend',btn);
    }else{
      buttonHost.appendChild(btn);
    }
    paint();
  }

  function scan(root){
    const base=root && root.querySelectorAll ? root : document;
    if(base.matches && (base.matches('video') || isYouTubeFrame(base))) bindSoundControl(base);
    if(base.querySelectorAll){
      base.querySelectorAll('video,iframe').forEach(function(el){
        if(String(el.tagName||'').toLowerCase()==='video' || isYouTubeFrame(el)) bindSoundControl(el);
      });
    }
  }

  function start(){
    scan(document);
    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node && node.nodeType===1) scan(node);
        });
      });
    });
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();


    /* ALTURA AUTOMÁTICA PARA EL IFRAME DE JIMDO */
    (() => {
      let ultimoAlto = 0;
      let rafAltura = 0;

      const MIN_ALTURA_IFRAME_GLD = 700;

      function medirYEnviarAltura(){
        cancelAnimationFrame(rafAltura);
        rafAltura = requestAnimationFrame(() => {
          const altoReal = Math.max(
            document.body ? document.body.scrollHeight : 0,
            document.documentElement ? document.documentElement.scrollHeight : 0
          );
          const alto = Math.max(MIN_ALTURA_IFRAME_GLD, altoReal);

          if(!alto || Math.abs(alto - ultimoAlto) < 2) return;
          ultimoAlto = alto;

          window.parent.postMessage({
            tipo:'alturaIframeGLD',
            altura:alto,
            ruta:window.location.pathname
          }, '*');
        });
      }

      window.addEventListener('load', medirYEnviarAltura);
      window.addEventListener('resize', medirYEnviarAltura);

      if('ResizeObserver' in window){
        const ro = new ResizeObserver(medirYEnviarAltura);
        if(document.body) ro.observe(document.body);
        if(document.documentElement) ro.observe(document.documentElement);
      }

      if('MutationObserver' in window && document.body){
        const mo = new MutationObserver(medirYEnviarAltura);
        mo.observe(document.body, {
          childList:true,
          subtree:true,
          attributes:true,
          characterData:false
        });
      }

      document.addEventListener('click', () => {
        setTimeout(medirYEnviarAltura, 60);
        setTimeout(medirYEnviarAltura, 350);
      });

      setTimeout(medirYEnviarAltura, 100);
      setTimeout(medirYEnviarAltura, 600);
      setTimeout(medirYEnviarAltura, 1500);
    })();

</script>

" class=\"promo-filter-notice\"><\/div>\n  <div id=\"categoriesBar\" class=\"categories-bar\"><\/div>\n  <div id=\"cards\" class=\"cards-container\">\n    <div class=\"promos-loading\" role=\"status\" aria-live=\"polite\">\n      <span class=\"promos-loading-spinner\" aria-hidden=\"true\"><\/span>\n      <span>Cargando promociones de la ciudad...<\/span>\n    <\/div>\n  <\/div>\n  <div id=\"paginator\" class=\"paginator\"><\/div>\n\n  <section id=\"farmaciaTurnoSection\" class=\"farma-turno-section\">\n    <h2>💊 Farmacias de turno<\/h2>\n    <div id=\"farmaTurnoCiudad\"><\/div>\n    <div id=\"farmaTurnoHoy\" class=\"farma-turno-list\"><div class=\"farma-state\">Cargando farmacia de turno...<\/div><\/div>\n    <details class=\"farma-week\">\n      <summary>Ver próximos 7 días<\/summary>\n      <div id=\"farmaTurnoSemanaContenido\"><\/div>\n    <\/details>\n  <\/section>\n\n\n  <script>\n    const DATA_URL = \"https://script.google.com/macros/s/AKfycbwZ4UR8pKD5Y0tLsD2VVa82tvRJ8LxZw8jqbz3mhg4RCZc2Tu9lDVjL3gohIsokRWo0/exec\";\n    const BANNERS_URL = \"https://opensheet.elk.sh/170kTZ-ViCPxPli86g-n_XMuMv1S3O0-DbGwNFGYVnjY/banners\";\n    let banners = [];\n    const bannersPromise = fetch(BANNERS_URL).then(r=>r.json()).catch(()=>[]);\n    const CITY_CONTEXT_KEY = 'gld_ciudad_contexto';\n    let pageParams = new URLSearchParams(window.location.search || '');\n    try{\n      const ref = new URL(document.referrer || '');\n      const refParams = new URLSearchParams(ref.search || '');\n      if(!pageParams.get('ciudad_id') && refParams.get('ciudad_id')) pageParams = refParams;\n    }catch(e){}\n    let ciudadContexto = {\n      pais_id:String(pageParams.get('pais_id') || '').trim(),\n      provincia_id:String(pageParams.get('provincia_id') || '').trim(),\n      ciudad_id:String(pageParams.get('ciudad_id') || '').trim(),\n      pais:String(pageParams.get('pais') || '').trim(),\n      provincia:String(pageParams.get('provincia') || '').trim(),\n      ciudad:String(pageParams.get('ciudad') || '').trim()\n    };\n    try{\n      const saved=JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY)||'null');\n      if(saved){\n        ['pais_id','provincia_id','ciudad_id','pais','provincia','ciudad'].forEach(k=>{\n          if(!ciudadContexto[k] && saved[k]) ciudadContexto[k]=String(saved[k]).trim();\n        });\n      }\n      if(ciudadContexto.ciudad_id) localStorage.setItem(CITY_CONTEXT_KEY,JSON.stringify(ciudadContexto));\n    }catch(e){}\n\n\n    let comerciosData = [];\n    let filtrados = [];\n    let currentPage = 1;\n    const itemsPerPage = 10;\n    let categoriasSet = new Set();\n    let categoriaFiltro = \"\";\n\n    const PROMOS_FILTER_STORAGE_KEY = 'gld_promos_filter';\n    let incomingPromoFilter = null;\n\n    function normalizeFilterText(v){\n      return String(v || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n    }\n    function promoFilterKey(p){\n      const pid = String(p && p.promo_id || '').trim();\n      if(pid) return 'id:' + pid;\n      const nombre = normalizeFilterText(p && (p.anunciante || p.nombre));\n      const promo = normalizeFilterText(p && p.promo);\n      const desde = String(p && p.desde || '').trim();\n      const hasta = String(p && p.hasta || '').trim();\n      return ['fallback', nombre, promo, desde, hasta].join('|');\n    }\n    function readIncomingPromoFilter(){\n      const id = String(pageParams.get('id_comercio') || '').trim();\n      const anunciante = String(pageParams.get('anunciante') || '').trim();\n      const sede_id = String(pageParams.get('sede_id') || '').trim();\n\n      let stored = null;\n      try{\n        const raw = localStorage.getItem(PROMOS_FILTER_STORAGE_KEY);\n        if(raw){\n          const parsed = JSON.parse(raw);\n          const age = Date.now() - Number(parsed.ts || 0);\n          if(age >= 0 && age <= 10 * 60 * 1000) stored = parsed;\n        }\n        localStorage.removeItem(PROMOS_FILTER_STORAGE_KEY);\n      }catch(e){}\n\n      // En la app unificada, el filtro puede llegar sólo por el puente localStorage\n      // porque el módulo vive dentro del mismo HTML y no cambia la URL principal.\n      if(!(id || anunciante || sede_id || stored)) return null;\n\n      return Object.assign({}, stored || {}, {\n        id_comercio:id || (stored && stored.id_comercio) || '',\n        anunciante:anunciante || (stored && stored.anunciante) || '',\n        sede_id:sede_id || (stored && stored.sede_id) || ''\n      });\n    }\n\n    function promoMatchesIncomingFilter(p, filter){\n      if(!filter) return true;\n\n      const keys = Array.isArray(filter.promo_keys) ? filter.promo_keys.filter(Boolean) : [];\n      if(keys.length && keys.includes(promoFilterKey(p))) return true;\n\n      const wantedSede = String(filter.sede_id || '').trim();\n      const promoSede = String(p && p.sede_id || '').trim();\n      if(wantedSede && promoSede && wantedSede === promoSede) return true;\n\n      const wantedId = String(filter.id_comercio || '').trim();\n      const promoId = String(p && (p.id_comercio || p.comercio_id || p.id_anunciante || '') || '').trim();\n      if(wantedId && promoId && wantedId === promoId) return true;\n\n      const wantedName = normalizeFilterText(filter.anunciante);\n      const promoName = normalizeFilterText(p && (p.anunciante || p.nombre || p.comercio));\n      return !!wantedName && promoName === wantedName;\n    }\n    function showPromoFilterNotice(filter, count){\n      const el = document.getElementById('promoFilterNotice');\n      if(!el || !filter) return;\n      const name = String(filter.anunciante || '').trim();\n      el.style.display = 'block';\n      if(count > 0){\n        el.textContent = name ? `Promos activas de ${name}` : 'Promos activas del anunciante seleccionado';\n      }else{\n        el.textContent = name ? `No encontramos promos activas de ${name}` : 'No encontramos promos activas para este anunciante';\n      }\n    }\n\n    function fechaHumana(fecha) {\n      if (!fecha) return \"\";\n      if (!isNaN(fecha) && typeof fecha !== \"string\") {\n        const base = Date.UTC(1899,11,30);\n        fecha = new Date(base + Number(fecha) * 86400000);\n      }\n      const d = new Date(fecha);\n      if (isNaN(d.getTime())) return String(fecha);\n      const meses = [\"enero\",\"febrero\",\"marzo\",\"abril\",\"mayo\",\"junio\",\"julio\",\"agosto\",\"septiembre\",\"octubre\",\"noviembre\",\"diciembre\"];\n      return `${d.getUTCDate()} de ${meses[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;\n    }\n\n    function escapeHtml(text) {\n      if (text === null || text === undefined) return \"\";\n      return String(text).replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\").replace(/'/g,\"&#039;\");\n    }\n\n    function encodeUrl(u) {\n      if (!u) return '';\n      u = String(u).trim();\n      if (/^https?:\\/\\//i.test(u)) return u;\n      if (/^mailto:/i.test(u) || /^tel:/i.test(u)) return u;\n      if (/^www\\./i.test(u)) return 'https://' + u;\n      return 'https://' + u;\n    }\n\n    function normalizeDigits(s) {\n      if (!s) return '';\n      return String(s).replace(/[^\\d]/g, '');\n    }\n\n    function makeWhatsAppLink(wh) {\n      if (!wh) return \"\";\n      const s = String(wh).trim();\n      if (!s) return \"\";\n      if (/^https?:\\/\\//i.test(s)) return s;\n      if (/^(?:https?:\\/\\/)?(?:wa\\.me|api\\.whatsapp\\.com)/i.test(s)) {\n        return (/^https?:\\/\\//i.test(s) ? s : 'https://' + s.replace(/^\\/+/, ''));\n      }\n      const digits = s.replace(/[^0-9]/g, '');\n      if (digits.length >= 6) return 'https://wa.me/' + digits;\n      return encodeUrl(s);\n    }\n\n    function getWhatsAppForCom(com, phoneComparison) {\n      if (!com) return \"\";\n      const candidates = [];\n      if (com.whatsapp) candidates.push(com.whatsapp);\n      const extras = com.extras || {};\n      const keys = ['whatsapp','whatsapp_url','whatsapp_link','wa','wpp','wsp','whats','whats_app','whatsappnumber','whatsapp_num'];\n      keys.forEach(k => { if (k in extras && extras[k]) candidates.push(extras[k]); });\n      Object.keys(extras).forEach(k => {\n        if (/^(?:wa|wpp|whats|whatsapp)/i.test(k) && extras[k]) candidates.push(extras[k]);\n      });\n\n      for (let i = 0; i < candidates.length; i++) {\n        const v = candidates[i];\n        if (!v) continue;\n        const str = String(v).trim();\n        if (!str) continue;\n        const link = makeWhatsAppLink(str);\n        if (!link) continue;\n        return link;\n      }\n      return \"\";\n    }\n\n    function makeMapLink(llegarVal, domicilioVal) {\n      if (llegarVal && String(llegarVal).trim()) {\n        const v = String(llegarVal).trim();\n        if (/^https?:\\/\\//i.test(v)) return v;\n        if (/^-?\\d+(\\.\\d+)?\\s*,\\s*-?\\d+(\\.\\d+)?$/.test(v)) {\n          const coords = v.replace(/\\s+/g,'');\n          return `https://www.google.com/maps?q=${coords}`;\n        }\n        return encodeUrl(v);\n      }\n      if (domicilioVal && String(domicilioVal).trim()) {\n        const q = encodeURIComponent(String(domicilioVal).trim());\n        return `https://www.google.com/maps/search/?api=1&query=${q}`;\n      }\n      return \"\";\n    }\n\n    function encodeTel(t) {\n      if (!t) return '';\n      return String(t).replace(/[^\\d+]/g, '');\n    }\n\n    function safeUrl(u) {\n      try {\n        const v = encodeUrl(u);\n        if (!v) return '';\n        if (/^https?:\\/\\/\\s*$/i.test(v)) return '';\n        return v;\n      } catch (e) { return ''; }\n    }\n\n    // Render categories bar with logo at start\n    function renderCategoriesBar() {\n      const bar = document.getElementById('categoriesBar');\n      bar.innerHTML = '';\n      if (categoriasSet.size <= 1) return;\n      Array.from(categoriasSet).forEach(cat => {\n        // Find a logo_categoria for this category\n        let logoCat = \"\";\n        for (let c of comerciosData) {\n          if (c.categoria && c.categoria === cat && c.logo_categoria) { logoCat = c.logo_categoria; break; }\n        }\n        const btn = document.createElement('button');\n        btn.className = 'category-chip' + (categoriaFiltro === cat ? ' selected' : '');\n\n        // Logo al inicio\n        let imgHtml = '';\n        if (logoCat) imgHtml = `<img class=\"logo-categoria\" src=\"${safeUrl(logoCat)}\" alt=\"${escapeHtml(cat)}\" onerror=\"this.style.display='none'\">`;\n\n        btn.innerHTML = imgHtml + escapeHtml(cat);\n        btn.onclick = () => {\n          categoriaFiltro = (categoriaFiltro === cat ? '' : cat);\n          document.getElementById('search').value = '';\n          aplicarFiltro('');\n        };\n        bar.appendChild(btn);\n      });\n      if (categoriaFiltro) {\n        const limpiar = document.createElement('button');\n        limpiar.className = 'category-chip';\n        limpiar.style.background = '#eee';\n        limpiar.style.color = '#333';\n        limpiar.textContent = 'Todas las categorías';\n        limpiar.onclick = () => { categoriaFiltro = ''; aplicarFiltro(''); };\n        bar.insertBefore(limpiar, bar.firstChild);\n      }\n    }\n\n    // buildCatLabel sin mover el logo_categoria, para que quede igual en cards\n    function buildCatLabel(com) {\n      if (!com || !com.categoria || !String(com.categoria).trim()) return '';\n      let imgHtml = '';\n      if (com.logo_categoria) {\n        const src = safeUrl(com.logo_categoria);\n        if (src) imgHtml = `<img class=\"logo-categoria\" src=\"${src}\" alt=\"${escapeHtml(com.categoria)}\" onerror=\"this.style.display='none'\">`;\n      } else if (com.logo1) {\n        const src = safeUrl(com.logo1);\n        if (src) imgHtml = `<img class=\"logo-categoria\" src=\"${src}\" alt=\"${escapeHtml(com.categoria)}\" onerror=\"this.style.display='none'\">`;\n      }\n      return `<div class=\"cat-label\" style=\"margin-top:8px\">${imgHtml}${escapeHtml(com.categoria)}<\/div>`;\n    }\n\n\n    function isVideoFile(url){\n      return typeof url==='string' && /\\.(mp4|webm|ogg)(\\?.*)?$/i.test(url);\n    }\n    function isYouTube(url){\n      return typeof url==='string' && /youtu(be\\.com|\\.be)/i.test(url);\n    }\n    function getYouTubeEmbedUrl(url){\n      try{\n        let id='';\n        const u=new URL(url);\n        if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1);\n        else{\n          id=u.searchParams.get('v')||'';\n          if(!id){ const parts=u.pathname.split('/').filter(Boolean); id=parts.pop()||''; }\n        }\n        if(!id) return '';\n        const p=new URLSearchParams({\n          rel:0,playsinline:1,enablejsapi:1,modestbranding:1,\n          autoplay:1,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3\n        });\n        return `https://www.youtube.com/embed/${id}?${p.toString()}`;\n      }catch(e){ return ''; }\n    }\n\n    function promoYtCommand(frame,func,args){\n      try{\n        if(frame && frame.contentWindow){\n          frame.contentWindow.postMessage(JSON.stringify({\n            event:'command',func:func,args:Array.isArray(args)?args:[]\n          }),'*');\n        }\n      }catch(e){}\n    }\n\n    function attachPromoSoundButton(media,banner){\n      if(!media || !banner) return;\n      const old=banner.querySelector('.promo-video-sound-btn');\n      if(old) old.remove();\n\n      let muted=true;\n      const btn=document.createElement('button');\n      btn.type='button';\n      btn.className='promo-video-sound-btn';\n\n      function paint(){\n        btn.textContent=muted ? '🔊 Activar sonido' : '🔇 Silenciar';\n        btn.setAttribute('aria-label',muted ? 'Activar sonido' : 'Silenciar');\n      }\n\n      btn.onclick=function(e){\n        e.preventDefault();\n        e.stopPropagation();\n        muted=!muted;\n        if(String(media.tagName||'').toLowerCase()==='video'){\n          media.muted=muted;\n          if(!muted) media.volume=1;\n          try{\n            const p=media.play();\n            if(p&&p.catch) p.catch(()=>{});\n          }catch(err){}\n        }else{\n          if(muted){\n            promoYtCommand(media,'mute');\n          }else{\n            promoYtCommand(media,'unMute');\n            promoYtCommand(media,'setVolume',[100]);\n            promoYtCommand(media,'playVideo');\n            setTimeout(()=>promoYtCommand(media,'playVideo'),80);\n          }\n        }\n        paint();\n      };\n\n      const cta=banner.querySelector('.cta-btn');\n      if(cta) banner.insertBefore(btn,cta);\n      else banner.appendChild(btn);\n      paint();\n    }\n\n    function renderBanner(banner,idx){\n      const id=`promo-banner-${idx}-${Math.floor(Math.random()*10000)}`;\n      const cta=(banner.cta&&banner.cta.trim()) ? banner.cta.trim() : 'https://www.guialocaldolores.com.ar';\n      const replay=`<button class=\"replay-btn\" data-target-id=\"${id}\">Reproducir nuevamente<\/button>`;\n\n      if(banner.img){\n        return `<div class=\"banner-tarjeta\">\n          <div id=\"${id}\" class=\"banner-media\"><img src=\"${banner.img}\" alt=\"Banner\"><\/div>\n          ${replay}\n          <a class=\"cta-btn\" href=\"${cta}\" target=\"_blank\" rel=\"noopener noreferrer\">Visitá el micrositio del anunciante<\/a>\n        <\/div>`;\n      }\n      if(banner.media && isVideoFile(banner.media)){\n        const poster=banner.poster ? `poster=\"${banner.poster}\"` : '';\n        return `<div class=\"banner-tarjeta\">\n          <div id=\"${id}\" class=\"banner-media\">\n            <video class=\"banner-media-video\" data-src=\"${banner.media}\" ${poster} muted playsinline preload=\"metadata\"><\/video>\n          <\/div>\n          ${replay}\n          <a class=\"cta-btn\" href=\"${cta}\" target=\"_blank\" rel=\"noopener noreferrer\">Visitá el micrositio del anunciante<\/a>\n        <\/div>`;\n      }\n      if(banner.media && isYouTube(banner.media)){\n        const embed=getYouTubeEmbedUrl(banner.media);\n        return `<div class=\"banner-tarjeta\">\n          <div id=\"${id}\" class=\"banner-media\" data-src=\"${embed}\"><\/div>\n          ${replay}\n          <a class=\"cta-btn\" href=\"${cta}\" target=\"_blank\" rel=\"noopener noreferrer\">Visitá el micrositio del anunciante<\/a>\n        <\/div>`;\n      }\n      return '';\n    }\n\n    function initPromoBanners(){\n      document.querySelectorAll('.banner-tarjeta').forEach(banner=>{\n        const host=banner.querySelector('.banner-media');\n        if(!host) return;\n\n        const native=host.querySelector('video');\n        if(native){\n          const src=native.dataset.src||'';\n          if(src && !native.src){\n            native.src=src;\n            native.muted=true;\n            native.playsInline=true;\n            native.autoplay=true;\n            try{ const p=native.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}\n          }\n          attachPromoSoundButton(native,banner);\n          const replay=banner.querySelector('.replay-btn');\n          native.onended=()=>{ if(replay) replay.style.display='inline-flex'; };\n          return;\n        }\n\n        const ds=host.dataset.src||'';\n        if(ds && !host.querySelector('iframe')){\n          const iframe=document.createElement('iframe');\n          iframe.src=ds;\n          iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');\n          iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');\n          iframe.setAttribute('allowfullscreen','true');\n          host.appendChild(iframe);\n          attachPromoSoundButton(iframe,banner);\n        }\n      });\n\n      document.querySelectorAll('.banner-tarjeta .replay-btn').forEach(btn=>{\n        btn.onclick=function(){\n          const host=document.getElementById(btn.dataset.targetId||'');\n          if(!host) return;\n          const video=host.querySelector('video');\n          const iframe=host.querySelector('iframe');\n          if(video){\n            try{ video.currentTime=0; video.play(); btn.style.display='none'; }catch(e){}\n          }else if(iframe){\n            promoYtCommand(iframe,'seekTo',[0,true]);\n            promoYtCommand(iframe,'playVideo');\n            btn.style.display='none';\n          }\n        };\n      });\n    }\n\n    function shuffleArray(arr){\n      for(let i=arr.length-1;i>0;i--){\n        const j=Math.floor(Math.random()*(i+1));\n        [arr[i],arr[j]]=[arr[j],arr[i]];\n      }\n    }\n    function buildBannerSequence(slots){\n      if(!banners.length || slots<=0) return [];\n      const out=[];\n      while(out.length<slots){\n        const pool=banners.slice();\n        shuffleArray(pool);\n        for(const b of pool){\n          if(out.length>=slots) break;\n          out.push(b);\n        }\n        if(!pool.length) break;\n      }\n      return out.slice(0,slots);\n    }\n\n    function renderCards(data, page = 1) {\n      const cardsDiv = document.getElementById('cards');\n      cardsDiv.innerHTML = '';\n      const start = (page - 1) * itemsPerPage;\n      const end = start + itemsPerPage;\n      const pageData = data.slice(start, end).filter(hasMeaningfulData);\n      let count = 0;\n      const bannerSeq = buildBannerSequence(Math.floor((pageData.length - 1) / 2));\n\n      pageData.forEach((com,pageIndex) => {\n\n        const card = document.createElement('div');\n        card.className = 'card';\n\n        const leftParts = [];\n        if (com.logo && safeUrl(com.logo)) {\n          leftParts.push(`<img class=\"logo-comercio\" src=\"${safeUrl(com.logo)}\" alt=\"${escapeHtml(com.anunciante||com.nombre||'')}\" onerror=\"this.style.display='none'\">`);\n        }\n        const nombre = com.anunciante || com.nombre || '';\n        leftParts.push(`<div class=\"title-block\"><div class=\"card-title\">${escapeHtml(nombre)}<\/div>${buildCatLabel(com)}<\/div>`);\n\n        const leftHtml = `<div class=\"card-logos-row\"><div class=\"left-row\" style=\"display:flex;gap:12px;align-items:center\">${leftParts.join('')}<\/div><\/div>`;\n\n        const promoHtml = (com.promo && String(com.promo).trim()) ? `<div class=\"promo-row\"><i class=\"ri-gift-line\" style=\"margin-right:8px\"><\/i>${escapeHtml(com.promo)}<\/div>` : '';\n        const otrosHtml = (com.otros && String(com.otros).trim()) ? `<div class=\"otros-row\"><i class=\"ri-information-line\" style=\"margin-right:6px\"><\/i>${escapeHtml(com.otros)}<\/div>` : '';\n\n        const desdeHtml = com.desde ? `<div><div class=\"date-label\">DESDE<\/div><div class=\"fecha-row date-desde\"><i class=\"ri-calendar-event-line\"><\/i> ${fechaHumana(com.desde)}<\/div><\/div>` : '';\n        const hastaHtml = com.hasta ? `<div><div class=\"date-label\">HASTA<\/div><div class=\"fecha-row date-hasta\"><i class=\"ri-calendar-event-line\"><\/i> ${fechaHumana(com.hasta)}<\/div><\/div>` : '';\n\n        const domicilioHtml = (com.direccion && String(com.direccion).trim()) ? `<div class=\"info-row\"><i class=\"ri-map-pin-line icon\"><\/i>${escapeHtml(com.direccion)}<\/div>` : '';\n        const telefonoHtml = (com.telefono && String(com.telefono).trim()) ? `<div class=\"info-row\"><i class=\"ri-phone-line icon\"><\/i><span style=\"font-weight:700\">${escapeHtml(com.telefono)}<\/span><\/div>` : '';\n\n        const socials = [];\n        const waLink = getWhatsAppForCom(com, com.telefono);\n        if (waLink) {\n          const href = safeUrl(waLink) || waLink;\n          if (href) socials.push(`<a href=\"${href}\" target=\"_blank\" rel=\"noopener\" title=\"WhatsApp\"><i class=\"ri-whatsapp-line\"><\/i><\/a>`);\n        }\n        if (com.instagram && safeUrl(com.instagram)) socials.push(`<a href=\"${safeUrl(com.instagram)}\" target=\"_blank\" rel=\"noopener\" title=\"Instagram\"><i class=\"ri-instagram-line\"><\/i><\/a>`);\n        if (com.facebook && safeUrl(com.facebook)) socials.push(`<a href=\"${safeUrl(com.facebook)}\" target=\"_blank\" rel=\"noopener\" title=\"Facebook\"><i class=\"ri-facebook-line\"><\/i><\/a>` n    }\n\n\n    function eventYouTubeCommand(frame,func,args){\n      try{\n        if(frame && frame.contentWindow){\n          frame.contentWindow.postMessage(JSON.stringify({\n            event:'command',func:func,args:Array.isArray(args)?args:[]\n          }),'*');\n        }\n      }catch(e){}\n    }\n\n    function attachEventSoundButton(frame, host){\n      if(!frame || !host) return;\n      const old=host.querySelector('.video-sound-btn');\n      if(old) old.remove();\n\n      let muted=true;\n      const btn=document.createElement('button');\n      btn.type='button';\n      btn.className='video-sound-btn';\n\n      function paint(){\n        btn.textContent=muted ? '🔊 Activar sonido' : '🔇 Silenciar';\n        btn.setAttribute('aria-label',muted ? 'Activar sonido' : 'Silenciar');\n      }\n\n      btn.onclick=function(e){\n        e.preventDefault();\n        e.stopPropagation();\n        muted=!muted;\n        eventYouTubeCommand(frame,muted ? 'mute' : 'unMute');\n        if(!muted) eventYouTubeCommand(frame,'setVolume',[100]);\n        paint();\n      };\n\n      host.appendChild(btn);\n      paint();\n    }\n\n    function mountYouTubeBlock(parentEl,title,url){\n      let videoId='';\n      let isShort=false;\n      try{\n        const u=new URL(String(url||'').trim());\n        const parts=u.pathname.split('/').filter(Boolean);\n        isShort=parts.some(p=>String(p).toLowerCase()==='shorts');\n        if(u.hostname.includes('youtu.be')) videoId=parts[0]||'';\n        else if(u.searchParams.get('v')) videoId=u.searchParams.get('v');\n        else{\n          const marker=parts.findIndex(p=>['embed','shorts','live'].includes(String(p).toLowerCase()));\n          videoId=marker>=0&&parts[marker+1]?parts[marker+1]:'';\n        }\n      }catch(e){}\n      videoId=String(videoId||'').split(/[?&#]/)[0].trim();\n      if(!videoId) return null;\n\n      const wrap=document.createElement('div');\n      wrap.className='embed-wrap';\n\n      const head=document.createElement('div');\n      head.className='embed-head';\n      const label=document.createElement('span');\n      label.textContent=title;\n      const close=document.createElement('button');\n      close.className='embed-close';\n      close.type='button';\n      close.textContent='Ocultar';\n      head.appendChild(label);\n      head.appendChild(close);\n\n      const shell=document.createElement('div');\n      shell.style.position='relative';\n      shell.style.width=isShort?'min(100%,360px)':'100%';\n      shell.style.aspectRatio=isShort?'9 / 16':'16 / 9';\n      shell.style.background='#000';\n      shell.style.overflow='hidden';\n      shell.style.margin='0 auto';\n\n      const posterUrl=`https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`;\n      const cover=document.createElement('div');\n      cover.style.position='absolute';\n      cover.style.inset='0';\n      cover.style.zIndex='20';\n      cover.style.display='flex';\n      cover.style.alignItems='center';\n      cover.style.justifyContent='center';\n      cover.style.background=`linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url(${posterUrl}) center / cover no-repeat`;\n\n      const play=document.createElement('button');\n      play.type='button';\n      play.textContent='▶ Reproducir video';\n      play.style.border='0';\n      play.style.borderRadius='999px';\n      play.style.padding='12px 18px';\n      play.style.fontWeight='900';\n      play.style.cursor='pointer';\n      cover.appendChild(play);\n      shell.appendChild(cover);\n\n      wrap.appendChild(head);\n      wrap.appendChild(shell);\n      parentEl.appendChild(wrap);\n\n      let player=null;\n      let iframe=null;\n      let hidden=false;\n\n      function restoreCover(){\n        try{if(player&&typeof player.destroy==='function') player.destroy();}catch(e){}\n        player=null;\n        iframe=null;\n        shell.querySelectorAll('iframe,.yt-event-shield').forEach(el=>el.remove());\n        cover.style.display='flex';\n      }\n\n      function startVideo(){\n        if(iframe) return;\n        cover.style.display='none';\n\n        const iframeId='event-yt-'+Math.floor(Math.random()*1000000000);\n        iframe=document.createElement('iframe');\n        iframe.id=iframeId;\n        iframe.src='https://www.youtube.com/embed/'+encodeURIComponent(videoId)+\n          '?enablejsapi=1&autoplay=1&mute=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&rel=0&playsinline=1&modestbranding=1';\n        iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');\n        iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');\n        iframe.setAttribute('title',title||'Video');\n        iframe.style.position='absolute';\n        iframe.style.width='116%';\n        iframe.style.height='116%';\n        iframe.style.left='-8%';\n        iframe.style.top='-8%';\n        iframe.style.border='0';\n        iframe.style.pointerEvents='none';\n        shell.insertBefore(iframe,cover);\n\n        const shield=document.createElement('div');\n        shield.className='yt-event-shield';\n        shield.style.position='absolute';\n        shield.style.inset='0';\n        shield.style.zIndex='10';\n        shield.style.background='transparent';\n        shield.style.pointerEvents='auto';\n        shell.appendChild(shield);\n\n        try{ensureYouTubeAPI();}catch(e){}\n        let attempts=0;\n        const attach=()=>{\n          if(window.YT&&YT.Player){\n            try{\n              player=new YT.Player(iframeId,{\n                events:{\n                  onStateChange:function(e){\n                    if(e.data===YT.PlayerState.ENDED) restoreCover();\n                  },\n                  onError:function(){restoreCover();}\n                }\n              });\n            }catch(e){}\n            return;\n          }\n          attempts++;\n          if(attempts<80) setTimeout(attach,150);\n        };\n        attach();\n      }\n\n      play.addEventListener('click',startVideo);\n\n      close.onclick=()=>{\n        hidden=!hidden;\n        shell.style.display=hidden?'none':'block';\n        close.textContent=hidden?'Ver':'Ocultar';\n        if(hidden&&player){try{player.pauseVideo();}catch(e){}}\n      };\n\n      return wrap;\n    }\n\n    const PLACEHOLDER_SVG = `data:image/svg+xml;utf8,` +\n      encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='480' height='320'><rect width='100%' height='100%' fill='#eef4ff'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='22' fill='#889'>Auspicia<\/text><\/svg>`);\n\n    let eventosData = [], eventosFiltrados = [], ciudadesData = [], currentPage = 1, eventsPerPage = 6;\n\n    /* Contexto territorial global: Inicio -> Guía / Promos / Eventos */\n    const CITY_CONTEXT_KEY = 'gld_ciudad_contexto';\n    let initialParams = new URLSearchParams(window.location.search || '');\n    try{\n      const ref = new URL(document.referrer || '');\n      const refParams = new URLSearchParams(ref.search || '');\n      if(!initialParams.get('ciudad_id') && refParams.get('ciudad_id')) initialParams = refParams;\n    }catch(e){}\n\n    let ciudadContexto = {\n      pais_id:String(initialParams.get('pais_id') || '').trim(),\n      provincia_id:String(initialParams.get('provincia_id') || '').trim(),\n      ciudad_id:String(initialParams.get('ciudad_id') || initialParams.get('ciudadId') || '').trim(),\n      pais:String(initialParams.get('pais') || '').trim(),\n      provincia:String(initialParams.get('provincia') || '').trim(),\n      ciudad:String(initialParams.get('ciudad') || '').trim()\n    };\n\n    try{\n      const saved = JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY) || 'null');\n      if(saved){\n        ['pais_id','provincia_id','ciudad_id','pais','provincia','ciudad'].forEach(k=>{\n          if(!ciudadContexto[k] && saved[k]) ciudadContexto[k] = String(saved[k]).trim();\n        });\n      }\n      if(ciudadContexto.ciudad_id){\n        localStorage.setItem(CITY_CONTEXT_KEY, JSON.stringify({...ciudadContexto, ts:Date.now()}));\n      }\n    }catch(e){}\n\n    function contextoUrl(baseUrl, conCiudad=true){\n      const u = new URL(baseUrl);\n      if(conCiudad){\n        Object.entries(ciudadContexto).forEach(([k,v])=>{ if(k!=='ts' && v) u.searchParams.set(k,v); });\n      }\n      return u.toString();\n    }\n\n    function navegarArriba(url){\n      try{ window.top.location.href = url; }\n      catch(e){ window.location.href = url; }\n    }\n\n    function pintarContextoCiudad(){\n      const ciudadEl = document.getElementById('ciudadContexto');\n      const ciudadSub = document.getElementById('ciudadSubtitulo');\n      if(ciudadEl) ciudadEl.textContent = (ciudadContexto.ciudad || ciudadContexto.ciudad_id || 'CIUDAD').toUpperCase();\n      if(ciudadSub) ciudadSub.textContent = [ciudadContexto.provincia, ciudadContexto.pais].filter(Boolean).join(' - ');\n    }\n\n    pintarContextoCiudad();\n\n    /* Integración desde fichas de anunciantes.\n       El filtro comercial es temporal, pero siempre se aplica dentro de la ciudad activa. */\n    const EVENTS_FILTER_STORAGE_KEY = 'gld_eventos_filter';\n    let bridgedEventFilter = null;\n    try {\n      const rawBridge = localStorage.getItem(EVENTS_FILTER_STORAGE_KEY);\n      if(rawBridge){\n        const parsedBridge = JSON.parse(rawBridge);\n        const age = Date.now() - Number(parsedBridge && parsedBridge.ts || 0);\n        if(parsedBridge && age >= 0 && age < 5 * 60 * 1000) bridgedEventFilter = parsedBridge;\n        localStorage.removeItem(EVENTS_FILTER_STORAGE_KEY);\n      }\n    } catch(e) {}\n    const initialOrganizerFilter = String(initialParams.get('organizador') || (bridgedEventFilter && bridgedEventFilter.organizador) || '').trim();\n    const initialAdvertiserIdFilter = String(initialParams.get('anunciante_id') || (bridgedEventFilter && bridgedEventFilter.anunciante_id) || '').trim();\n    const initialEventKeys = Array.isArray(bridgedEventFilter && bridgedEventFilter.event_keys)\n      ? bridgedEventFilter.event_keys.map(v=>String(v || '')).filter(Boolean) : [];\n    function normalizeMatchText(value){\n      return String(value || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n    }\n    function objectAdvertiserIds(obj){\n      return [obj && obj.id, obj && obj.comercio_id, obj && obj.advertiserId, obj && obj.advertiser_id]\n        .map(v=>String(v || '').trim()).filter(Boolean);\n    }\n    function eventBridgeKey(ev){\n      const nombre = normalizeMatchText(ev && (ev.nombre_evento || ev.nombre));\n      const desde = String(ev && (ev.fecha_desde || ev.fechaDesde || ev.fecha_desde_iso || ev.fecha || '') || '').trim();\n      const hasta = String(ev && (ev.fecha_hasta || ev.fechaHasta || ev.fecha_hasta_iso || '') || '').trim();\n      const org = normalizeMatchText(ev && (ev.organizador || ev.organizador_principal));\n      return [nombre, desde, hasta, org].join('|');\n    }\n    function eventRelatedAdvertiserNames(ev){\n      const raw = [\n        ev && ev.organizador, ev && ev.organizador_principal,\n        ev && ev.partner, ev && ev.partner2, ev && ev.partner3, ev && ev.partner4, ev && ev.partner5, ev && ev.partner6,\n        ev && ev.coorganizador, ev && ev.coorganizador2, ev && ev.coorganizador3, ev && ev.coorganizador4, ev && ev.coorganizador5, ev && ev.coorganizador6,\n        ev && ev.co_organizador, ev && ev.co_organizador2, ev && ev.coorganizador_principal,\n        ev && ev.auspiciante, ev && ev.auspiciante2, ev && ev.auspiciante3, ev && ev.auspiciante4, ev && ev.auspiciante5, ev && ev.auspiciante6,\n        ev && ev.auspicia, ev && ev.auspicia2, ev && ev.sponsor, ev && ev.sponsor2, ev && ev.sponsor3\n      ];\n      return raw\n        .flatMap(v => String(v || '').split(/[;,\\n]+/))\n        .map(v => normalizeMatchText(v))\n        .filter(Boolean);\n    }\n    function matchesInitialAdvertiser(ev){\n      /* Primero usamos las claves exactas que COM ya determinó como eventos vinculados a este anunciante. */\n      if(initialEventKeys.length && initialEventKeys.includes(eventBridgeKey(ev))) return true;\n      /* Respaldo 1: ID compartido entre anunciante y evento. */\n      if(initialAdvertiserIdFilter){\n        const ids = objectAdvertiserIds(ev);\n        if(ids.includes(initialAdvertiserIdFilter)) return true;\n      }\n      /* Respaldo 2: nombre exacto normalizado como organizador, partner, coorganizador o auspiciante. */\n      if(initialOrganizerFilter){\n        const wanted = normalizeMatchText(initialOrganizerFilter);\n        return eventRelatedAdvertiserNames(ev).includes(wanted);\n      }\n      return false;\n    }\n\n    function getFechaDesdeRaw(ev){\n      return (ev && (ev.fecha_desde ?? ev.fechaDesde ?? ev.fecha_desde_iso)) ? (ev.fecha_desde ?? ev.fechaDesde ?? ev.fecha_desde_iso) : '';\n    }\n    function getFechaHastaRaw(ev){\n      return (ev && (ev.fecha_hasta ?? ev.fechaHasta ?? ev.fecha_hasta_iso)) ? (ev.fecha_hasta ?? ev.fechaHasta ?? ev.fecha_hasta_iso) : '';\n    }\n\n    function parseToDate(value){\n      if (value === null || value === undefined || value === '') return null;\n      if (Object.prototype.toString.call(value) === '[object Date]') {\n        const d = new Date(value);\n        return isNaN(d.getTime()) ? null : d;\n      }\n      const s = String(value).trim();\n      let m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n      if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));\n      m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\n      if (m) return new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));\n      const d = new Date(s);\n      return isNaN(d.getTime()) ? null : d;\n    }\n\n    function isPastDate(desdeValue, hastaValue){\n      const dDesde = parseToDate(desdeValue);\n      const dHasta = parseToDate(hastaValue);\n      const d = dHasta || dDesde;\n      if (!d) return false;\n      const today = new Date();\n      today.setHours(0,0,0,0);\n      const onlyDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());\n      return onlyDate.getTime() < today.getTime();\n    }\n\n    function horaHumana(h){\n      if (!h) return \"\";\n      h = String(h).trim();\n      let m = h.match(/^Date\\(\\d{4},\\d{1,2},\\d{1,2},(\\d{1,2}),(\\d{1,2})/);\n      if (m) return `${String(m[1]).padStart(2,'0')}:${String(m[2]).padStart(2,'0')} hs`;\n      m = h.match(/^(\\d{1,2}):(\\d{2})(:\\d{2})?$/);\n      if (m) return `${String(m[1]).padStart(2,'0')}:${m[2]} hs`;\n      return h;\n    }\n\n    function textoAParrafoJustificado(texto){\n      if (!texto) return \"\";\n      const partes = texto.split(/\\n\\s*\\n/).length>1 ? texto.split(/\\n\\s*\\n/) : texto.split(/\\n/);\n      return partes.map(p=>`<p style=\"margin:6px 0 6px 0;text-align:justify\">${p.trim()}<\/p>`).join(\"\");\n    }\n\n    function capitalizarPrimeraLetra(txt){\n      txt = String(txt || '').trim();\n      if (!txt) return '';\n      return txt.charAt(0).toUpperCase() + txt.slice(1);\n    }\n\n    function formatRangoFechasHumano(ev){\n      const rawDesde = getFechaDesdeRaw(ev);\n      const rawHasta = getFechaHastaRaw(ev);\n      const dDesde = parseToDate(rawDesde);\n      const dHasta = parseToDate(rawHasta);\n\n      const fmt = (d) => capitalizarPrimeraLetra(\n        d.toLocaleDateString('es-AR', { weekday:'long', year:'numeric', month:'long', day:'numeric' })\n      );\n\n      if (dDesde && dHasta){\n        const sameDay =\n          dDesde.getFullYear() === dHasta.getFullYear() &&\n          dDesde.getMonth() === dHasta.getMonth() &&\n          dDesde.getDate() === dHasta.getDate();\n        if (sameDay) return fmt(dDesde);\n        return `Desde ${fmt(dDesde)} a ${fmt(dHasta)}`;\n      }\n      if (dDesde) return fmt(dDesde);\n      if (dHasta) return fmt(dHasta);\n      return '';\n    }\n\n    function getEventCategories(ev) {\n      const raw = ev && ev.categoria ? String(ev.categoria) : '';\n      return raw.split(',').map(s => s.trim()).filter(Boolean);\n    }\n\n    function hydrateCategoryFilterFromEvents(events){\n      const select = document.getElementById('categoryFilter');\n      if (!select) return;\n      const current = select.value || '';\n      const cats = new Set();\n      (events || []).forEach(ev=>{\n        const eventCats = getEventCategories(ev);\n        eventCats.forEach(c => cats.add(c));\n      });\n      const arr = Array.from(cats).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));\n      select.innerHTML = '<option value=\"\">Todas las categorías<\/option>';\n      arr.forEach(c=>{\n        const o = document.createElement('option');\n        o.value = c;\n        o.textContent = c;\n        select.appendChild(o);\n      });\n      if (current && arr.includes(current)) select.value = current;\n    }\n\n    function safeUrl(u){\n      const s = String(u || '').trim();\n      if (!s) return '';\n      if (!/^https?:\\/\\//i.test(s)) return '';\n      return s;\n    }\n\n    function extractUrls(raw){\n      const s = String(raw || '').trim();\n      if (!s) return [];\n      return s.split(/[\\n,]+/).map(x=>x.trim()).filter(Boolean);\n    }\n\n    function driveToImgSrc(url){\n      const s = String(url || '').trim();\n      if (!s) return '';\n      let m = s.match(/\\/d\\/([a-zA-Z0-9_-]+)/);\n      if(!m) m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);\n      if(!m) m = s.match(/uc\\?export=view&id=([a-zA-Z0-9_-]+)/);\n      const fileId = m ? m[1] : '';\n      if(!fileId) return s;\n      return 'https://lh3.googleusercontent.com/d/' + fileId;\n    }\n\n    function getImageUrlsFromEventField(raw){\n      const urls = extractUrls(raw);\n      const out = [];\n      for (const u0 of urls){\n        const u = safeUrl(driveToImgSrc(u0));\n        if (u) out.push(u);\n      }\n      return out;\n    }\n\n    function normalizeInstagramUrlForEmbed(raw){\n      const u = safeUrl(raw);\n      if (!u) return '';\n      const m = u.match(/https?:\\/\\/(www\\.)?instagram\\.com\\/(p|reel|tv)\\/([A-Za-z0-9_-]+)\\/?/i);\n      if (!m) return '';\n      return `https://www.instagram.com/${m[2]}/${m[3]}/embed`;\n    }\n\n    function mountInstagramEmbedNonClickable(parentEl, instagramUrl){\n      const embedUrl = normalizeInstagramUrlForEmbed(instagramUrl);\n      if (!embedUrl) return null;\n      const box = document.createElement('div');\n      box.className = 'ig-embed-box';\n      const ifr = document.createElement('iframe');\n      ifr.className = 'embed-iframe';\n      ifr.src = embedUrl;\n      ifr.loading = 'lazy';\n      ifr.setAttribute('sandbox', 'allow-scripts allow-same-origin');\n      const overlay = document.createElement('div');\n      overlay.className = 'ig-embed-overlay';\n      box.appendChild(ifr);\n      box.appendChild(overlay);\n      parentEl.appendChild(box);\n      return box;\n    }\n\n    function mountFreeInstagramToggle(parentEl, instagramUrl){\n      const embedUrl = normalizeInstagramUrlForEmbed(instagramUrl);\n      if (!embedUrl) return null;\n\n      const btn = document.createElement('button');\n      btn.type = 'button';\n      btn.className = 'free-instagram-toggle';\n      btn.innerHTML = '<i class=\"ri-instagram-line\"><\/i><span>Ver publicación de Instagram<\/span>';\n\n      const panel = document.createElement('div');\n      panel.className = 'free-instagram-panel';\n\n      const close = document.createElement('button');\n      close.type = 'button';\n      close.className = 'free-instagram-close';\n      close.setAttribute('aria-label','Cerrar publicación de Instagram');\n      close.innerHTML = '&times;';\n\n      const ifr = document.createElement('iframe');\n      ifr.className = 'embed-iframe';\n      ifr.loading = 'lazy';\n      ifr.setAttribute('sandbox','allow-scripts allow-same-origin');\n      ifr.setAttribute('title','Publicación de Instagram');\n\n      const overlay = document.createElement('div');\n      overlay.clas et.src = v.getAttribute('data-src'); observer.observe(v); }\n          } else { if(ds) observer.observe(el); }\n        } catch(e){}\n      });\n    }\n\n    const pendingYouTubePlayers = [];\n    let youtubeApiLoading = false;\n    let youtubeApiReady = false;\n\n    function ensureYouTubeAPI(){\n      if (youtubeApiReady) { createPendingYouTubePlayers(); return; }\n      if (youtubeApiLoading) return;\n      youtubeApiLoading = true;\n      const tag = document.createElement('script');\n      tag.src = \"https://www.youtube.com/iframe_api\";\n      tag.async = true;\n      document.head.appendChild(tag);\n      window.onYouTubeIframeAPIReady = function() { youtubeApiReady = true; createPendingYouTubePlayers(); };\n    }\n\n    function createPendingYouTubePlayers(){\n      while(pendingYouTubePlayers.length){\n        const item = pendingYouTubePlayers.shift();\n        try{\n          const { iframeId, containerEl, embedUrl, poster } = item;\n          if(!window.YT || !YT.Player) { pendingYouTubePlayers.unshift(item); break; }\n          const player = new YT.Player(iframeId, {\n            events: {\n              onStateChange: function(e){\n                if(e.data === YT.PlayerState.ENDED){\n                  try{\n                    const bannerContainer = containerEl.closest('.banner-tarjeta');\n                    const replayBtn = bannerContainer ? bannerContainer.querySelector('.replay-btn') : null;\n                    containerEl.innerHTML = '';\n                    let posterUrl = poster || '';\n                    if(!posterUrl && embedUrl){\n                      try { const u = new URL(embedUrl); let vid = ''; if(u.hostname.includes('youtu.be')) vid = u.pathname.slice(1); else vid = u.searchParams.get('v') || (u.pathname.split('/').pop()); if(vid) posterUrl = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`; } catch(e){}\n                    }\n                    if(posterUrl){\n                      const img = document.createElement('img');\n frame.style.border = 'none';\n          container.innerHTML = '';\n          container.appendChild(iframe);\n          attachEventSoundButton(iframe,container);\n          pendingYouTubePlayers.push({ iframeId, containerEl: container, embedUrl, poster: (container.dataset ? container.dataset.poster : '') });\n          ensureYouTubeAPI();\n          if(replayBtn) replayBtn.style.display = 'none';\n          return;\n        }\n        if(ds && isVideoFile(ds)){\n          const video = document.createElement('video');\n          video.src = ds; video.muted = true; video.playsInline = true; video.autoplay = true; video.preload = 'metadata'; video.controls = true;\n          video.style.width = '100%'; video.style.height = '100%'; video.style.border = 'none';\n          container.innerHTML = '';\n          container.appendChild(video);\n          try{ video.play(); }catch(e){}\n          video.onended = function(){ if(replayBtn) replayBtn.style.display = 'inline-flex'; };\n          if(replayBtn) replayBtn.style.display = 'none';\n          return;\n        }\n      }catch(e){}\n    }\n\n    function attachReplayHandlers(){\n      try{\n        const buttons = document.querySelectorAll('.banner-tarjeta .replay-btn');\n        buttons.forEach(btn => {\n          if(btn._wired) return;\n          btn._wired = true;\n          const targetId = btn.getAttribute('data-target-id');\n          btn.onclick = function(e){ e.preventDefault(); replayBannerMediaById(targetId); };\n        });\n      }catch(e){}\n    }\n\n    function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }\n    function bannerKey(b) { return (b && (b.img || b.media || b.url || b.cta)) ? (b.img || b.media || b.url || b.cta) : JSON.stringify(b); }\n    function buildBannerSequence(slots) {\n      if (!banners || !banners.length || slots <= 0) return [];\n      const seq = []; let attempts = 0;\n      while (seq.length < slots && attempts < 20) {\n        const pool = banners.slice(); shuffleArray(pool);\n        for (let i = 0; i < pool.length && seq.length < slots; i++) {\n          const candidate = pool[i];\n          if (seq.length > 0 && bannerKey(seq[seq.length - 1]) === bannerKey(candidate)) {\n            const altIdx = pool.findIndex((p, idx) => idx > i && bannerKey(p) !== bannerKey(seq[seq.length - 1]));\n            if (altIdx !== -1) seq.push(pool.splice(altIdx, 1)[0]); else seq.push(candidate);\n          } else { seq.push(candidate); }\n        }\n        attempts++;\n      }\n      let i = 0;\n      while (seq.length < slots) {\n        const candidate = banners[i % banners.length];\n        if (seq.length === 0 || bannerKey(seq[seq.length - 1]) !== bannerKey(candidate)) seq.push(candidate);\n        else { i++; if (i > banners.length * 5) seq.push(candidate); }\n        i++;\n      }\n      return seq.slice(0, slots);\n    }\n\n    function cambiarPagina(dir){\n      const totalPages = Math.ceil(eventosFiltrados.length / eventsPerPage) || 1;\n      if (dir === 'prev' && currentPage > 1) {\n        renderEventos(eventosFiltrados, currentPage - 1);\n      } else if (dir === 'next' && currentPage < totalPages) {\n        renderEventos(eventosFiltrados, currentPage + 1);\n      }\n    }\n\n    function renderEventos(data, page = 1){\n      const container = document.getElementById('events');\n      container.innerHTML = '';\n\n      const mainTitle = document.getElementById('main-title');\n      if (mainTitle) {\n        mainTitle.scrollIntoView({ behavior: 'smooth' });\n      }\n\n      const totalItems = data.length;\n      const totalPages = Math.ceil(totalItems / eventsPerPage) || 1;\n      if (page > totalPages) page = totalPages;\n      if (page < 1) page = 1;\n      currentPage = page;\n\n      const start = (currentPage - 1) * eventsPerPage;\n      const end = start + eventsPerPage;\n      const pageData = data.slice(start, end);\n\n      const pagi t delta = 2;\n      const range = [];\n      const rangeWithDots = [];\n      let l;\n\n      for (let i = 1; i <= totalPages; i++) {\n        if (i === 1 || i === totalPages || (i >= page - delta && i <= page + delta)) {\n          range.push(i);\n        }\n      }\n\n      for (let i of range) {\n        if (l) {\n          if (i - l === 2) {\n            rangeWithDots.push(l + 1);\n          } else if (i - l !== 1) {\n            rangeWithDots.push('...');\n          }\n        }\n        rangeWithDots.push(i);\n        l = i;\n      }\n\n      rangeWithDots.forEach(item => {\n        if (item === '...') {\n          const span = document.createElement('span');\n          span.className = 'dots';\n          span.textContent = '...';\n          paginationBar.appendChild(span);\n        } else if (item === page) {\n          const span = document.createElement('span');\n          span.className = 'active';\n          span.textContent = item;\n          paginationBar.appendChild(span);\n        } else {\n          const btn = document.createElement('button');\n          btn.textContent = item;\n          btn.onclick = () => renderEventos(eventosFiltrados, item);\n          paginationBar.appendChild(btn);\n        }\n      });\n    }\n\n    function resolverCiudadVisible(ciudades){\n      if(ciudadContexto.ciudad) return;\n      const match = (ciudades || []).find(c=>String(c && c.ciudad_id || '').trim() === ciudadContexto.ciudad_id);\n      if(!match) return;\n      const visible = String(match.ciudad_visible || '').trim();\n      if(!visible) return;\n      ciudadContexto.ciudad = visible.replace(/\\s*\\([^)]*\\)\\s*$/, '').trim();\n      try{ localStorage.setItem(CITY_CONTEXT_KEY, JSON.stringify({...ciudadContexto, ts:Date.now()})); }catch(e){}\n      pintarContextoCiudad();\n    }\n\n    function updateCityHeading(){\n      const cityName = String(ciudadContexto.ciudad || '').trim();\n      const title = document.getElementById('main-title');\n      const dynami
