<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prueba Eventos VIP</title>
</head>
<body>
  <div style="font-family:Arial,sans-serif;padding:20px">Cargando panel de prueba...</div>
  <script>
  (async function(){
    try{
      const r=await fetch('./login.html',{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar login.html');
      let html=await r.text();
      const addon='<script src="https://cdn.jsdelivr.net/gh/liqko/guia-local-dolores@eventos-vip-programacion/plataforma/eventos-vip-programacion.js"><\/script>';
      html=html.replace('</body>',addon+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:20px;color:#c00"><b>Error:</b> '+String(e.message||e)+'</div>';
    }
  })();
  </script>
</body>
</html>
