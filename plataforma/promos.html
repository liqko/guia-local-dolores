<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Comercios y Promos</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0;
      font-family:'Segoe UI','Roboto',Arial,sans-serif;
      background: linear-gradient(135deg, #f9d423 0%, #ff4e50 100%);
      min-height: 100vh;
      color: #24324d;
      font-style: normal;
    }
    .header-flex { display:flex; justify-content:center; align-items:center; gap:18px; margin-top:45px; margin-bottom:0; flex-wrap:wrap; width:100%; }
    .main-logo { width:74px; height:74px; border-radius:15px; background:#fff; box-shadow:0 2px 14px rgba(44,60,90,0.14); object-fit:cover; display:block; }
    .header-title { font-size:2.35em; font-weight:900; letter-spacing:1.2px; text-align:center; margin:0; flex:1 1 340px; min-width:140px; max-width:500px; line-height:1.13; padding:2px 8px; color:#ff4e50;}
    .header-action { display:flex; justify-content:center; margin-top:12px; margin-bottom:8px; width:100%; }
    .join-channel {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      background: linear-gradient(90deg,#ff6a00 0%, #ff0044 100%);
      color:#fff;
      font-weight:900;
      border-radius:14px;
      text-decoration:none;
      box-shadow:0 8px 28px rgba(255,78,80,0.28);
      border: 2px solid rgba(255,255,255,0.18);
      font-size:1.05rem;
    }
    .join-channel:hover { transform:translateY(-3px); box-shadow:0 12px 34px rgba(255,78,80,0.36); transition:all .12s ease; }
    .search-container { display:flex; justify-content:center; margin-top:24px; margin-bottom:0; flex-wrap:wrap; }
    .search-box { width:340px; padding:16px 20px; font-size:1.12em; border:none; border-radius:15px; outline:none; margin-bottom:18px; background:rgba(255,255,255,0.82); box-shadow:0 4px 20px #0001; }
    .categories-bar { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:0 0 18px 0; padding:0; }
    .category-chip { background:#fff9cc; color:#ff4e50; border:2px solid #f9d423; border-radius:14px; padding:7px 18px; font-size:1em; font-weight:600; cursor:pointer; box-shadow:0 2px 6px #f9d42325; }
    .category-chip.selected, .category-chip:hover { background:#ff4e50; color:#fff; border:2px solid #ff4e50; }

    .cards-container { display:flex; flex-direction:column; gap:30px; justify-content:flex-start; align-items:center; padding:40px 10px 32px 10px; min-height:340px; }
    .card { background: rgba(255,255,255,0.92); border-radius:18px; box-shadow:0 6px 30px #0001; max-width:880px; min-width:260px; width:100%; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .card:hover { transform: translateY(-6px); box-shadow:0 12px 34px #ff4e5040, 0 2px 10px #0002; transition:transform .15s; }
    .card-logos-row { display:flex; gap:12px; align-items:center; margin-bottom:0; }
    .logo-comercio { width:64px; height:64px; border-radius:12px; object-fit:cover; background:#fff; border:2px solid #f9d42344; }
    .card-title { font-size:1.18rem; font-weight:800; color:#ff4e50; margin:0; word-break:break-word; 
      -webkit-text-stroke: 0.7px #000;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .logo-categoria { width:36px; height:36px; object-fit:cover; border-radius:8px; vertical-align:middle; margin-right:8px; }
    .cat-label { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; background:#ff4e5011; border:2px solid #111; color:#f9d423; font-weight:800; 
      -webkit-text-stroke: 0.9px #000;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .promo-row { border-left:4px solid #f9d423; padding:10px 12px; font-weight:800; color:#222; border-radius:6px; }
    .otros-row { color:#ff4e50; font-style:italic; }
    .date-label { font-size:0.75em; font-weight:800; text-transform:uppercase; margin-bottom:4px; }
    .date-desde { color:#1a8a3a; font-weight:700; }
    .date-hasta { color:#c83232; font-weight:700; }
    .fecha-row { display:flex; align-items:center; gap:8px; }
    .info-row { display:flex; align-items:center; gap:8px; color:#24324d; }
    .info-row .icon { color:#ff4e50; font-size:1.1rem; min-width:26px; text-align:center; }
    .btn-maps { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; background:linear-gradient(90deg,#0e76a8 0%, #0e5076 100%); color:#fff; font-weight:800; border-radius:12px; text-decoration:none; box-shadow:0 6px 26px rgba(14,80,118,0.18); border:none; font-size:1em; transition:.12s; }
    .btn-maps:hover { background:linear-gradient(90deg,#0e5076 0%, #0e76a8 100%); }
    .socials { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .socials a { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:rgba(0,0,0,0.03); color:#ff4e50; text-decoration:none; font-size:1.5em; }
    .extras-container { margin-top:6px; background:rgba(0,0,0,0.02); padding:12px; border-radius:10px; }
    .extras-table { width:100%; border-collapse:collapse; font-size:0.95rem; }
    .extras-table td { padding:6px 8px; vertical-align:top; border-bottom:1px dashed rgba(0,0,0,0.04); }
    .vermas { display:inline-flex; gap:8px; align-items:center; cursor:pointer; color:#0e5076; font-weight:700; border:none; background:none; padding:0; }

    .badge { background:#fff; padding:6px 10px; border-radius:10px; border:1px solid rgba(0,0,0,0.04); font-weight:700; display:inline-block; margin-right:8px; }

    .paginator { display:flex; justify-content:center; gap:16px; margin:18px 0 40px; align-items:center; }
    .paginator button { padding:8px 14px; background:linear-gradient(90deg,#ff4e50,#f9d423); color:#fff; border:none; border-radius:8px; font-weight:800; cursor:pointer; }
    .promos-loading{
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:min(94vw,760px);min-height:140px;margin:18px auto;padding:20px;
      box-sizing:border-box;background:rgba(255,255,255,.92);border-radius:14px;
      font-weight:900;color:#ff4e50;box-shadow:0 4px 20px rgba(0,0,0,.10);
    }
    .promos-loading-spinner{
      width:30px;height:30px;border:4px solid #ffe5c7;border-top-color:#ff4e50;
      border-radius:50%;animation:promosSpin .8s linear infinite;flex:0 0 auto;
    }
    @keyframes promosSpin{to{transform:rotate(360deg)}}

    .promo-img-wrap{width:100%;margin:12px 0 4px;display:flex;justify-content:center;}
    .promo-img{
      display:block;width:min(100%,520px);max-height:520px;object-fit:contain;
      border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);
    }

    .promo-filter-notice{
      display:none;max-width:880px;margin:10px auto 0;padding:10px 14px;
      background:rgba(255,255,255,.9);border:1px solid rgba(255,78,80,.25);
      border-radius:12px;text-align:center;font-weight:800;color:#24324d;
      box-sizing:border-box;width:calc(100% - 20px);
    }

    @media (max-width:900px) {
      .search-box { width:92%; max-width:680px; }
      .logo-comercio { width:64px; height:64px; }
      .socials a { width:34px; height:34px; }
      .join-channel { width:92%; justify-content:center; }
    }
    @media (max-width:600px) {
      .card-logos-row { flex-direction:column; align-items:flex-start; gap:8px; }
      .btn-maps { width:100%; justify-content:center; }

    /* ===== IDENTIDAD / NAVEGACION DE CIUDAD ===== */
    .city-shell{
      max-width:960px;margin:18px auto 10px;padding:14px 18px;
      background:#f5e1d4;border-radius:14px;box-sizing:border-box;
    }
    .city-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .city-title img{width:48px;height:48px;object-fit:contain}

    .city-sub{font-size:.9rem;color:#2f6f8d;margin-top:2px}
    .city-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .city-nav button,.city-nav a{
      border:1px solid #006699;background:#fff;color:#006699;border-radius:10px;
      padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer
    }

    @media (max-width:600px){
      .city-shell{margin:8px 8px 10px;padding:12px}

      .city-name{font-size:1.25rem}

      .city-nav button,.city-nav a{width:100%;box-sizing:border-box;text-align:center;min-height:44px}
      .header-flex{margin-top:18px;padding:0 10px;box-sizing:border-box}
      .header-title{font-size:1.7rem;flex-basis:100%}
      .main-logo{width:58px;height:58px}
      .cards-container{padding:18px 8px 24px;gap:16px}

      .categories-bar{padding:0 8px;box-sizing:border-box}
      .category-chip{flex:1 1 145px;text-align:center}
      .search-container{padding:0 8px;box-sizing:border-box}

    /* ===== BANNERS PUBLICITARIOS ===== */
    .banner-tarjeta{
      width:100%;text-align:center;margin:1em 0;
      display:flex;justify-content:center;position:relative;flex-direction:column;align-items:center;gap:.6rem;
    }
    .banner-tarjeta .banner-media{
      width:min(90vw,360px);max-width:360px;aspect-ratio:9/16;
      display:flex;align-items:center;justify-content:center;background:#000;
      border-radius:1em;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;
    }
    .banner-tarjeta .banner-media iframe,
    .banner-tarjeta .banner-media video,
    .banner-tarjeta .banner-media img{
      width:100%;height:100%;object-fit:contain;display:block;border:none;

    .banner-tarjeta .cta-btn,.replay-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
      min-height:42px;padding:.55em .9em;background:#ff7f50;color:#fff;border-radius:.6em;
      text-decoration:none;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.18);
      border:none;cursor:pointer;font-size:.95rem;

    .promo-video-sound-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      min-height:42px;margin:0 auto;padding:9px 14px;border:0;border-radius:10px;
      background:#006699;color:#fff;font-weight:900;font-size:.9rem;cursor:pointer;
      box-shadow:0 3px 10px rgba(0,102,153,.22);
    }
    .promo-video-sound-btn:hover,.promo-video-sound-btn:focus{
      background:#00547d;outline:2px solid #fff;outline-offset:2px;
    }
    @media(max-width:600px){
      .banner-tarjeta .banner-media{width:min(92vw,320px);max-width:100%;}
    }

  
    /* ===== ACCESO FIJO A FARMACIA DE TURNO ===== */
    .farma-turno-global{
      position:sticky;top:0;z-index:2200;
      width:100%;box-sizing:border-box;
      display:flex;justify-content:center;
      padding:.42rem .65rem;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(0,0,0,.08);
    }
    .farma-turno-global button{
      width:min(100%,980px);min-height:48px;
      border:0;border-radius:.75rem;
      background:#1f8f4e;color:#fff;
      font-weight:900;font-size:1rem;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(31,143,78,.24);
    }
    .farma-turno-global button:hover,.farma-turno-global button:focus{
      background:#18743f;outline:2px solid #fff;outline-offset:2px;
    }


    /* ===== FARMACIAS DE TURNO - BLOQUE DE CIUDAD ===== */
    .farma-turno-global{
      position:sticky;top:0;z-index:2200;width:100%;box-sizing:border-box;
      display:flex;justify-content:center;padding:.42rem .65rem;
      background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(0,0,0,.08);
    }
    .farma-turno-global button{
      width:min(100%,980px);min-height:48px;border:0;border-radius:.75rem;
      background:#1f8f4e;color:#fff;font-weight:900;font-size:1rem;
      cursor:pointer;box-shadow:0 3px 10px rgba(31,143,78,.24);
    }
    .farma-turno-section{
      width:calc(100% - 1.3rem);max-width:980px;margin:1rem auto 1.4rem;
      padding:1rem;box-sizing:border-box;border-radius:1rem;
      background:#f8fff9;border:2px solid #bfe5c9;font-style:normal;
    }
    .farma-turno-section h2{margin:.1rem 0 .25rem;color:#1f8f4e;font-size:1.45rem}
    .farma-turno-list{display:flex;flex-direction:column;gap:.75rem}
    .farma-turno-card{background:#fff;border:1px solid #dfe9e2;border-radius:.85rem;padding:.9rem;box-shadow:0 2px 8px #0001}
    .farma-turno-name{font-weight:900;font-size:1.08rem;color:#222}
    .farma-turno-time{font-weight:800;color:#1f8f4e;margin:.25rem 0}
    .farma-turno-dir{color:#444;margin:.25rem 0}
    .farma-turno-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.65rem}
    .farma-turno-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:.45rem .7rem;border-radius:.6rem;text-decoration:none;font-weight:800;border:1px solid #1f8f4e;color:#1f8f4e;background:#fff}
    .farma-week{margin-top:1rem;border-top:1px solid #dfe9e2;padding-top:.8rem}
    .farma-week summary{cursor:pointer;font-weight:900;color:#006699;padding:.55rem 0}
    .farma-week-day{padding:.7rem 0;border-bottom:1px solid #e8eee9}
    .farma-week-date{font-weight:900;margin-bottom:.35rem}
    .farma-state{padding:.8rem;border-radius:.65rem;background:#fff;color:#555}
    .farma-state.error{color:#a00;background:#fff0f0;border:1px solid #f0caca}
    @media(max-width:700px){.farma-turno-section{width:calc(100% - 1rem);margin:.8rem .5rem 1.2rem;padding:.8rem}.farma-turno-actions{display:grid;grid-template-columns:1fr}.farma-turno-actions a{width:100%;box-sizing:border-box}}

</style>

<body>
  <div class="farma-turno-global">
    <button id="irFarmaciaTurno" type="button">💊 FARMACIA DE TURNO</button>
  </div>
  <section class="city-shell">
    <div class="city-title">
      <img src="https://res.cloudinary.com/dw3oovvb1/image/upload/v1761345482/mpeum21vwegc0acgvrfw.png" alt="Guía Local">
      <div>
        <div id="ciudadContexto" class="city-name">CIUDAD</div>

      </div>
    </div>
    <div class="city-nav">
      <button id="volverGuia" class="primary" type="button">Guía</button>
      <a id="irEventos" href="#">Eventos</a>
      <button id="cambiarCiudad" type="button">Cambiar ciudad</button>
    </div>
  </section>

  <div class="header-flex">
    <img class="main-logo" src="https://res.cloudinary.com/dw3oovvb1/image/upload/v1761321330/jodjkgolixgk4rlisrur.png" alt="Logo">
    <h1 class="header-title">PROMOS & DESCUENTOS</h1>
  </div>

  <div class="header-action">
    <a class="join-channel" href="https://whatsapp.com/channel/0029VbAob364yltKWaN4QZ3C" target="_blank" rel="noopener noreferrer" title="Unite al canal de WhatsApp">
      🔥📣 ¡Unite al canal y no te pierdas una! 🚀💬
    </a>
  </div>

  <div class="search-container">
    <input id="search" class="search-box" placeholder="Buscar por nombre, categoría o promo...">
  </div>

  <div id="promoFilterNotice" class="promo-filter-notice"></div>
  <div id="categoriesBar" class="categories-bar"></div>
  <div id="cards" class="cards-container">
    <div class="promos-loading" role="status" aria-live="polite">
      <span class="promos-loading-spinner" aria-hidden="true"></span>
      <span>Cargando promociones de la ciudad...</span>
    </div>
  </div>
  <div id="paginator" class="paginator"></div>

  <section id="farmaciaTurnoSection" class="farma-turno-section">
    <h2>💊 Farmacias de turno</h2>
    <div id="farmaTurnoCiudad"></div>
    <div id="farmaTurnoHoy" class="farma-turno-list"><div class="farma-state">Cargando farmacia de turno...</div></div>
    <details class="farma-week">
      <summary>Ver próximos 7 días</summary>
      <div id="farmaTurnoSemanaContenido"></div>
    </details>
  </section>


  <script>
    const DATA_URL = "https://script.google.com/macros/s/AKfycbwZ4UR8pKD5Y0tLsD2VVa82tvRJ8LxZw8jqbz3mhg4RCZc2Tu9lDVjL3gohIsokRWo0/exec";
    const BANNERS_URL = "https://opensheet.elk.sh/170kTZ-ViCPxPli86g-n_XMuMv1S3O0-DbGwNFGYVnjY/banners";
    let banners = [];
    const bannersPromise = fetch(BANNERS_URL).then(r=>r.json()).catch(()=>[]);
    const CITY_CONTEXT_KEY = 'gld_ciudad_contexto';
    let pageParams = new URLSearchParams(window.location.search || '');
    try{
      const ref = new URL(document.referrer || '');
      const refParams = new URLSearchParams(ref.search || '');
      if(!pageParams.get('ciudad_id') && refParams.get('ciudad_id')) pageParams = refParams;
    }catch(e){}
    let ciudadContexto = {
      pais_id:String(pageParams.get('pais_id') || '').trim(),
      provincia_id:String(pageParams.get('provincia_id') || '').trim(),
      ciudad_id:String(pageParams.get('ciudad_id') || '').trim(),
      pais:String(pageParams.get('pais') || '').trim(),
      provincia:String(pageParams.get('provincia') || '').trim(),
      ciudad:String(pageParams.get('ciudad') || '').trim()
    };
    try{
      const saved=JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY)||'null');
      if(saved){
        ['pais_id','provincia_id','ciudad_id','pais','provincia','ciudad'].forEach(k=>{
          if(!ciudadContexto[k] && saved[k]) ciudadContexto[k]=String(saved[k]).trim();
        });
      }
      if(ciudadContexto.ciudad_id) localStorage.setItem(CITY_CONTEXT_KEY,JSON.stringify(ciudadContexto));
    }catch(e){}


    let comerciosData = [];
    let filtrados = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let categoriasSet = new Set();
    let categoriaFiltro = "";

    const PROMOS_FILTER_STORAGE_KEY = 'gld_promos_filter';
    let incomingPromoFilter = null;

    function normalizeFilterText(v){
      return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    }
    function promoFilterKey(p){
      const pid = String(p && p.promo_id || '').trim();
      if(pid) return 'id:' + pid;
      const nombre = normalizeFilterText(p && (p.anunciante || p.nombre));
      const promo = normalizeFilterText(p && p.promo);
      const desde = String(p && p.desde || '').trim();
      const hasta = String(p && p.hasta || '').trim();
      return ['fallback', nombre, promo, desde, hasta].join('|');
    }
    function readIncomingPromoFilter(){
      const id = String(pageParams.get('id_comercio') || '').trim();
      const anunciante = String(pageParams.get('anunciante') || '').trim();
      const sede_id = String(pageParams.get('sede_id') || '').trim();

      // Solo filtramos por anunciante cuando realmente llegamos desde una tarjeta.
      if(!(id || anunciante || sede_id)){
        try{ localStorage.removeItem(PROMOS_FILTER_STORAGE_KEY); }catch(e){}
        return null;
      }

      let stored = null;
      try{
        const raw = localStorage.getItem(PROMOS_FILTER_STORAGE_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          const age = Date.now() - Number(parsed.ts || 0);
          if(age >= 0 && age <= 10 * 60 * 1000) stored = parsed;
        }
        localStorage.removeItem(PROMOS_FILTER_STORAGE_KEY);
      }catch(e){}

      return Object.assign({}, stored || {}, {
        id_comercio:id || (stored && stored.id_comercio) || '',
        anunciante:anunciante || (stored && stored.anunciante) || '',
        sede_id:sede_id || (stored && stored.sede_id) || ''
      });
    }

    function promoMatchesIncomingFilter(p, filter){
      if(!filter) return true;

      const keys = Array.isArray(filter.promo_keys) ? filter.promo_keys.filter(Boolean) : [];
      if(keys.length && keys.includes(promoFilterKey(p))) return true;

      const wantedSede = String(filter.sede_id || '').trim();
      const promoSede = String(p && p.sede_id || '').trim();
      if(wantedSede && promoSede && wantedSede === promoSede) return true;

      const wantedId = String(filter.id_comercio || '').trim();
      const promoId = String(p && (p.id_comercio || p.comercio_id || p.id_anunciante || '') || '').trim();
      if(wantedId && promoId && wantedId === promoId) return true;

      const wantedName = normalizeFilterText(filter.anunciante);
      const promoName = normalizeFilterText(p && (p.anunciante || p.nombre || p.comercio));
      return !!wantedName && promoName === wantedName;
    }
    function showPromoFilterNotice(filter, count){
      const el = document.getElementById('promoFilterNotice');
      if(!el || !filter) return;

    function fechaHumana(fecha) {
      if (!fecha) return "";
      if (!isNaN(fecha) && typeof fecha !== "string") {
        const base = Date.UTC(1899,11,30);
        fecha = new Date(base + Number(fecha) * 86400000);
      }
      const d = new Date(fecha);
      if (isNaN(d.getTime())) return String(fecha);
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      return `${d.getUTCDate()} de ${meses[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function encodeUrl(u) {
      if (!u) return '';
      u = String(u).trim();
      if (/^https?:\/\//i.test(u)) return u;
      if (/^mailto:/i.test(u) || /^tel:/i.test(u)) return u;
      if (/^www\./i.test(u)) return 'https://' + u;
      return 'https://' + u;
    }

    function normalizeDigits(s) {
      if (!s) return '';
      return String(s).replace(/[^\d]/g, '');
    }

    function makeWhatsAppLink(wh) {
      if (!wh) return "";
      const s = String(wh).trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) return s;
      if (/^(?:https?:\/\/)?(?:wa\.me|api\.whatsapp\.com)/i.test(s)) {
        return (/^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, ''));
      }
      const digits = s.replace(/[^0-9]/g, '');
      if (digits.length >= 6) return 'https://wa.me/' + digits;
      return encodeUrl(s);
    }

    function getWhatsAppForCom(com, phoneComparison) {
      if (!com) return "";
      const candidates = [];
      if (com.whatsapp) candidates.push(com.whatsapp);
      const extras = com.extras || {};
      const keys = ['whatsapp','whatsapp_url','whatsapp_link','wa','wpp','wsp','whats','whats_app','whatsappnumber','whatsapp_num'];
      keys.forEach(k => { if (k in extras && extras[k]) candidates.push(extras[k]); });
      Object.keys(extras).forEach(k => {
        if (/^(?:wa|wpp|whats|whatsapp)/i.test(k) && extras[k]) candidates.push(extras[k]);
      });

      for (let i = 0; i < candidates.length; i++) {
        const v = candidates[i];
        if (!v) continue;
        const str = String(v).trim();
        if (!str) continue;
        const link = makeWhatsAppLink(str);
        if (!link) continue;
        return link;
      }
      return "";
    }

    function makeMapLink(llegarVal, domicilioVal) {
      if (llegarVal && String(llegarVal).trim()) {
        const v = String(llegarVal).trim();
        if (/^https?:\/\//i.test(v)) return v;
        if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(v)) {
          const coords = v.replace(/\s+/g,'');
          return `https://www.google.com/maps?q=${coords}`;
        }
        return encodeUrl(v);
      }
      if (domicilioVal && String(domicilioVal).trim()) {
        const q = encodeURIComponent(String(domicilioVal).trim());
        return `https://www.google.com/maps/search/?api=1&query=${q}`;
      }
      return "";
    }

    function encodeTel(t) {
      if (!t) return '';
      return String(t).replace(/[^\d+]/g, '');
    }

    function safeUrl(u) {
      try {
        const v = encodeUrl(u);
        if (!v) return '';
        if (/^https?:\/\/\s*$/i.test(v)) return '';
        return v;
      } catch (e) { return ''; }
    }

    function isVideoFile(url){
      return typeof url==='string' && /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
    }
    function isYouTube(url){
      return typeof url==='string' && /youtu(be\.com|\.be)/i.test(url);
    }
    function getYouTubeEmbedUrl(url){
      try{
        let id='';
        const u=new URL(url);
        if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1);
        else{
          id=u.searchParams.get('v')||'';
          if(!id){ const parts=u.pathname.split('/').filter(Boolean); id=parts.pop()||''; }
        }
        if(!id) return '';
        const p=new URLSearchParams({
          rel:0,playsinline:1,enablejsapi:1,modestbranding:1,
          autoplay:1,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3
        });
        return `https://www.youtube.com/embed/${id}?${p.toString()}`;
      }catch(e){ return ''; }
    }

    function promoYtCommand(frame,func,args){
      try{
        if(frame && frame.contentWindow){
          frame.contentWindow.postMessage(JSON.stringify({
            event:'command',func:func,args:Array.isArray(args)?args:[]
          }),'*');
        }
      }catch(e){}
    }

    function attachPromoSoundButton(media,banner){
      if(!media || !banner) return;
      const old=banner.querySelector('.promo-video-sound-btn');
      if(old) old.remove();

      let muted=true;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='promo-video-sound-btn';

      function paint(){
        btn.textContent=muted ? '🔊 Activar sonido' : '🔇 Silenciar';
        btn.setAttribute('aria-label',muted ? 'Activar sonido' : 'Silenciar');
      }

      btn.onclick=function(e){
        e.preventDefault();
        e.stopPropagation();
        muted=!muted;
        if(String(media.tagName||'').toLowerCase()==='video'){
          media.muted=muted;
          if(!muted) media.volume=1;
          try{
            const p=media.play();
            if(p&&p.catch) p.catch(()=>{});
          }catch(err){}
        }else{
          if(muted){
            promoYtCommand(media,'mute');
          }else{
            promoYtCommand(media,'unMute');
            promoYtCommand(media,'setVolume',[100]);
            promoYtCommand(media,'playVideo');
            setTimeout(()=>promoYtCommand(media,'playVideo'),80);
          }
        }
        paint();
      };

      const cta=banner.querySelector('.cta-btn');
      if(cta) banner.insertBefore(btn,cta);
      else banner.appendChild(btn);
      paint();

      document.querySelectorAll('.banner-tarjeta').forEach(banner=>{
        const host=banner.querySelector('.banner-media');
        if(!host) return;

        const native=host.querySelector('video');
        if(native){

            native.playsInline=true;
            native.autoplay=true;

    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
    }
    function buildBannerSequence(slots){
      if(!banners.length || slots<=0) return [];
      const out=[];
      while(out.length<slots){
        const pool=banners.slice();
        shuffleArray(pool);
        for(const b of pool){
          if(out.length>=slots) break;
          out.push(b);
        }
        if(!pool.length) break;
      }
      return out.slice(0,slots);
    }

    function renderPaginator(total, page) {

      paginatorDiv.innerHTML = `<button id="prevPage" ${page<=1?'disabled':''}>Anterior</button><span style="font-weight:800">Página ${page} / ${totalPages}</span><button id="nextPage" ${page>=totalPages?'disabled':''}>Siguiente</button>`;
      document.getElementById('prevPage').onclick = () => { if (currentPage>1) { currentPage--; renderCards(filtrados,currentPage); window.scrollTo({top:0,behavior:'smooth'}); } };
      document.getElementById('nextPage').onclick = () => { if (currentPage<totalPages) { currentPage++; renderCards(filtrados,currentPage); window.scrollTo({top:0,behavior:'smooth'}); } };

    function aplicarFiltro(search) {
      const q = (search||'').trim().toLowerCase();
      if (categoriaFiltro) {
        filtrados = comerciosData.filter(c => c.categoria && c.categoria.toLowerCase() === categoriaFiltro.toLowerCase());
      } else if (q) {
        let matchCat = Array.from(categoriasSet).find(cat => cat.toLowerCase() === q);
        if (matchCat) { categoriaFiltro = matchCat; filtrados = comerciosData.filter(c => c.categoria && c.categoria.toLowerCase() === matchCat.toLowerCase()); }
        else {
          filtrados = comerciosData.filter(c => {
            const main = (c.anunciante && c.anunciante.toLowerCase().includes(q)) || (c.categoria && c.categoria.toLowerCase().includes(q)) || (c.promo && c.promo.toLowerCase().includes(q));
            if (main) return true;
            if (c.extras) return Object.values(c.extras).some(v => String(v||'').toLowerCase().includes(q));
            return false;
          });
        }
      } else {
        filtrados = comerciosData;
      }
      currentPage = 1;
      renderCards(filtrados,currentPage);
      renderCategoriesBar();
    }

    function hasMeaningfulData(c) {
      if (!c) return false;
      const props = ['anunciante','nombre','promo','categoria','direccion','telefono','instagram','facebook','youtube','tiktok','linkedin','x','logo','img','llegar','maps','otros'];
      for (let i=0;i<props.length;i++){
        const k = props[i];
        if (k in c && c[k] !== null && c[k] !== undefined && String(c[k]).trim() !== '') return true;
      }
      if (c.extras) {
        const vals = Object.values(c.extras);
        if (vals.some(v => v !== null && v !== undefined && String(v).trim() !== '')) return true;
      }
      return false;
    }

    function toBoolAprobado(v) {
      if (v === true) return true;
      if (typeof v === 'string') {
        const t = v.trim().toLowerCase();
        return t === 'true' || t === '1' || t === 'sí' || t === 'si' || t === 'x';
      }
      if (typeof v === 'number') return v === 1;
      return false;
    }
    function toBoolPausado(v){
      if (v === true || v === 1) return true;
      const t = String(v || '').trim().toLowerCase();
      return t === 'true' || t === '1' || t === 'sí' || t === 'si' || t === 'x';
    }

    function isPromoVigenteHasta(hastaValue) {
      if (!hastaValue) return false; // Si no hay fecha hasta, descartar
      let fecha;
      if (!isNaN(hastaValue) && typeof hastaValue !== "string") {
        // formato excel numérico
        const base = Date.UTC(1899,11,30);
        fecha = new Date(base + Number(hastaValue) * 86400000);
      } else {
        fecha = new Date(hastaValue);
      }
      if (isNaN(fecha.getTime())) return false; // fecha inválida
      // comparar solo fecha, no hora
      const hoy = new Date();
      hoy.setHours(0,0,0,0);
      fecha.setHours(0,0,0,0);
      return fecha >= hoy;
    }

    function loadData() {
      if (!DATA_URL) { document.getElementById('cards').innerHTML = '<p style="color:#b02a2a">Falta DATA_URL</p>'; return; }

      const cardsLoading = document.getElementById('cards');
      const paginatorLoading = document.getElementById('paginator');
      if(cardsLoading){
        cardsLoading.innerHTML = `<div class="promos-loading" role="status" aria-live="polite">
          <span class="promos-loading-spinner" aria-hidden="true"></span>
          <span>Cargando promociones de la ciudad...</span>
        </div>`;
      }
      if(paginatorLoading) paginatorLoading.innerHTML = '';

      const dataUrl = new URL(DATA_URL);
      if(ciudadContexto.ciudad_id) dataUrl.searchParams.set('ciudad_id', ciudadContexto.ciudad_id);
      fetch(dataUrl.toString()).then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(raw => {
        let data = [];
        if (Array.isArray(raw)) {
          data = raw;
        } else if (raw && Array.isArray(raw.promos)) {
          data = raw.promos;
        } else if (raw && Array.isArray(raw.rows)) {
          data = raw.rows;
        } else if (raw && Array.isArray(raw.data)) {
          data = raw.data;
        } else if (raw && raw.error) {
          throw new Error(String(raw.error));
        } else if (raw && typeof raw === 'object' && Object.keys(raw).length === 0) {
          data = [];
        } else {
          try {
            const maybeArray = Object.values(raw).filter(v => v && typeof v === 'object' && ('promo' in v || 'anunciante' in v));
            if (maybeArray.length) data = maybeArray;
            else data = Array.isArray(raw) ? raw : [];
          } catch(e){ data = []; }
        }

        comerciosData = (Array.isArray(data) ? data : []).map(row => {
          const obj = Object.assign({}, row);
          if (!obj.anunciante && obj.anunciante !== '' && (obj.nombre)) obj.anunciante = obj.nombre;
          if (!obj.direccion && obj.domicilio) obj.direccion = obj.domicilio;
          if (!obj.whatsapp && obj.whats) obj.whatsapp = obj.whats;
          if (!obj.extras) obj.extras = obj.extras || {};
          return obj;
        });

        // SOLO aprobados, no pausados y con fecha HASTA válida (vigente)
        comerciosData = comerciosData.filter(c => 
          toBoolAprobado(c.aprobado) &&
          !toBoolPausado(c.pausado) &&
          c.hasta && 
          isPromoVigenteHasta(c.hasta)
        );
        comerciosData = comerciosData.filter(hasMeaningfulData);

        incomingPromoFilter = readIncomingPromoFilter();
        if(incomingPromoFilter){
          comerciosData = comerciosData.filter(c => promoMatchesIncomingFilter(c, incomingPromoFilter));
          showPromoFilterNotice(incomingPromoFilter, comerciosData.length);
        }

        filtrados = comerciosData;
        categoriasSet = new Set(comerciosData.map(c => c.categoria).filter(Boolean));
        renderCards(filtrados,currentPage);
        renderCategoriesBar();

        bannersPromise.then(raw=>{
          banners=(Array.isArray(raw)?raw:[])
            .filter(b=>{
              const a=String(b.aprobado??'').trim().toLowerCase();
              return a==='true' || a==='1' || a==='x';
            })
            .map(b=>({
              img:String(b.img||b.url||'').trim(),
              media:String(b.media||'').trim(),
              cta:String(b.cta||'').trim(),
              poster:String(b.poster||'').trim()
            }))
            .filter(b=>b.img || b.media);
          if(banners.length) renderCards(filtrados,currentPage);
        }).catch(()=>{});
      }).catch(err => {
        document.getElementById('cards').innerHTML = `<p style="color:#b02a2a">No se pudieron cargar las promos o descuentos.<br>${escapeHtml(String(err))}</p>`;
        console.error('loadData error:', err);
      });
    }

    document.getElementById('search').addEventListener('input', function(){ categoriaFiltro=''; aplicarFiltro(this.value); });

    const ciudadEl=document.getElementById('ciudadContexto');
    const ciudadSub=document.getElementById('ciudadSubtitulo');
    if(ciudadEl){
      ciudadEl.textContent = (ciudadContexto.ciudad || ciudadContexto.ciudad_id || 'CIUDAD').toUpperCase();
    }
    if(ciudadSub){
      const provincia = ciudadContexto.provincia || ciudadContexto.provincia_id || '';
      const pais = ciudadContexto.pais || ciudadContexto.pais_id || '';
      ciudadSub.textContent = [provincia, pais].filter(Boolean).join(' - ');
    }

    function contextoUrl(baseUrl, conCiudad=true){
      const u=new URL(baseUrl);
      if(conCiudad){
        Object.entries(ciudadContexto).forEach(([k,v])=>{ if(k!=='ts' && v) u.searchParams.set(k,v); });
      }
      return u.toString();
    }

    function guiaUrl(conCiudad=true){
      return contextoUrl(conCiudad ? 'https://guialocal.ar/guia/' : 'https://guialocal.ar/', conCiudad);
    }

    function eventosUrl(){
      return contextoUrl('https://guialocal.ar/eventos/', true);
    }

    function navegarArriba(url){
      try{ window.top.location.href = url; }
      catch(e){ window.location.href = url; }
    }

    document.getElementById('volverGuia')?.addEventListener('click', ()=>{
      navegarArriba(guiaUrl(true));
    });

    document.getElementById('irEventos')?.addEventListener('click', (e)=>{
      e.preventDefault();
      navegarArriba(eventosUrl());
    });

    document.getElementById('cambiarCiudad')?.addEventListener('click', ()=>{
      try{ localStorage.removeItem(CITY_CONTEXT_KEY); }catch(e){}
      navegarArriba(guiaUrl(false));
    });

    if(!ciudadContexto.ciudad_id){
      navegarArriba(guiaUrl(false));
    }else{
      loadData();
    }
  

    /* ALTURA AUTOMÁTICA PARA EL IFRAME DE JIMDO */
    (() => {
      let ultimoAlto = 0;
      let rafAltura = 0;

      const MIN_ALTURA_IFRAME_GLD = 700;

      function medirYEnviarAltura(){
        cancelAnimationFrame(rafAltura);
        rafAltura = requestAnimationFrame(() => {
          const altoReal = Math.max(
            document.body ? document.body.scrollHeight : 0,
            document.documentElement ? document.documentElement.scrollHeight : 0
          );
          const alto = Math.max(MIN_ALTURA_IFRAME_GLD, altoReal);

          if(!alto || Math.abs(alto - ultimoAlto) < 2) return;
          ultimoAlto = alto;

          window.parent.postMessage({
            tipo:'alturaIframeGLD',
            altura:alto,
            ruta:window.location.pathname
          }, '*');
        });
      }

      window.addEventListener('load', medirYEnviarAltura);
      window.addEventListener('resize', medirYEnviarAltura);

      if('ResizeObserver' in window){
        const ro = new ResizeObserver(medirYEnviarAltura);
        if(document.body) ro.observe(document.body);
        if(document.documentElement) ro.observe(document.documentElement);
      }

      if('MutationObserver' in window && document.body){
        const mo = new MutationObserver(medirYEnviarAltura);
        mo.observe(document.body, {
          childList:true,
          subtree:true,
          attributes:true,
          characterData:false
        });
      }

      document.addEventListener('click', () => {
        setTimeout(medirYEnviarAltura, 60);
        setTimeout(medirYEnviarAltura, 350);
      });

      document.addEventListener('input', () => setTimeout(medirYEnviarAltura, 80));
      document.addEventListener('change', () => setTimeout(medirYEnviarAltura, 80));

      setTimeout(medirYEnviarAltura, 100);
      setTimeout(medirYEnviarAltura, 600);
      setTimeout(medirYEnviarAltura, 1500);
    })();


    const FARMACIAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzXJ5wk0EYGQOQzQ5-kik0lOcuVp78zAacJgs5x4I3TrgTpySaqW4qVjzyqQUXSO4ARfA/exec";

    function farmaIsoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function farmaShiftDate(iso,days){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);const d=m?new Date(+m[1],+m[2]-1,+m[3],12):new Date();d.setDate(d.getDate()+days);return farmaIsoDate(d)}
    function farmaHumanDate(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return iso;const d=new Date(+m[1],+m[2]-1,+m[3],12);return new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(d)}
    function farmaEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
    async function farmaFetchTurnos(fecha){
      const ciudadId = typeof ciudadContexto !== 'undefined'
        ? String(ciudadContexto.ciudad_id||'').trim()
        : (typeof ciudadSeleccionada !== 'undefined' ? String(ciudadSeleccionada||'').trim() : '');
      if(!ciudadId) throw new Error('No hay ciudad seleccionada');
      const u=new URL(FARMACIAS_ENDPOINT);
      u.searchParams.set('action','turnos');
      u.searchParams.set('ciudad_id',ciudadId);
      u.searchParams.set('fecha',fecha);
      u.searchParams.set('_ts',Date.now());
      const r=await fetch(u.toString(),{cache:'no-store'});
      const data=await r.json();
      if(!r.ok || !data || data.success!==true) throw new Error((data&&data.error)||'No se pudieron cargar los turnos');
      return data;
    }
    function farmaContactLinks(t){
      const links=[],tel=String(t.telefono||'').trim(),wa=String(t.whatsapp||'').replace(/\D/g,''),maps=String(t.maps||'').trim(),mail=String(t.mail||'').trim();
      if(tel)links.push(`<a href="tel:${farmaEsc(tel.replace(/\s+/g,''))}">📞 Llamar</a>`);
      if(wa)links.push(`<a href="https://wa.me/${farmaEsc(wa)}" target="_blank" rel="noopener">💬 WhatsApp</a>`);
      if(maps)links.push(`<a href="${farmaEsc(maps)}" target="_blank" rel="noopener">📍 Cómo llegar</a>`);
      if(mail)links.push(`<a href="mailto:${farmaEsc(mail)}">✉️ Mail</a>`);
      return links.join('');
    }
    function farmaCardHtml(t){
      const nombre=String(t.nombre_sede||t.nombre_ref||'Farmacia').trim();
      const horario=(t.hora_desde||t.hora_hasta)?`De ${farmaEsc(t.hora_desde||'')} a ${farmaEsc(t.hora_hasta||'')}`:'';
      return `<article class="farma-turno-card"><div class="farma-turno-name">${farmaEsc(nombre)}</div>${horario?`<div class="farma-turno-time">${horario}</div>`:''}${t.direccion?`<div class="farma-turno-dir">${farmaEsc(t.direccion)}</div>`:''}${t.observaciones?`<div class="farma-turno-dir">${farmaEsc(t.observaciones)}</div>`:''}<div class="farma-turno-actions">${farmaContactLinks(t)}</div></article>`;
    }
    async function cargarFarmaciasTurnoCiudad(){
      const hoyBox=document.getElementById('farmaTurnoHoy'),semanaBox=document.getElementById('farmaTurnoSemanaContenido'),ciudadBox=document.getElementById('farmaTurnoCiudad');
      if(!hoyBox||!semanaBox)return;
      let ciudadNombre='';
      try{
        if(typeof ciudadContexto!=='undefined') ciudadNombre=String(ciudadContexto.ciudad||'').trim();
        else {
          const saved=JSON.parse(localStorage.getItem('gld_ciudad_contexto')||'null');
          ciudadNombre=String(saved&&saved.ciudad||'').trim();
        }
      }catch(e){}
      if(ciudadBox)ciudadBox.textContent=ciudadNombre?`Turnos para ${ciudadNombre}`:'';
      const hoy=farmaIsoDate(new Date());
      try{
        const data=await farmaFetchTurnos(hoy),turnos=Array.isArray(data.turnos)?data.turnos:[];
        hoyBox.innerHTML=turnos.length?turnos.map(farmaCardHtml).join(''):'<div class="farma-state">No hay farmacia de turno informada para hoy.</div>';
      }catch(e){hoyBox.innerHTML=`<div class="farma-state error">${farmaEsc(e.message||String(e))}</div>`}
      const fechas=Array.from({length:7},(_,i)=>farmaShiftDate(hoy,i+1));
      semanaBox.innerHTML='<div class="farma-state">Cargando próximos días...</div>';
      const respuestas=await Promise.all(fechas.map(f=>farmaFetchTurnos(f).catch(()=>({turnos:[]}))));
      semanaBox.innerHTML=respuestas.map((data,i)=>{const turnos=Array.isArray(data.turnos)?data.turnos:[];return `<div class="farma-week-day"><div class="farma-week-date">${farmaEsc(farmaHumanDate(fechas[i]))}</div>${turnos.length?turnos.map(farmaCardHtml).join(''):'<div>Sin información cargada.</div>'}</div>`}).join('');
    }
    document.addEventListener('DOMContentLoaded',()=>{
      document.getElementById('irFarmaciaTurno')?.addEventListener('click',()=>{
        document.getElementById('farmaciaTurnoSection')?.scrollIntoView({behavior:'smooth',block:'start'});
      });
      setTimeout(()=>{try{cargarFarmaciasTurnoCiudad()}catch(e){}},0);
    });

</script>
