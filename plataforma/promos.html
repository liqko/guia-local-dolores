<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guía Local | Promociones y descuentos</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel:#fff;
      --muted:#6b7a90;
      --blue:#1f5fb8;
      --brand-blue:#006699;
      --brand-dark:#0f2e58;
      --promo:#ff7f50;
      --promo-soft:#f5e1d4;
      --border:#e6eefc;
      --shadow:0 10px 30px rgba(28,43,78,.07);
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;max-width:100%;margin:0;
      overflow-x:hidden;overflow-y:visible;
      background:transparent!important;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      color:#122;
      touch-action:pan-y;
      overscroll-behavior:auto;
    }

    .header-flex{
      max-width:1100px;margin:24px auto 12px;padding:12px 14px;
      display:flex;gap:16px;align-items:center;flex-wrap:wrap;
      background:#fff;border:1px solid #e6eefc;border-radius:16px;
      box-shadow:0 8px 22px rgba(33,49,86,.06);
      width:calc(100% - 36px);box-sizing:border-box;
    }
    .main-logo{
      width:84px;height:84px;border-radius:16px;object-fit:contain;background:#fff;
      box-shadow:0 8px 22px rgba(33,49,86,.08);padding:8px;flex:0 0 auto;
    }
    .header-copy{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 auto;}
    .header-title{
      margin:0;color:#0f2e58;font-size:2.05rem;font-weight:950;
      line-height:1.06;letter-spacing:-.02em;text-align:left;
      max-width:none;min-width:0;padding:0;word-break:break-word;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
    }
    .header-subtitle{
      margin:0;color:#6b7a90;font-weight:650;font-size:1.02rem;line-height:1.35;
      word-break:break-word;font-family:"Inter","Segoe UI",Arial,sans-serif;
    }

    .search-container{
      max-width:1100px;margin:16px auto 12px;padding:0 18px;
      display:flex;justify-content:flex-start;box-sizing:border-box;
    }
    .search-box{
      width:100%;padding:12px 14px;font-size:1rem;
      border:1.5px solid #d7e1f7;border-radius:14px;outline:none;
      margin:0;background:#fff;box-shadow:none;
    }

    .promo-filter-notice{
      display:none;max-width:1064px;margin:0 auto 14px;padding:10px 14px;
      background:#fff7f2;border:1px solid #efc7b4;border-radius:12px;
      text-align:center;font-weight:800;color:#40556d;box-sizing:border-box;
      width:calc(100% - 36px);
    }

    .categories-bar{
      max-width:1100px;margin:0 auto 18px;padding:0 18px;
      display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;box-sizing:border-box;
    }
    .category-chip{
      display:inline-flex;align-items:center;gap:7px;
      background:#fff;color:var(--brand-blue);border:1.5px solid #b9d6e4;
      border-radius:999px;padding:8px 13px;font-size:.92rem;font-weight:850;
      cursor:pointer;box-shadow:none;
    }
    .category-chip.selected,.category-chip:hover{
      background:var(--brand-blue);color:#fff;border-color:var(--brand-blue);
    }
    .logo-categoria{
      width:26px;height:26px;object-fit:contain;border-radius:6px;background:#fff;
      border:1px solid #e6eefc;padding:2px;margin:0;
    }

    .cards-container{
      max-width:1100px;margin:0 auto;padding:0 18px 32px;
      display:flex;flex-direction:column;gap:16px;align-items:center;
      min-height:240px;box-sizing:border-box;
    }
    .card{
      width:100%;max-width:100%;min-width:0;padding:0;
      display:flex;flex-direction:column;gap:0;
      background:linear-gradient(180deg,#fff8f1 0%,var(--promo-soft) 100%);
      border:2px solid var(--promo);border-radius:18px;overflow:hidden;
      box-shadow:0 16px 38px rgba(255,122,42,.10);
      transition:transform .18s,box-shadow .18s;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(28,43,78,.12)}

    .card-logos-row{
      width:100%;display:flex;gap:12px;align-items:center;margin:0;
      padding:10px 14px;background:linear-gradient(90deg,#fff0dc 0%,#ffe0bf 100%);
      border-bottom:1px solid #ffc37a;
    }
    .left-row{width:100%;min-width:0}
    .logo-comercio{
      width:58px;height:58px;border-radius:12px;object-fit:contain;background:#fff;
      border:1px solid #edf2ff;padding:4px;flex:0 0 auto;
    }
    .card-title{
      color:#132f6e;font-size:1.16rem;font-weight:950;line-height:1.12;margin:0;
      word-break:break-word;-webkit-text-stroke:0!important;text-shadow:none!important;
    }
    .cat-label{
      display:inline-flex;align-items:center;gap:7px;margin-top:6px!important;
      padding:6px 10px;border-radius:999px;background:#fff;color:#536273;
      border:1px solid #d9e1ec;font-weight:850;
      -webkit-text-stroke:0!important;text-shadow:none!important;
    }

    .promo-row{
      width:calc(100% - 32px);margin:14px 16px 0;padding:12px 14px;
      border-left:4px solid var(--promo);background:#fff;border-radius:10px;
      color:#243447;font-size:1.08rem;font-weight:900;
    }
    .promo-img-wrap{
      width:calc(100% - 32px);margin:14px 16px 4px;display:flex;justify-content:center;
    }
    .promo-img{
      display:block;width:min(100%,620px);max-height:620px;object-fit:contain;
      border-radius:14px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.10);
    }

    .otros-row,.fecha-row,.info-row,.socials,.extras-container,.vermas{
      margin-left:16px;margin-right:16px;
    }
    .otros-row{margin-top:12px;color:#52657b;font-style:normal}
    .date-label{
      margin:10px 16px 4px;font-size:.75em;font-weight:900;text-transform:uppercase;
      color:var(--muted);letter-spacing:.04em;
    }
    .fecha-row{display:flex;align-items:center;gap:8px;font-weight:800}
    .date-desde{color:#2f6f8d}
    .date-hasta{color:#c35a38}

    .info-row{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:#40556d}
    .info-row .icon{color:var(--brand-blue);font-size:1.1rem;min-width:26px;text-align:center}

    .btn-maps{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      margin:10px 16px 0;padding:10px 14px;background:var(--brand-blue);color:#fff;
      font-weight:850;border-radius:10px;text-decoration:none;border:none;
      box-shadow:0 3px 10px rgba(0,102,153,.18);
    }
    .btn-maps:hover{background:#00547d}

    .socials{display:flex;gap:8px;align-items:center;margin-top:10px;margin-bottom:12px;flex-wrap:wrap}
    .socials a{
      display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
      border-radius:10px;background:#f4f7fb;border:1px solid #e3eaf4;
      color:var(--brand-blue);text-decoration:none;font-size:1.35em;
    }

    .badge{
      background:#fff;padding:6px 10px;border-radius:10px;border:1px solid #e6eefc;
      font-weight:700;display:inline-block;margin-right:8px;
    }
    .extras-container{
      margin-top:10px;margin-bottom:10px;background:#fff;padding:12px;border-radius:10px;
      border:1px solid #e6eefc;
    }
    .extras-table{width:100%;border-collapse:collapse;font-size:.95rem}
    .extras-table td{padding:6px 8px;vertical-align:top;border-bottom:1px dashed rgba(0,0,0,.06)}
    .vermas{
      display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--brand-blue);
      font-weight:800;border:none;background:none;padding:0 0 14px;
    }

    .paginator{
      display:flex;justify-content:center;gap:16px;margin:18px auto 40px;align-items:center;
      width:calc(100% - 36px);max-width:1064px;padding:.6em;
      background:var(--promo-soft);border-radius:1.5em;box-sizing:border-box;
    }
    .paginator button{
      padding:8px 14px;background:var(--brand-blue);color:#fff;border:none;
      border-radius:8px;font-weight:800;cursor:pointer;
    }
    .paginator button[disabled]{opacity:.5;cursor:not-allowed}

    .promos-loading{
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;min-height:140px;padding:20px;background:#fff;
      border:1px solid var(--border);border-radius:14px;
      font-weight:900;color:var(--brand-dark);box-shadow:var(--shadow);
    }
    .promos-loading-spinner{
      width:30px;height:30px;border:4px solid #dce9ef;border-top-color:var(--brand-blue);
      border-radius:50%;animation:promosSpin .8s linear infinite;flex:0 0 auto;
    }
    @keyframes promosSpin{to{transform:rotate(360deg)}}

    .banner-tarjeta{
      width:100%;text-align:center;margin:1em 0;
      display:flex;justify-content:center;position:relative;flex-direction:column;align-items:center;gap:.6rem;
    }
    .banner-tarjeta .banner-media{
      width:min(90vw,360px);max-width:360px;aspect-ratio:9/16;
      display:flex;align-items:center;justify-content:center;background:#000;
      border-radius:1em;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;
    }
    .banner-tarjeta .banner-media iframe,
    .banner-tarjeta .banner-media video,
    .banner-tarjeta .banner-media img{
      width:100%;height:100%;object-fit:contain;display:block;border:none;
    }
    .banner-tarjeta .cta-btn,.replay-btn,.promo-video-sound-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
      min-height:42px;padding:.55em .9em;background:var(--promo);color:#fff;border-radius:.6em;
      text-decoration:none;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.14);
      border:none;cursor:pointer;font-size:.95rem;
    }
    .replay-btn{display:none}
    .promo-video-sound-btn{background:var(--brand-blue)}

    @media(max-width:600px){
      .header-flex{margin:12px 8px 10px;padding:10px;width:calc(100% - 16px);flex-wrap:nowrap;align-items:center;gap:10px}
      .main-logo{width:58px;height:58px;flex:0 0 auto;padding:5px;border-radius:12px}
      .header-title{font-size:1.45rem}
      .header-subtitle{font-size:.92rem}
      .search-container,.categories-bar,.cards-container{padding-left:8px;padding-right:8px}
      .promo-filter-notice{width:calc(100% - 16px)}
      .category-chip{font-size:.86rem;padding:7px 10px}
      .promo-row,.promo-img-wrap{width:calc(100% - 24px);margin-left:12px;margin-right:12px}
      .otros-row,.fecha-row,.info-row,.socials,.extras-container,.vermas{margin-left:12px;margin-right:12px}
      .date-label{margin-left:12px;margin-right:12px}
      .btn-maps{margin-left:12px;margin-right:12px;width:calc(100% - 24px)}
      .paginator{width:calc(100% - 16px);flex-wrap:wrap}
      .banner-tarjeta .banner-media{width:min(92vw,320px);max-width:100%}
    }
  

    /* ===== TARJETAS POR NIVEL DEL ANUNCIANTE ===== */
    .card.nivel-1{
      background:linear-gradient(180deg,#eef9ff 0%,#d7eefc 100%);
      border-color:#58aeda;
      box-shadow:0 14px 30px rgba(88,174,218,.16);
    }
    .card.nivel-1 .card-logos-row{background:linear-gradient(90deg,#eef8ff 0%,#d6eefb 100%);border-bottom-color:#9fd0e8}

    .card.nivel-2{
      background:linear-gradient(180deg,#f2fcf4 0%,#dcefdc 100%);
      border-color:#5f9f68;
      box-shadow:0 14px 30px rgba(95,159,104,.16);
    }
    .card.nivel-2 .card-logos-row{background:linear-gradient(90deg,#f2fcf4 0%,#d9edd9 100%);border-bottom-color:#add1b2}

    .card.nivel-3{
      background:linear-gradient(180deg,#fffbee 0%,#f1e2ad 100%);
      border-color:#bea247;
      box-shadow:0 14px 30px rgba(190,162,71,.16);
    }
    .card.nivel-3 .card-logos-row{background:linear-gradient(90deg,#fffbee 0%,#f2e6b8 100%);border-bottom-color:#d7c675}

    .card.nivel-4{
      background:linear-gradient(180deg,#effcf8 0%,#cfece3 100%);
      border-color:#58b59e;
      box-shadow:0 14px 30px rgba(88,181,158,.17);
    }
    .card.nivel-4 .card-logos-row{background:linear-gradient(90deg,#effcf8 0%,#d3ede5 100%);border-bottom-color:#9fd2c4}

    .card.nivel-5{
      background:linear-gradient(180deg,#fff5f1 0%,#ffd7cd 100%);
      border-color:#e4836f;
      box-shadow:0 14px 30px rgba(228,131,111,.18);
    }
    .card.nivel-5 .card-logos-row{background:linear-gradient(90deg,#fff1ec 0%,#ffd9cf 100%);border-bottom-color:#efb5a7}

    .card.nivel-6{
      background:linear-gradient(145deg,#4a525a 0%,#252c33 48%,#11161b 100%);
      border-color:#606b77;
      box-shadow:0 18px 36px rgba(0,0,0,.28);
      color:#f6f8fa;
    }
    .card.nivel-6 .card-logos-row{
      background:linear-gradient(90deg,#2a3138 0%,#171d22 100%);
      border-bottom-color:rgba(255,255,255,.10);
    }
    .card.nivel-6 .card-title,
    .card.nivel-6 .otros-row,
    .card.nivel-6 .fecha-row,
    .card.nivel-6 .info-row,
    .card.nivel-6 .date-label,
    .card.nivel-6 .vermas{color:#f6f8fa!important}
    .card.nivel-6 .info-row .icon,
    .card.nivel-6 .socials a{color:#9ddcff!important}
    .card.nivel-6 .cat-label,
    .card.nivel-6 .promo-row,
    .card.nivel-6 .extras-container,
    .card.nivel-6 .badge{
      background:rgba(255,255,255,.08)!important;
      color:#f6f8fa!important;
      border-color:rgba(255,255,255,.12)!important;
    }
    .card.nivel-6 .promo-row{border-left-color:#9ddcff!important}
    .card.nivel-6 .logo-comercio{background:#fff;border-color:rgba(255,255,255,.16)}
    .card.nivel-6 .socials a{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}

    /* Acceso inferior al panel */
    .gld-promo-access-wrap{
      width:calc(100% - 36px);max-width:1064px;margin:0 auto 34px;
    }
    .gld-promo-access{
      display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;
      width:100%;min-height:66px;padding:9px 11px;border-radius:14px;text-decoration:none;
      background:linear-gradient(135deg,#fff6ec 0%,#ffe5d4 100%);color:#b84b00;
      border:1px solid #ffc89f;box-shadow:0 4px 14px rgba(0,0,0,.06);
    }
    .gld-promo-access-icon{
      width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#ffb86b,#ff7a2a);color:#fff;font-size:1.55rem;
      border:1px solid rgba(184,75,0,.12);
    }
    .gld-promo-access strong{display:block;font-size:.98rem;line-height:1.2;margin-bottom:2px}
    .gld-promo-access span{display:block;font-size:.82rem;line-height:1.3;color:#6a574c}
    .gld-promo-access b{font-size:1.2rem;line-height:1}
    @media(max-width:600px){.gld-promo-access-wrap{width:calc(100% - 16px);margin-bottom:12px}}

</style>
</head>
<body>
<div class="header-flex">
    <img class="main-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23006699'/><stop offset='1' stop-color='%23ff7f50'/></linearGradient></defs><rect x='8' y='8' width='80' height='80' rx='22' fill='url(%23g)'/><path d='M28 32h30l12 12-28 28-20-20z' fill='white'/><circle cx='55' cy='42' r='4' fill='%23006699'/></svg>" alt="Promociones y descuentos">
    <div class="header-copy">
      <h1 class="header-title" id="promosTitle">PROMOS Y DESCUENTOS</h1>
      <p class="header-subtitle" id="promosSubtitle">Conocé todas las promos y descuentos que ofrece la ciudad, en un solo lugar.</p>
    </div>
  </div>
<div class="search-container">
    <input id="search" class="search-box" placeholder="Buscar por nombre, categoría o promo...">
  </div>

  <div class="gld-promo-access-wrap">
    <a class="gld-promo-access" href="https://guialocal.ar/login-anunciantes/" target="_top" rel="noopener">
      <span class="gld-promo-access-icon" aria-hidden="true"><i class="ri-price-tag-3-line"></i></span>
      <span><strong>Sumá tu promo</strong>Ingresá al panel para publicar y gestionar tus promociones.</span>
      <b aria-hidden="true">›</b>
    </a>
  </div>

  <div id="promoFilterNotice" class="promo-filter-notice"></div>
  <div id="categoriesBar" class="categories-bar"></div>
  <div id="cards" class="cards-container">
    <div class="promos-loading" role="status" aria-live="polite">
      <span class="promos-loading-spinner" aria-hidden="true"></span>
      <span>Cargando promociones de la ciudad...</span>
    </div>
  </div>
  <div id="paginator" class="paginator"></div>
<script>
    const DATA_URL = "https://script.google.com/macros/s/AKfycbwZ4UR8pKD5Y0tLsD2VVa82tvRJ8LxZw8jqbz3mhg4RCZc2Tu9lDVjL3gohIsokRWo0/exec";
    const BANNERS_URL = "https://opensheet.elk.sh/170kTZ-ViCPxPli86g-n_XMuMv1S3O0-DbGwNFGYVnjY/banners";
    let banners = [];
    const bannersPromise = fetch(BANNERS_URL).then(r=>r.json()).catch(()=>[]);
    const CITY_CONTEXT_KEY = 'gld_ciudad_contexto';
    let pageParams = new URLSearchParams(window.location.search || '');
    try{
      const ref = new URL(document.referrer || '');
      const refParams = new URLSearchParams(ref.search || '');
      if(!pageParams.get('ciudad_id') && refParams.get('ciudad_id')) pageParams = refParams;
    }catch(e){}
    let ciudadContexto = {
      pais_id:String(pageParams.get('pais_id') || '').trim(),
      provincia_id:String(pageParams.get('provincia_id') || '').trim(),
      ciudad_id:String(pageParams.get('ciudad_id') || '').trim(),
      pais:String(pageParams.get('pais') || '').trim(),
      provincia:String(pageParams.get('provincia') || '').trim(),
      ciudad:String(pageParams.get('ciudad') || '').trim()
    };
    try{
      const saved=JSON.parse(localStorage.getItem(CITY_CONTEXT_KEY)||'null');
      if(saved){
        ['pais_id','provincia_id','ciudad_id','pais','provincia','ciudad'].forEach(k=>{
          if(!ciudadContexto[k] && saved[k]) ciudadContexto[k]=String(saved[k]).trim();
        });
      }
      if(ciudadContexto.ciudad_id) localStorage.setItem(CITY_CONTEXT_KEY,JSON.stringify(ciudadContexto));
    }catch(e){}

    function gldPromoCiudadNombre_(){
      const directa=String(ciudadContexto.ciudad || '').trim();
      if(directa) return directa;
      const id=String(ciudadContexto.ciudad_id || '').trim();
      if(!id) return '';
      const m=id.match(/^([A-ZÁÉÍÓÚÑa-záéíóúñ .'-]+?)\s*(?:\+|\(|-|$)/);
      const candidata=m ? String(m[1] || '').trim() : '';
      if(candidata && candidata.length > 2 && !/^[A-Z]{2,4}$/.test(candidata)) return candidata;
      return '';
    }

    function gldPromoActualizarCabecera_(){
      const ciudad=gldPromoCiudadNombre_();
      const title=document.getElementById('promosTitle');
      const subtitle=document.getElementById('promosSubtitle');
      if(title) title.textContent=ciudad ? `PROMOCIONES Y DESCUENTOS EN ${ciudad.toUpperCase()}` : 'PROMOCIONES Y DESCUENTOS';
      if(subtitle) subtitle.textContent='Conocé todas las promos y descuentos que ofrece la ciudad, en un solo lugar.';
      document.title=ciudad ? `Guía Local | Promociones y descuentos en ${ciudad}` : 'Guía Local | Promociones y descuentos';
    }
    gldPromoActualizarCabecera_();

    let comerciosData = [];
    let filtrados = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let categoriasSet = new Set();
    let categoriaFiltro = "";

    const PROMOS_FILTER_STORAGE_KEY = 'gld_promos_filter';
    let incomingPromoFilter = null;

    function normalizeFilterText(v){
      return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    }
    function promoFilterKey(p){
      const pid = String(p && p.promo_id || '').trim();
      if(pid) return 'id:' + pid;
      const nombre = normalizeFilterText(p && (p.anunciante || p.nombre));
      const promo = normalizeFilterText(p && p.promo);
      const desde = String(p && p.desde || '').trim();
      const hasta = String(p && p.hasta || '').trim();
      return ['fallback', nombre, promo, desde, hasta].join('|');
    }
    function readIncomingPromoFilter(){
      const id = String(pageParams.get('id_comercio') || '').trim();
      const anunciante = String(pageParams.get('anunciante') || '').trim();
      const sede_id = String(pageParams.get('sede_id') || '').trim();

      // Solo filtramos por anunciante cuando realmente llegamos desde una tarjeta.
      if(!(id || anunciante || sede_id)){
        try{ localStorage.removeItem(PROMOS_FILTER_STORAGE_KEY); }catch(e){}
        return null;
      }

      let stored = null;
      try{
        const raw = localStorage.getItem(PROMOS_FILTER_STORAGE_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          const age = Date.now() - Number(parsed.ts || 0);
          if(age >= 0 && age <= 10 * 60 * 1000) stored = parsed;
        }
        localStorage.removeItem(PROMOS_FILTER_STORAGE_KEY);
      }catch(e){}

      return Object.assign({}, stored || {}, {
        id_comercio:id || (stored && stored.id_comercio) || '',
        anunciante:anunciante || (stored && stored.anunciante) || '',
        sede_id:sede_id || (stored && stored.sede_id) || ''
      });
    }

    function promoMatchesIncomingFilter(p, filter){
      if(!filter) return true;

      const keys = Array.isArray(filter.promo_keys) ? filter.promo_keys.filter(Boolean) : [];
      if(keys.length && keys.includes(promoFilterKey(p))) return true;

      const wantedSede = String(filter.sede_id || '').trim();
      const promoSede = String(p && p.sede_id || '').trim();
      if(wantedSede && promoSede && wantedSede === promoSede) return true;

      const wantedId = String(filter.id_comercio || '').trim();
      const promoId = String(p && (p.id_comercio || p.comercio_id || p.id_anunciante || '') || '').trim();
      if(wantedId && promoId && wantedId === promoId) return true;

      const wantedName = normalizeFilterText(filter.anunciante);
      const promoName = normalizeFilterText(p && (p.anunciante || p.nombre || p.comercio));
      return !!wantedName && promoName === wantedName;
    }

    function parsePromoDate(fecha) {
      if (!fecha) return null;
      if (!isNaN(fecha) && typeof fecha !== "string") {
        const base = Date.UTC(1899,11,30);
        return new Date(base + Number(fecha) * 86400000);
      }
      const s = String(fecha).trim();
      let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    function fechaHumana(fecha) {
      const d = parsePromoDate(fecha);
      if (!d) return String(fecha || "");
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function encodeUrl(u) {
      if (!u) return '';
      u = String(u).trim();
      if (/^https?:\/\//i.test(u)) return u;
      if (/^mailto:/i.test(u) || /^tel:/i.test(u)) return u;
      if (/^www\./i.test(u)) return 'https://' + u;
      return 'https://' + u;
    }

    function normalizeDigits(s) {
      if (!s) return '';
      return String(s).replace(/[^\d]/g, '');
    }

    function makeWhatsAppLink(wh) {
      if (!wh) return "";
      const s = String(wh).trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) return s;
      if (/^(?:https?:\/\/)?(?:wa\.me|api\.whatsapp\.com)/i.test(s)) {
        return (/^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, ''));
      }
      const digits = s.replace(/[^0-9]/g, '');
      if (digits.length >= 6) return 'https://wa.me/' + digits;
      return encodeUrl(s);
    }

    function getWhatsAppForCom(com, phoneComparison) {
      if (!com) return "";
      const candidates = [];
      if (com.whatsapp) candidates.push(com.whatsapp);
      const extras = com.extras || {};
      const keys = ['whatsapp','whatsapp_url','whatsapp_link','wa','wpp','wsp','whats','whats_app','whatsappnumber','whatsapp_num'];
      keys.forEach(k => { if (k in extras && extras[k]) candidates.push(extras[k]); });
      Object.keys(extras).forEach(k => {
        if (/^(?:wa|wpp|whats|whatsapp)/i.test(k) && extras[k]) candidates.push(extras[k]);
      });

      for (let i = 0; i < candidates.length; i++) {
        const v = candidates[i];
        if (!v) continue;
        const str = String(v).trim();
        if (!str) continue;
        const link = makeWhatsAppLink(str);
        if (!link) continue;
        return link;
      }
      return "";
    }

    function makeMapLink(llegarVal, domicilioVal) {
      if (llegarVal && String(llegarVal).trim()) {
        const v = String(llegarVal).trim();
        if (/^https?:\/\//i.test(v)) return v;
        if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(v)) {
          const coords = v.replace(/\s+/g,'');
          return `https://www.google.com/maps?q=${coords}`;
        }
        return encodeUrl(v);
      }
      if (domicilioVal && String(domicilioVal).trim()) {
        const q = encodeURIComponent(String(domicilioVal).trim());
        return `https://www.google.com/maps/search/?api=1&query=${q}`;
      }
      return "";
    }

    function encodeTel(t) {
      if (!t) return '';
      return String(t).replace(/[^\d+]/g, '');
    }

    function safeUrl(u) {
      try {
        const v = encodeUrl(u);
        if (!v) return '';
        if (/^https?:\/\/\s*$/i.test(v)) return '';
        return v;
      } catch (e) { return ''; }
    }

    function getYouTubeEmbedUrl(url){
      try{
        let id='';
        const u=new URL(url);
        if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1);
        else{
          id=u.searchParams.get('v')||'';
          if(!id){ const parts=u.pathname.split('/').filter(Boolean); id=parts.pop()||''; }
        }
        if(!id) return '';
        const p=new URLSearchParams({
          rel:0,playsinline:1,enablejsapi:1,modestbranding:1,
          autoplay:1,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3
        });
        return `https://www.youtube.com/embed/${id}?${p.toString()}`;
      }catch(e){ return ''; }
    }

        }else{

          }else{

            promoYtCommand(media,'setVolume',[100]);

    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
    }
    function buildBannerSequence(slots){
      if(!banners.length || slots<=0) return [];
      const out=[];
      while(out.length<slots){
        const pool=banners.slice();
        shuffleArray(pool);
        for(const b of pool){
          if(out.length>=slots) break;
          out.push(b);
        }
        if(!pool.length) break;
      }
      return out.slice(0,slots);
    }

    function aplicarFiltro(search) {
      const q = (search||'').trim().toLowerCase();
      if (categoriaFiltro) {
        filtrados = comerciosData.filter(c => c.categoria && c.categoria.toLowerCase() === categoriaFiltro.toLowerCase());
      } else if (q) {
        let matchCat = Array.from(categoriasSet).find(cat => cat.toLowerCase() === q);

        else {
          filtrados = comerciosData.filter(c => {
            const main = (c.anunciante && c.anunciante.toLowerCase().includes(q)) || (c.categoria && c.categoria.toLowerCase().includes(q)) || (c.promo && c.promo.toLowerCase().includes(q));
            if (main) return true;
            if (c.extras) return Object.values(c.extras).some(v => String(v||'').toLowerCase().includes(q));
            return false;
          });
        }
      } else {
        filtrados = comerciosData;
      }
      currentPage = 1;
      renderCards(filtrados,currentPage);
      renderCategoriesBar();
    }

    function hasMeaningfulData(c) {
      if (!c) return false;
      const props = ['anunciante','nombre','promo','categoria','direccion','telefono','instagram','facebook','youtube','tiktok','linkedin','x','logo','img','llegar','maps','otros'];
      for (let i=0;i<props.length;i++){
        const k = props[i];
        if (k in c && c[k] !== null && c[k] !== undefined && String(c[k]).trim() !== '') return true;
      }
      if (c.extras) {
        const vals = Object.values(c.extras);
        if (vals.some(v => v !== null && v !== undefined && String(v).trim() !== '')) return true;
      }
      return false;
    }

    function toBoolAprobado(v) {
      if (v === true) return true;
      if (typeof v === 'string') {
        const t = v.trim().toLowerCase();
        return t === 'true' || t === '1' || t === 'sí' || t === 'si' || t === 'x';
      }
      if (typeof v === 'number') return v === 1;
      return false;
    }
    function toBoolPausado(v){
      if (v === true || v === 1) return true;
      const t = String(v || '').trim().toLowerCase();
      return t === 'true' || t === '1' || t === 'sí' || t === 'si' || t === 'x';
    }

    function isPromoVigenteHasta(hastaValue) {
      if (!hastaValue) return false;
      const fecha = parsePromoDate(hastaValue);
      if (!fecha) return false;
      const hoy = new Date();
      hoy.setHours(0,0,0,0);
      fecha.setHours(0,0,0,0);
      return fecha >= hoy;
    }

    function loadData() {
      if (!DATA_URL) { document.getElementById('cards').innerHTML = '<p style="color:#b02a2a">Falta DATA_URL</p>'; return; }

      const cardsLoading = document.getElementById('cards');
      const paginatorLoading = document.getElementById('paginator');
      if(cardsLoading){
        cardsLoading.innerHTML = `<div class="promos-loading" role="status" aria-live="polite">
          <span class="promos-loading-spinner" aria-hidden="true"></span>
          <span>Cargando promociones de la ciudad...</span>
        </div>`;
      }
      if(paginatorLoading){ paginatorLoading.innerHTML = ''; paginatorLoading.style.display = 'none'; }

      const dataUrl = new URL(DATA_URL);
      if(ciudadContexto.ciudad_id) dataUrl.searchParams.set('ciudad_id', ciudadContexto.ciudad_id);
      fetch(dataUrl.toString()).then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(raw => {
        let data = [];
        if (Array.isArray(raw)) {
          data = raw;
        } else if (raw && Array.isArray(raw.promos)) {
          data = raw.promos;
        } else if (raw && Array.isArray(raw.rows)) {
          data = raw.rows;
        } else if (raw && Array.isArray(raw.data)) {
          data = raw.data;
        } else if (raw && raw.error) {
          throw new Error(String(raw.error));
        } else if (raw && typeof raw === 'object' && Object.keys(raw).length === 0) {
          data = [];
        } else {
          try {
            const maybeArray = Object.values(raw).filter(v => v && typeof v === 'object' && ('promo' in v || 'anunciante' in v));
            if (maybeArray.length) data = maybeArray;
            else data = Array.isArray(raw) ? raw : [];
          } catch(e){ data = []; }
        }

        comerciosData = (Array.isArray(data) ? data : []).map(row => {
          const obj = Object.assign({}, row);
          if (!obj.anunciante && obj.anunciante !== '' && (obj.nombre)) obj.anunciante = obj.nombre;
          if (!obj.direccion && obj.domicilio) obj.direccion = obj.domicilio;
          if (!obj.whatsapp && obj.whats) obj.whatsapp = obj.whats;
          if (!obj.extras) obj.extras = obj.extras || {};
          return obj;
        });

        // SOLO aprobados, no pausados y con fecha HASTA válida (vigente)
        comerciosData = comerciosData.filter(c => 
          toBoolAprobado(c.aprobado) &&
          !toBoolPausado(c.pausado) &&
          c.hasta && 
          isPromoVigenteHasta(c.hasta)
        );
        comerciosData = comerciosData.filter(hasMeaningfulData);

        incomingPromoFilter = readIncomingPromoFilter();
        if(incomingPromoFilter){
          comerciosData = comerciosData.filter(c => promoMatchesIncomingFilter(c, incomingPromoFilter));
          showPromoFilterNotice(incomingPromoFilter, comerciosData.length);
        }

        filtrados = comerciosData;
        categoriasSet = new Set(comerciosData.map(c => c.categoria).filter(Boolean));
        renderCards(filtrados,currentPage);
        renderCategoriesBar();
        gldPromoAvisar('ready','');

        bannersPromise.then(raw=>{
          banners=(Array.isArray(raw)?raw:[])
            .filter(b=>{
              const a=String(b.aprobado??'').trim().toLowerCase();
              return a==='true' || a==='1' || a==='x';
            })
            .map(b=>({
              img:String(b.img||b.url||'').trim(),
              media:String(b.media||'').trim(),
              cta:String(b.cta||'').trim(),
              poster:String(b.poster||'').trim()
            }))
            .filter(b=>b.img || b.media);
          if(banners.length) renderCards(filtrados,currentPage);
        }).catch(()=>{});
      }).catch(err => {
        document.getElementById('cards').innerHTML = `<p style="color:#b02a2a">No se pudieron cargar las promos o descuentos.<br>${escapeHtml(String(err))}</p>`;
        console.error('loadData error:', err);
        gldPromoAvisar('error',String(err && err.message ? err.message : err));
      });
    }

    document.getElementById('search').addEventListener('input', function(){ categoriaFiltro=''; aplicarFiltro(this.value); });

    function gldPromoAvisar(estado, detalle){
      try{
        window.parent.postMessage({
          tipo:'gldModuloEstado',
          modulo:'promos',
          estado:String(estado||''),
          detalle:String(detalle||'')
        }, '*');
      }catch(e){}
    }

    if(!ciudadContexto.ciudad_id){
      const cards=document.getElementById('cards');
      if(cards) cards.innerHTML='<p style="color:#b02a2a;font-weight:800">No hay una ciudad seleccionada.</p>';
      gldPromoAvisar('error','No hay una ciudad seleccionada.');
    }else{
      loadData();
    }
  

    /* ALTURA AUTOMÁTICA DEL MÓDULO */
    (() => {
      let ultimoAlto = 0;
      let rafAltura = 0;

      function medirYEnviarAltura(){
        cancelAnimationFrame(rafAltura);
        rafAltura = requestAnimationFrame(() => {
          const alto = Math.ceil(
            Math.max(
              document.body ? document.body.scrollHeight : 0,
              document.documentElement ? document.documentElement.scrollHeight : 0
            )
          );

          if(!alto || Math.abs(alto - ultimoAlto) < 2) return;
          ultimoAlto = alto;

          window.parent.postMessage({
            tipo:'alturaIframeGLD',
            altura:alto,
            ruta:window.location.pathname
          }, '*');
        });
      }

      window.addEventListener('load', medirYEnviarAltura);
      window.addEventListener('resize', medirYEnviarAltura);

      if('ResizeObserver' in window){
        const ro = new ResizeObserver(medirYEnviarAltura);
        if(document.body) ro.observe(document.body);
        if(document.documentElement) ro.observe(document.documentElement);
      }

      if('MutationObserver' in window && document.body){
        const mo = new MutationObserver(medirYEnviarAltura);
        mo.observe(document.body,{
          childList:true,
          subtree:true,
          attributes:true,
          characterData:false
        });
      }

      [100,600,1500].forEach(ms=>setTimeout(medirYEnviarAltura,ms));
    })();

</script>
