name: Pruebas de recuperación del corte
on:
  push:
    branches: [fix/recuperacion-corte-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/publication-integrity.mjs
      - run: node --test tests/publicacion-generica.test.mjs tests/observabilidad/corte-ciudad.test.mjs tests/paquete-ciudad.test.mjs tests/public-territory.test.mjs tests/hosting-reutilizacion.test.mjs
