name: Auditoría integral - puerta de control
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    paths:
      - 'worker/**'
      - 'plataforma/**'
      - 'auditorias/**'
      - '.github/workflows/auditoria-integral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocolo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar analizador AST
        run: npm install --no-save --package-lock=false typescript@5.9.3
      - name: Probar detección real y rechazo de mapas falsificados
        run: node auditorias/probar-mapa-gps.cjs
      - name: Generar mapa GPS del código completo
        run: node auditorias/generar-mapa-gps.cjs --write
      - name: Comprobar grafo y reproducibilidad del mapa GPS
        run: |
          node auditorias/generar-mapa-gps.cjs --test
          node auditorias/generar-mapa-gps.cjs --check
      - name: Publicar mapa GPS y rutas no resueltas
        uses: actions/upload-artifact@v4
        with:
          name: mapa-gps-dependencias
          path: |
            auditorias/transversal/MAPA_GPS_GENERADO.json
            auditorias/transversal/MAPA_GPS_GENERADO.md
          if-no-files-found: error
      - name: Probar hallazgos automáticos y rechazo de informes falsos
        run: node auditorias/probar-auditor-codigo.cjs
      - name: Auditar duplicaciones, rutas y operaciones de todo el código
        run: |
          node auditorias/auditar-codigo.cjs --write
          node auditorias/auditar-codigo.cjs --check
      - name: Mostrar hallazgos de prioridad alta y catálogos territoriales
        run: |
          node -e "const r=require('./auditorias/transversal/AUDITORIA_AUTOMATICA.json'); console.log(JSON.stringify({altos:r.issues.filter(x=>x.severity==='alto'),territorio:Object.fromEntries(Object.entries(r.catalogs).filter(([k])=>k.includes('territorio:')).map(([k,v])=>[k,{lectores:v.readers.length,escritores:v.writers.length,escrituras:v.writers.slice(0,12)}]))},null,2))"
      - name: Publicar informe integral de duplicaciones y conexiones
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-codigo-completo
          path: |
            auditorias/transversal/AUDITORIA_AUTOMATICA.json
            auditorias/transversal/AUDITORIA_AUTOMATICA.md
          if-no-files-found: error
      - name: Probar que el control rechaza pruebas falsas e incompletas
        run: node auditorias/control-integridad.cjs --self-test
      - name: Inventariar automáticamente todas las fuentes y entradas
        run: node auditorias/control-integridad.cjs --scan
      - name: Impedir cierre sin cobertura íntegra ni pruebas ejecutadas
        run: node auditorias/control-integridad.cjs --check
      - name: Comprobar protocolo y evidencias de cierre
        env:
          GLD_AUDIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node auditorias/validar-protocolo.cjs
