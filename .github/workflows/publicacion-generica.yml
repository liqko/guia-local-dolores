name: Verificar publicación extensible y lector común
on:
  push:
    branches: [fix/publicacion-generica]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/publication-integrity.mjs
      - name: Contrato, ampliación sin cambios de transporte y compatibilidad
        run: node --test tests/paquete-ciudad.test.mjs tests/publicacion-generica.test.mjs tests/public-territory.test.mjs tests/eventos-paquete.test.cjs tests/recursos-publicos.test.mjs tests/empleo-publico-local.test.cjs
      - name: Corte y reintentos sobre la base Worker 190 adaptada a 191
        run: GLD_WORKER=../../worker/worker191_consolidado_sobre_190_d8446f0.txt node --test tests/observabilidad/corte-ciudad.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0 typescript@5.9.3
      - name: Verificar diagnósticos del editor del Worker
        run: node tests/worker-editor191.cjs
      - name: Navegador con fuentes públicas reales en copia aislada
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs candidate --generic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publicacion-generica
          path: test-results/carcasa-eventos-candidate.json
          retention-days: 7
