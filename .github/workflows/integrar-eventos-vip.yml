name: Integrar Eventos VIP en login de prueba

on:
  push:
    branches:
      - eventos-vip-programacion
    paths:
      - '.github/workflows/integrar-eventos-vip.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: eventos-vip-programacion

      - name: Insertar script de programación VIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plataforma/login.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./eventos-vip-programacion.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plataforma/login.html
          git commit -m 'Integrar programación múltiple de Eventos VIP en login'
          git push
