name: Verificar copia diaria GH 218
on:
  push:
    branches: [fix/gh-copia-diaria-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxis YAML del publicador antes de entregar
        run: ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/firebase-hosting-merge.yml')"
      - run: node --test tests/observabilidad/suscriptores-diario195.test.mjs tests/observabilidad/ingreso-cliente195.test.mjs tests/publicacion-generica.test.mjs tests/observabilidad/corte-ciudad.test.mjs
