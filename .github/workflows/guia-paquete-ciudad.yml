name: Comprobar copia por ciudad
on:
  pull_request:
    paths:
      - "plataforma/anunciantes.html"
      - "plataforma/carcasa.html"
      - "plataforma/paquete-ciudad.js"
      - "plataforma/territorio-cache.js"
      - "scripts/preparar-paquete-ciudad.mjs"
      - "tests/paquete-ciudad.test.mjs"
      - "tests/browser/paquete-ciudad.cjs"
      - ".github/workflows/guia-paquete-ciudad.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/paquete-ciudad.test.mjs tests/public-territory.test.mjs
      - run: node tests/publication-integrity.mjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/paquete-ciudad.cjs
