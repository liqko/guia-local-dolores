name: Comprobar descargas y caché sin afectar producción
on:
  push:
    branches: [fix/sw-sin-precarga-no-visitadas-20261114]
  pull_request:
    paths:
      - 'plataforma/sw.js'
      - 'tests/service-worker-cache.test.cjs'
      - '.github/workflows/auditoria-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar instalación, navegación, offline y privacidad
        run: node --test tests/service-worker-cache.test.cjs
      - name: Comprobar integridad de la publicación
        run: node tests/publication-integrity.mjs
      - name: Comprobar paquetes públicos y recursos versionados
        run: node --test tests/paquete-ciudad.test.mjs tests/recursos-publicos.test.mjs tests/eventos-paquete.test.cjs
      - name: Preparar navegador aislado
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Medir instalación y modo sin conexión con navegador real
        env:
          GLD_CHROME: /usr/bin/google-chrome
        run: node --test tests/browser/sw-descargas-cache.cjs
      - name: Medir descargas de la plataforma actual sin modificarla
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs public
      - name: Verificar Carcasa y Eventos en navegador con código candidato
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-cache-guia-local
          path: test-results/carcasa-eventos-*.json
          retention-days: 7
