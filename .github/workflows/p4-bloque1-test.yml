name: P4 bloque 1 - regresion especifica
on:
  push:
    branches:
      - release/p4-bloque1-publico-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bloque1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: P4-0010 P4-0012 P4-0013
        run: node --test tests/paso4-bloque1-publico.test.cjs
      - name: Contratos publicos existentes
        run: node tests/publication-integrity.mjs
