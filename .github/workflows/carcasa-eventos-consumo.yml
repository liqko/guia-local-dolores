name: Medir carcasa y Eventos con datos reales
on:
  push:
    branches: [fix/carcasa-eventos-consumo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: node tests/publication-integrity.mjs
      - run: node --test tests/eventos-paquete.test.cjs
      - name: Medir la versión pública previa
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs baseline
      - name: Comprobar candidata con publicación real
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carcasa-eventos-consumo
          path: test-results/carcasa-eventos-*.json
          retention-days: 7
