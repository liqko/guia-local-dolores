name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "worker/**"
      - ".github/workflows/firebase-hosting-cleanup.yml"
      - ".github/workflows/firebase-hosting-merge.yml"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verificar integridad de las páginas antes de publicar
        run: |
          node tests/publication-integrity.mjs
          node --test tests/public-territory.test.mjs
      - name: Preparar exclusivamente archivos de plataforma para Hosting
        run: |
          set -euo pipefail
          rm -rf hosting-public
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          test -f hosting-public/plataforma/inicio.html
          test -f hosting-public/plataforma/carcasa.html
          test -f hosting-public/plataforma/administracion.html
          test "$(find hosting-public -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Preparar el catálogo público
        id: catalogo
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js --scheduled
          else
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.catalogo.outputs.changed == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          channelId: live
          projectId: anunciantes-guialocal

  trial_city_cut:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2afec4a6aa0d0e2abaa93079564bc122d1161250
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar el corte real en un canal de prueba
        run: |
          set -euo pipefail
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js
          node --input-type=module <<'JS'
          import { createPublicKey,verify } from 'node:crypto';
          const origin='https://token.actions.githubusercontent.com';
          const address=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          address.searchParams.set('audience','guialocal:publicacion-ciudades');
          const response=await fetch(address,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!response.ok)throw Error('No se obtuvo identidad de Actions');
          const [h,p,s]=(await response.json()).value.split('.');
          const [header,claims]=[h,p].map(x=>JSON.parse(Buffer.from(x,'base64url')));
          const {keys}=await (await fetch(origin+'/.well-known/jwks')).json();
          const key=keys.find(x=>x.kid===header.kid);
          const now=Date.now()/1000;
          console.log(JSON.stringify({
            algoritmo:header.alg==='RS256',emisor:claims.iss===origin,
            audiencia:claims.aud==='guialocal:publicacion-ciudades',
            repositorio:claims.repository_id==='987998657',
            propietario:claims.repository_owner_id==='199677170',
            trabajo:claims.workflow_ref==='liqko/guia-local-dolores/.github/workflows/firebase-hosting-merge.yml@refs/heads/main',
            rama:claims.ref==='refs/heads/main',evento:claims.event_name==='workflow_dispatch',
            vigencia:Number.isSafeInteger(claims.exp)&&Number.isSafeInteger(claims.nbf)&&claims.exp>now&&claims.nbf<=now+15&&claims.exp-claims.nbf<=900,
            firma:Boolean(key&&verify('RSA-SHA256',Buffer.from(h+'.'+p),createPublicKey({key,format:'jwk'}),Buffer.from(s,'base64url')))
          }));
          JS
          node scripts/publicar-paquetes-ciudad.mjs cut hosting-public
          test -f hosting-public/plataforma/paquetes-ciudad/publicacion.json
          node --check hosting-public/plataforma/territorio-cache.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: preview
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          channelId: prueba-corte-171
          expires: 7d
          projectId: anunciantes-guialocal
      - name: Verificar que Hosting entrega los paquetes reales
        env:
          PREVIEW: ${{ steps.preview.outputs.details_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const root = 'plataforma/paquetes-ciudad/';
          const base = new URL(process.env.PREVIEW);
          const local = JSON.parse(await readFile('hosting-public/'+root+'publicacion.json'));
          async function get(path) {
            const r = await fetch(new URL(root+path,base),{signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);
            return r.json();
          }
          const live = await get('publicacion.json');
          assert.deepEqual(live,local);
          const cities = Object.entries(live.manifest);
          assert(cities.length>0);
          for (const [city,{key,revision}] of cities) {
            const file = key+'/completo-'+revision+'.json';
            const remote = await get(file);
            assert.equal(remote.city,city);
            assert.equal(remote.revision,revision);
            assert.equal(Object.keys(remote.modules).length,6);
            assert.deepEqual(remote,JSON.parse(await readFile('hosting-public/'+root+file)));
          }
          console.log('Corte verificado en '+cities.length+' ciudades y seis módulos.');
          JS
