name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "worker/**"
      - "scripts/control-integral.cjs"
      - ".github/workflows/control-integral.yml"
      - ".github/workflows/firebase-hosting-merge.yml"
      - ".github/workflows/firebase-hosting-cleanup.yml"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      recover_current:
        description: 'Recuperación excepcional con datos públicos actuales (no equivale al corte de las 01:00)'
        type: boolean
        default: false
      recover_private:
        description: 'Regenerar exclusivamente la copia privada de Gran Hermano'
        type: boolean
        default: false
  schedule:
    - cron: "21 4 * * *"
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  private_daily:
    name: Actualizar y confirmar edición diaria de Gran Hermano
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirmar la edición privada con recuperación acotada
        env:
          GLD_RECOVER_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_private && '1' || '0' }}
        run: |
          set -euo pipefail
          cutoff=$(node --input-type=module -e "import {ultimoCorte} from './scripts/aplicar-corte-paquetes-ciudad.mjs';console.log(ultimoCorte())")
          for delay in 0 10 30; do
            sleep "$delay"
            if node scripts/publicar-paquetes-ciudad.mjs private '' "$cutoff"; then exit 0; fi
          done
          exit 1
  control_integral_previo:
    name: Control de seguridad antes de publicar
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar navegador de pruebas
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Comprobar Usuario, Anunciante, Gran Hermano, recursos y navegador
        env:
          GLD_CHROME: /usr/bin/google-chrome
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          for area in usuario anunciante administrador compartido navegador; do
            node scripts/control-integral.cjs "$area"
          done
      - name: Conservar resultados si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-antes-de-firebase
          path: test-results/control-*.json
          retention-days: 14
  build_and_deploy:
    needs: [control_integral_previo]
    if: github.ref == 'refs/heads/main' && needs.control_integral_previo.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Leer alcance de la publicación aislada
        id: bloque
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ]; then exit 0; fi
          base=$(git log -1 --format='%(trailers:key=GLD-Hosting-Base,valueonly,unfold)' "$GITHUB_SHA")
          files=$(git log -1 --format='%(trailers:key=GLD-Hosting-Files,valueonly,unfold)' "$GITHUB_SHA")
          if [[ -z "$base" && -z "$files" ]]; then exit 0; fi
          [[ "$base" =~ ^[a-f0-9]{16}$ ]]
          [[ "$files" =~ ^/plataforma/[a-zA-Z0-9._/-]+(,/plataforma/[a-zA-Z0-9._/-]+)*$ ]]
          echo "base=sites/anunciantes-guialocal/versions/$base" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Verificar integridad de las páginas antes de publicar
        run: |
          node tests/publication-integrity.mjs
          node --test tests/public-territory.test.mjs tests/paquete-ciudad.test.mjs tests/observabilidad/corte-ciudad.test.mjs tests/publicacion-generica.test.mjs tests/empleo-publico-local.test.cjs
      - name: Preparar exclusivamente archivos de plataforma para Hosting
        run: |
          set -euo pipefail
          rm -rf hosting-public
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          cp plataforma/404.html hosting-public/404.html
          test -f hosting-public/404.html
          cp manifest.webmanifest hosting-public/manifest.webmanifest
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('hosting-public/manifest.webmanifest','utf8')); if(!m.start_url || !m.icons?.length) process.exit(1)"
          test -f hosting-public/plataforma/inicio.html
          test -f hosting-public/plataforma/carcasa.html
          test -f hosting-public/plataforma/administracion.html
          test "$(find hosting-public -mindepth 1 -maxdepth 1 | wc -l)" -eq 3
      - name: Detectar cambios de plataforma, sin publicar archivos idénticos
        id: codigo
        env:
          ANTERIOR: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && \
             git diff --name-only "$ANTERIOR" "$GITHUB_SHA" -- plataforma/ firebase.json manifest.webmanifest | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar el catálogo público
        id: catalogo
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js --scheduled --stage-unchanged
          else
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js --preserve
          fi
      - name: Preparar paquetes de ciudad
        id: paquetes
        env:
          GLD_STAGE_UNCHANGED: ${{ steps.catalogo.outputs.changed == 'true' && '1' || '0' }}
          GLD_REUSE_PUBLISHED: '1'
          GLD_PRIVATE_DAILY_SEPARATE: '1'
          GLD_RECOVER_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_current && '1' || '0' }}
        run: |
          export GLD_HOSTING_PLAN="$RUNNER_TEMP/gld-hosting-base.json"
          export GLD_GH_PUBLIC_SUMMARY="$RUNNER_TEMP/gld-gh-public-summary.json"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/publicar-paquetes-ciudad.mjs preserve hosting-public
          else
            node scripts/publicar-paquetes-ciudad.mjs cut hosting-public
          fi
      - name: Versionar recursos de Carcasa y sus módulos públicos
        if: steps.bloque.outputs.base != '' || steps.codigo.outputs.changed == 'true' || steps.catalogo.outputs.changed == 'true' || steps.paquetes.outputs.changed == 'true'
        run: node scripts/versionar-recursos-publicos.mjs hosting-public
      - name: Publicar la plataforma conservando el SEO instalado
        id: publicar
        if: steps.bloque.outputs.base == '' && (steps.codigo.outputs.changed == 'true' || steps.catalogo.outputs.changed == 'true' || steps.paquetes.outputs.changed == 'true')
        env:
          GLD_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gld-hosting" --no-save --package-lock=false --ignore-scripts google-auth-library@9.15.1
          export NODE_PATH="$RUNNER_TEMP/gld-hosting/node_modules"
          export GLD_HOSTING_PLAN="$RUNNER_TEMP/gld-hosting-base.json"
          node scripts/desplegar-hosting.mjs hosting-public code
      - name: Publicar el bloque aislado conservando los hashes activos
        if: steps.bloque.outputs.base != ''
        env:
          GLD_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          GLD_HOSTING_FILES: ${{ steps.bloque.outputs.files }}
          GLD_HOSTING_EXPECTED: ${{ steps.bloque.outputs.base }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gld-hosting" --no-save --package-lock=false --ignore-scripts google-auth-library@9.15.1
          export NODE_PATH="$RUNNER_TEMP/gld-hosting/node_modules"
          export GLD_HOSTING_PLAN="$RUNNER_TEMP/gld-hosting-base.json"
          stage="$RUNNER_TEMP/gld-hosting-overlay"
          IFS=, read -ra paths <<< "$GLD_HOSTING_FILES"
          for path in "${paths[@]}"; do
            [[ "$path/" != *'/../'* && "$path/" != *'/./'* ]]
            install -D "hosting-public$path" "$stage$path"
          done
          node scripts/desplegar-hosting.mjs "$stage" overlay '' "$GLD_HOSTING_EXPECTED"
      - name: Publicar sólo el índice de vigencia si los paquetes siguen iguales
        if: steps.paquetes.outputs.watermark == 'true'
        env:
          GLD_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gld-hosting" --no-save --package-lock=false --ignore-scripts google-auth-library@9.15.1
          export NODE_PATH="$RUNNER_TEMP/gld-hosting/node_modules"
          export GLD_HOSTING_PLAN="$RUNNER_TEMP/gld-hosting-base.json"
          stage="$RUNNER_TEMP/gld-hosting-watermark"
          index=plataforma/paquetes-ciudad/publicacion.json
          install -D "hosting-public/$index" "$stage/$index"
          node scripts/desplegar-hosting.mjs "$stage" watermark
      - name: Confirmar el corte publicado
        id: confirmar
        if: github.event_name != 'push' && steps.paquetes.outputs.cutoff != ''
        env:
          CORTE: ${{ steps.paquetes.outputs.cutoff }}
          GLD_PRIVATE_DAILY_SEPARATE: '1'
          GLD_VERIFY_PUBLISHED: ${{ (steps.paquetes.outputs.changed == 'true' || steps.paquetes.outputs.watermark == 'true' || steps.catalogo.outputs.changed == 'true') && '1' || '0' }}
        run: |
          set -euo pipefail
          export GLD_GH_PUBLIC_SUMMARY="$RUNNER_TEMP/gld-gh-public-summary.json"
          for delay in 0 10 30; do
            sleep "$delay"
            if node scripts/publicar-paquetes-ciudad.mjs commit hosting-public "$CORTE"; then exit 0; fi
          done
          exit 1
      - name: Preparar comprobación real del navegador
        if: steps.paquetes.outputs.changed == 'true' || github.event_name == 'push'
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Verificar paquetes y recarga en la Guía pública
        if: steps.paquetes.outputs.changed == 'true'
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/paquete-ciudad-publico.cjs
      - name: Comprobar carcasa y Eventos publicados
        if: github.event_name == 'push'
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/carcasa-eventos-consumo.cjs public
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: carcasa-eventos-publico
          path: test-results/carcasa-eventos-public.json
          retention-days: 7
      - name: Regenerar y recuperar SEO desde la edición instalada
        id: seo
        if: ${{ !cancelled() && steps.bloque.outputs.base == '' && (steps.confirmar.outcome == 'success' || steps.publicar.outcome == 'success' && github.event_name == 'push') }}
        env:
          GLD_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
        run: |
          set -euo pipefail
          if ! node --test tests/seo-publico.test.mjs; then
            echo 'SEO pendiente: falló la comprobación del generador. Se conservan la edición SEO activa y el corte confirmado.' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=SEO pendiente::No aprobaron las pruebas del generador."
            exit 1
          fi
          export NODE_PATH="$RUNNER_TEMP/gld-hosting/node_modules"
          for delay in 0 5 15; do
            stage=$(mktemp -d "$RUNNER_TEMP/gld-seo-XXXXXX")
            export GLD_HOSTING_PLAN="$stage.plan.json"
            sleep "$delay"
            if node plataforma/seo-generador.mjs "$stage" --live; then
              if [[ ! -f "$GLD_HOSTING_PLAN" ]]; then
                echo 'SEO vigente. Se conservan los archivos activos.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if npm install --prefix "$RUNNER_TEMP/gld-hosting" --no-save --package-lock=false --ignore-scripts google-auth-library@9.15.1 &&
                 node scripts/desplegar-hosting.mjs "$stage" seo; then
                echo 'SEO confirmado sobre la edición pública instalada.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "::warning title=SEO pendiente::Se mantienen las páginas vigentes. Se reintentará la generación."
          done
          echo 'SEO pendiente tras tres intentos. El corte confirmado y la edición privada se conservan. El próximo corte volverá a intentarlo.' >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=SEO pendiente::La edición SEO no pudo confirmarse. Revisá el paso SEO."
          exit 1
