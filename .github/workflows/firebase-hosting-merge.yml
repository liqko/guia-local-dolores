name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "worker/**"
      - ".github/workflows/firebase-hosting-cleanup.yml"
      - "**/*.md"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridad de las páginas antes de publicar
        run: node tests/publication-integrity.mjs
      - name: Preparar exclusivamente archivos de plataforma para Hosting
        run: |
          set -euo pipefail
          rm -rf hosting-public
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          test -f hosting-public/plataforma/inicio.html
          test -f hosting-public/plataforma/carcasa.html
          test -f hosting-public/plataforma/administracion.html
          test "$(find hosting-public -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          channelId: live
          projectId: anunciantes-guialocal
