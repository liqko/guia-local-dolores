name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "worker/**"
      - ".github/workflows/firebase-hosting-cleanup.yml"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar integridad de las páginas antes de publicar
        run: |
          node tests/publication-integrity.mjs
          node --test tests/public-territory.test.mjs tests/paquete-ciudad.test.mjs tests/observabilidad/corte-ciudad.test.mjs
      - name: Preparar exclusivamente archivos de plataforma para Hosting
        run: |
          set -euo pipefail
          rm -rf hosting-public
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          test -f hosting-public/plataforma/inicio.html
          test -f hosting-public/plataforma/carcasa.html
          test -f hosting-public/plataforma/administracion.html
          test "$(find hosting-public -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Preparar el catálogo público
        id: catalogo
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js --scheduled --stage-unchanged
          else
            node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js
          fi
      - name: Preparar paquetes de ciudad
        id: paquetes
        env:
          GLD_STAGE_UNCHANGED: ${{ steps.catalogo.outputs.changed == 'true' && '1' || '0' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/publicar-paquetes-ciudad.mjs preserve hosting-public
          else
            node scripts/publicar-paquetes-ciudad.mjs cut hosting-public
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.catalogo.outputs.changed == 'true' || steps.paquetes.outputs.changed == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          channelId: live
          projectId: anunciantes-guialocal
      - name: Preparar comprobación real del navegador
        if: steps.paquetes.outputs.changed == 'true'
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Verificar paquetes y recarga en la Guía pública
        if: steps.paquetes.outputs.changed == 'true'
        run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/paquete-ciudad-publico.cjs
      - name: Confirmar el corte publicado
        if: github.event_name != 'push' && steps.paquetes.outputs.cutoff != ''
        env:
          CORTE: ${{ steps.paquetes.outputs.cutoff }}
        run: node scripts/publicar-paquetes-ciudad.mjs commit hosting-public "$CORTE"
