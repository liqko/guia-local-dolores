name: Medir apertura pública de la Guía
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  medicion:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/guia-publica-enlaces-livianos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar catálogos de prueba
        run: |
          node --test tests/public-territory.test.mjs tests/guide-links.test.mjs
          node tests/publication-integrity.mjs
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js
          node scripts/prepare-guide-links.mjs hosting-public/plataforma/territorio-cache.js hosting-public/plataforma/guia-enlaces --scheduled
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: preview
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          projectId: anunciantes-guialocal
          channelId: guia-enlaces-livianos
          expires: 1d
      - run: npm install --no-save --package-lock=false playwright
      - name: Comparar las primeras aperturas en Chrome
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          const worker='login.liqkoargentina.workers.dev';
          const params=new URLSearchParams({ciudad_id:'DOL (BUE - ARG)',pais_id:'ARG',provincia_id:'BUE',pais:'ARGENTINA',provincia:'BUENOS AIRES',ciudad:'DOLORES'});
          const sections=new Set(['/events-new','/promos','/actividades']);
          try{
           for(const [mode,host] of [['produccion','https://www.guialocal.ar'],['prueba',process.env.PREVIEW_URL]]){
            const context=await browser.newContext();
            const page=await context.newPage();
            const requests=[];
            context.on('response',res=>{const u=new URL(res.url());if(u.hostname===worker||u.pathname.startsWith('/plataforma/guia-enlaces/'))requests.push({path:u.pathname,response:res});});
            const open=await page.goto(new URL('/descubrir?'+params,host).href,{waitUntil:'domcontentloaded',timeout:20000});
            assert.equal(open?.status(),200);
            const cards=page.frameLocator('#moduloCentralFrame').locator('#contenedor');
            await cards.waitFor({state:'attached',timeout:15000});
            await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});
            assert.ok((await cards.textContent()).trim(),'La Guía muestra fichas');
            const stats={requests:0,sql:0,kv:0,fs:0,missing:0};
            const ids=new Set(), paths=[];
            let bytes=null;
            for(const {path,response} of requests){
             if(path.startsWith('/plataforma/guia-enlaces/')){
              assert.equal(response.status(),200);
              const body=await response.body();
              bytes=body.length;
              assert.equal(JSON.parse(body).city,params.get('ciudad_id'));
              continue;
             }
             const h=response.headers(),id=h['x-gld-request-id'];
             if(id&&ids.has(id))continue;
             if(id)ids.add(id);
             paths.push(path);
             stats.requests++;
             let c;
             try{c=JSON.parse(decodeURIComponent(h['x-gld-consumption']));}catch{}
             if(!c){stats.missing++;continue;}
             stats.sql+=c.cloudflare.public_store.rows_read;
             stats.kv+=c.cloudflare.kv.get_calls+c.cloudflare.public_store.legacy_gets;
             stats.fs+=c.firestore.read_calls+c.firestore.write_calls+c.firestore.delete_calls;
            }
            console.log('GLD_APERTURA '+JSON.stringify({mode,paths,stats,compactBodyBytes:bytes}));
            if(mode==='prueba'){
             assert.ok(bytes!==null,'Se cargó el índice de enlaces');
             assert.deepEqual(paths.filter(p=>sections.has(p)),[],'La apertura no baja los tres módulos');
            }
            await context.close();
           }
          }finally{await browser.close();}
          JS
