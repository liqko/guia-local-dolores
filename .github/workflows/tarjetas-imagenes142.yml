name: Verify deferred card images
on:
  push:
    branches: [fix/tarjetas-imagenes142]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright
      - run: node tests/publication-integrity.mjs
      - run: node tests/tarjetas-imagenes142/logic.cjs
      - run: node tests/tarjetas-imagenes142/run.cjs
