name: Limpiar versiones antiguas de Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-hosting-cleanup.yml
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar acceso a Firebase
        run: python -m pip install --quiet google-auth requests
      - name: Conservar la plataforma activa y limpiar historial
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
        run: |
          python - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          site = 'anunciantes-guialocal'
          info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/firebase.hosting'])
          credentials.refresh(Request())
          session = requests.Session()
          session.headers.update({'Authorization': 'Bearer '+credentials.token,
                                  'Content-Type':'application/json'})
          base = 'https://firebasehosting.googleapis.com/v1beta1/sites/'+site
          def request(method, path, **kwargs):
              response = session.request(method, base+path, timeout=30, **kwargs)
              if response.status_code >= 400:
                  raise RuntimeError(method+' '+path+': '+str(response.status_code)+' '+response.text[:500])
              return response.json() if response.content else {}

          live = request('GET','/channels/live')
          original = live.get('release',{}).get('version',{}).get('name')
          if not original:
              raise RuntimeError('No se encontró versión activa: limpieza cancelada')
          print('Versión activa protegida:',original)
          result = request('PATCH','/channels/live?updateMask=retainedReleaseCount',
                           json={'retainedReleaseCount':1})
          if result.get('retainedReleaseCount') != 1:
              raise RuntimeError('No se confirmó límite de 1 versión anterior')
          print('Historial live limitado a una versión anterior (mínimo admitido por Firebase)')

          for channel in ('guia-recarga-50','prueba-sin-jimdo'):
              response = session.get(base+'/channels/'+channel,timeout=30)
              if response.status_code == 404:
                  print('Canal ya ausente:',channel)
                  continue
              response.raise_for_status()
              item = response.json()
              if item.get('name','').split('/')[-1] != channel:
                  raise RuntimeError('Identidad de canal inesperada')
              request('DELETE','/channels/'+channel)
              print('Canal de prueba eliminado:',channel)

          after = request('GET','/channels/live')
          current = after.get('release',{}).get('version',{}).get('name')
          if current != original:
              print('La versión activa cambió durante la tarea; verificar nueva publicación.')
          else:
              print('Versión activa intacta:',current)
          print('Retención confirmada:',after.get('retainedReleaseCount'))
          PY
