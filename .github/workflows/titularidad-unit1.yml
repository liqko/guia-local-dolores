name: Unidad 1 - Titularidad y permisos (sin publicar)
on:
  push:
    branches: [feature/anunciantes-titularidad-20261127]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --input-type=module --check < worker/worker206.txt
      - run: node --test tests/roles159/titularidad.test.cjs
      - run: node tests/publication-integrity.mjs
      - run: node --test tests/observabilidad/acceso-unificado201.test.mjs tests/observabilidad/roles-cache192.test.mjs
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/roles159/integration.mjs
      - run: node tests/guia/verify-panel-roles.mjs
      - run: node tests/guia/copia-persistente209.mjs
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom@26
      - run: node tests/roles159/ui.cjs
  editor_types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false typescript@5.9.3
      - name: Check every ownership call against the JavaScript editor type checker
        run: |
          cp worker/worker206.txt /tmp/gld-worker.mjs
          node --input-type=commonjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),assert=require('node:assert/strict');
          const file='/tmp/gld-worker.mjs';
          const options={allowJs:true,checkJs:true,noEmit:true,target:ts.ScriptTarget.ESNext,module:ts.ModuleKind.ESNext,skipLibCheck:true};
          const program=ts.createProgram([file],options);
          const source=program.getSourceFile(file),text=source.text,targets=[];
          function visit(n){
            if(ts.isCallExpression(n)&&n.expression.getText(source)==='commitOwnership155')targets.push(n);
            ts.forEachChild(n,visit);
          }
          visit(source);
          assert.equal(targets.length,4);
          const diagnostics=ts.getPreEmitDiagnostics(program).filter(d=>d.file===source&&targets.some(n=>d.start>=n.getStart(source)&&d.start<n.end));
          for(const d of diagnostics)console.error(ts.flattenDiagnosticMessageText(d.messageText,' '));
          assert.equal(diagnostics.length,0,'Cloudflare-style JS editor diagnostics on the four ownership calls');
          console.log('PASS four ownership calls, zero editor type diagnostics');
          NODE
