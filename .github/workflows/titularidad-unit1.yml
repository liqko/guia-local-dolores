name: Unidad 1 - Titularidad y permisos (sin publicar)
on:
  push:
    branches: [feature/anunciantes-titularidad-20261127]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --input-type=module --check < worker/worker206.txt
      - run: node --test tests/roles159/titularidad.test.cjs tests/anunciantes/*.test.cjs
      - run: node tests/publication-integrity.mjs
      - run: node --test tests/observabilidad/acceso-unificado201.test.mjs tests/observabilidad/roles-cache192.test.mjs
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/roles159/integration.mjs
      - run: node tests/guia/verify-panel-roles.mjs
      - run: node tests/guia/copia-persistente209.mjs
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom@26
      - run: node tests/roles159/ui.cjs
  editor_types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false typescript@5.9.3
      - name: Check the complete Worker against the JavaScript editor type checker
        run: node tests/worker/diagnosticos-editor.cjs worker/worker206.txt
