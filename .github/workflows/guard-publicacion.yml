name: Contrato transversal de publicación y regresiones
on:
  push:
    branches: [main]
    paths:
      - 'worker/worker206.txt'
      - 'plataforma/actividades.html'
      - 'tests/publicacion-reglas206.test.cjs'
      - 'tests/anunciante-formularios/**'
      - 'tests/guia/worker-instrumentado.mjs'
      - 'tests/guia/verify-panel-roles.mjs'
      - '.github/workflows/guard-publicacion.yml'
  pull_request:
    paths:
      - 'worker/worker206.txt'
      - 'plataforma/actividades.html'
      - 'tests/publicacion-reglas206.test.cjs'
      - 'tests/anunciante-formularios/**'
      - 'tests/guia/worker-instrumentado.mjs'
      - 'tests/guia/verify-panel-roles.mjs'
      - '.github/workflows/guard-publicacion.yml'
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sintaxis de Worker 206
        run: node --check --input-type=module < worker/worker206.txt
      - name: Reglas y circuito de publicación
        run: node --test tests/publicacion-reglas206.test.cjs
      - name: Corte, paquete ciudad y compatibilidad de publicación
        run: node --test tests/paquete-ciudad.test.mjs tests/publicacion-generica.test.mjs tests/eventos-paquete.test.cjs
      - name: Copia compartida, guardados y configuración actual
        run: node --test tests/anunciante-formularios/*.test.mjs tests/observabilidad/acceso-unificado201.test.mjs tests/observabilidad/roles-cache192.test.mjs
      - name: Ingreso y alternancia entre anunciantes, roles y niveles
        run: node tests/guia/verify-panel-roles.mjs
