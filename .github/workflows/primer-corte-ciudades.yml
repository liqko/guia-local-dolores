name: Ejecutar primer corte de ciudades
on:
  push:
    branches: [ops/primer-corte-171]
    paths: [.github/workflows/primer-corte-ciudades.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar el trabajo autorizado en main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/actions/workflows/firebase-hosting-merge.yml/dispatches" -f ref=main
