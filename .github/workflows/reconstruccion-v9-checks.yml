name: Reconstruccion V9 checks

on:
  push:
    branches:
      - reconstruccion-total-03oct
    paths:
      - "reconstruccion/worker/**"
      - "reconstruccion/auditoria/AUDITAR_V9.mjs"
      - ".github/workflows/reconstruccion-v9-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        working-directory: reconstruccion/worker
        run: npm run check:syntax

      - name: Architecture audit
        run: node reconstruccion/auditoria/AUDITAR_V9.mjs
