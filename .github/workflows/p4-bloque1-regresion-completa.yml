name: P4 bloque 1 regresion completa
on:
  push:
    branches: [release/p4-bloque1-publico-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regresion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Favoritos y enlaces contra funciones reales con API simulada
        run: node --test tests/paso4-bloque1-publico.test.cjs
      - name: Integridad de publicacion
        run: node tests/publication-integrity.mjs
