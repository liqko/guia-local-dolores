name: Worker - diagnósticos del editor (completo)
on:
  push:
    paths: ['worker/**', 'tests/worker/**', '.github/workflows/worker-diagnosticos.yml']
  pull_request:
    paths: ['worker/**', 'tests/worker/**', '.github/workflows/worker-diagnosticos.yml']
permissions:
  contents: read
jobs:
  diagnosticos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false typescript@5.9.3
      - run: node tests/worker/diagnosticos-editor.cjs worker/worker206.txt
