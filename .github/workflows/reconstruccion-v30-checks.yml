name: Reconstruccion V30 checks

on:
  push:
    branches:
      - reconstruccion-total-03oct
    paths:
      - "reconstruccion/worker/**"
      - "reconstruccion/plataforma/**"
      - "reconstruccion/auditoria/AUDITAR_V30.mjs"
      - "reconstruccion/auditoria/TEST_FARMACIAS_V30.mjs"
      - ".github/workflows/reconstruccion-v30-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check reconstruccion/worker/app-main-v30.js
          node --check reconstruccion/worker/routes/panel-v15.js
          node --check reconstruccion/worker/routes/public-v12.js
          node --check reconstruccion/worker/modules/farmacias-v3.js
          node --check reconstruccion/worker/modules/farmacias-public-v3.js
          node --check reconstruccion/worker/modules/efemerides-v3.js
          node --check reconstruccion/worker/modules/publicidad-v4.js
          node --check reconstruccion/worker/modules/actividades-v3.js
      - name: Integrated architecture audit
        run: node reconstruccion/auditoria/AUDITAR_V30.mjs
      - name: Farmacias rotation test
        run: node reconstruccion/auditoria/TEST_FARMACIAS_V30.mjs
