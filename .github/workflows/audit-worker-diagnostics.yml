name: Worker login diagnostics (isolated)
on:
  push:
    branches:
      - 'audit/worker-diagnosticos-20261110'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated analysis tools
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3 esbuild@0.25.12
      - name: Analyze Worker 176 without executing handlers
        run: node auditorias/worker-login-analyzer.cjs | tee worker-diagnostics.log
      - name: Validate Cloudflare Workers bundle without deploy
        run: |
          cp auditorias/worker177_base_snapshot.txt /tmp/gld-login-before.js
          cp auditorias/worker177_diagnosticos_corregidos.txt /tmp/gld-login-after.js
          npx --yes wrangler@4 deploy /tmp/gld-login-before.js --name login-audit-before --compatibility-date 2026-11-10 --dry-run --outdir /tmp/gld-before-bundle
          npx --yes wrangler@4 deploy /tmp/gld-login-after.js --name login-audit-after --compatibility-date 2026-11-10 --dry-run --outdir /tmp/gld-after-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-login-diagnostics
          path: |
            worker-diagnostics.log
            worker-diagnostics.json
