name: Contrato de arquitectura diaria
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'tests/arquitectura/**'
      - 'tests/observabilidad/**'
      - '.github/workflows/arquitectura-diaria.yml'
  push:
    branches: ['fix/arquitectura-diaria-transversal-20261113']
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/arquitectura-diaria.yml'
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar sintaxis, contrato, seguridad y compatibilidad
        run: |
          node --check --input-type=module < worker/worker206.txt
          node --test tests/anunciante-formularios/contratos-compartidos.test.mjs tests/arquitectura/contrato206.test.mjs tests/arquitectura/diaria206.test.mjs tests/arquitectura/outbox206.test.mjs tests/observabilidad/suscriptores-diario195.test.mjs tests/observabilidad/acceso-unificado201.test.mjs tests/observabilidad/roles-cache192.test.mjs tests/observabilidad/configuracion-compartida192.test.mjs tests/observabilidad/ingreso-cliente195.test.mjs tests/observabilidad/corte-ciudad.test.mjs tests/publicacion-generica.test.mjs tests/public-territory.test.mjs tests/paquete-ciudad.test.mjs tests/publication-integrity.mjs
      - name: Instalar entorno aislado de Workers
        run: npm install --prefix /tmp/gld-runtime206 --no-save --package-lock=false miniflare@4.20260730.0
      - name: Comprobar las rutas reales y dos cortes con SQLite y KV persistentes
        run: GLD_MINIFLARE=/tmp/gld-runtime206/node_modules/miniflare/dist/src/index.js node --test tests/arquitectura/runtime206.test.mjs
