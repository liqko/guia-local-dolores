name: Promos Eventos V24 checks

on:
  push:
    branches:
      - reconstruccion-total-03oct
    paths:
      - "reconstruccion/worker/**"
      - "reconstruccion/plataforma/login-modular-v7.html"
      - "reconstruccion/auditoria/AUDITAR_PROMOS_EVENTOS_V24.mjs"
      - ".github/workflows/promos-eventos-v24-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check reconstruccion/worker/app-main-v24.js
          node --check reconstruccion/worker/routes/panel-v11.js
          node --check reconstruccion/worker/modules/promos-v2.js
          node --check reconstruccion/worker/modules/eventos-v3.js
      - name: Audit
        run: node reconstruccion/auditoria/AUDITAR_PROMOS_EVENTOS_V24.mjs
