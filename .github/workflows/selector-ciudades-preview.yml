name: Verificar selector público de ciudades
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  selector:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/selector-ciudades-sin-vencimiento' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar catálogo y ejecutar pruebas
        run: |
          node --test tests/public-territory.test.mjs
          node tests/publication-integrity.mjs
          mkdir -p hosting-public
          cp -a plataforma hosting-public/plataforma
          node scripts/prepare-public-territory.mjs hosting-public/plataforma/territorio-cache.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: preview
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUNCIANTES_GUIALOCAL }}
          projectId: anunciantes-guialocal
          channelId: selector-ciudades
          expires: 1d
      - run: npm install --no-save --package-lock=false playwright
      - name: Comprobar selector en Chrome
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const url=new URL('/elegi-tu-ciudad?cambiar_ciudad=1',process.env.PREVIEW_URL);
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome'});
          try {
           const context=await browser.newContext();
           const page=await context.newPage();
           const calls=[];
           context.on('request', req=>{
            const target=new URL(req.url());
            if(target.hostname==='login.liqkoargentina.workers.dev'&&target.pathname==='/territory/public')calls.push(req.method());
           });
           const search=page.locator('#buscarCiudad');
           for(const step of ['apertura','recarga']){
            if(step==='apertura')await page.goto(url.href);
            else await page.reload();
            await search.fill('Dolores');
            await page.locator('#resultados button').filter({hasText:/Dolores/i}).click();
            assert.equal(await page.locator('#entrar').isEnabled(),true);
           }
           assert.equal(calls.length,0,'El selector no consulta a Cloudflare en la apertura, la recarga ni la elección');
           console.log('GLD_CIUDADES 2 aperturas verificadas, Dolores seleccionable, 0 solicitudes al catálogo Worker');
          } finally { await browser.close(); }
          JS
