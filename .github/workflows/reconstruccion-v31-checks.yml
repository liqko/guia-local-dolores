name: Reconstruccion V31 checks

on:
  push:
    branches:
      - reconstruccion-total-03oct
    paths:
      - "reconstruccion/worker/app-main-v31.js"
      - "reconstruccion/worker/routes/admin-v11.js"
      - "reconstruccion/worker/routes/admin-v3.js"
      - "reconstruccion/worker/modules/moderacion-general-v3.js"
      - "reconstruccion/plataforma/granhermano-v2.html"
      - "reconstruccion/auditoria/AUDITAR_V31.mjs"
      - ".github/workflows/reconstruccion-v31-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check reconstruccion/worker/app-main-v31.js
          node --check reconstruccion/worker/routes/admin-v11.js
          node --check reconstruccion/worker/modules/moderacion-general-v3.js
      - name: Audit
        run: node reconstruccion/auditoria/AUDITAR_V31.mjs
