name: Comprobar SEO público
on:
  pull_request:
    paths:
      - 'plataforma/seo-generador.mjs'
      - 'tests/seo-publico.test.mjs'
      - '.github/workflows/seo-publico.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar páginas y sitemap de prueba
        run: node --test tests/seo-publico.test.mjs
