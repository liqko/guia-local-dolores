name: Accesos directos de WhatsApp
on:
  pull_request:
    paths:
      - 'plataforma/login.html'
      - 'plataforma/suscriptores.html'
      - 'firebase.json'
      - 'tests/reclamo-directo.cjs'
      - 'tests/browser/reclamo-directo.cjs'
      - '.github/workflows/accesos-directos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false jsdom@26 playwright@1.55.0
      - run: node tests/publication-integrity.mjs
      - run: node tests/reclamo-directo.cjs
      - run: GLD_CHROME="$(command -v google-chrome)" node tests/browser/reclamo-directo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accesos-directos
          path: test-results/reclamo-directo*.json
          retention-days: 7
