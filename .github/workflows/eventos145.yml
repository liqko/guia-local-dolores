name: Verify event scope forms
on:
  push:
    branches: [fix/eventos-alcance145]
    paths: [plataforma/login.html, plataforma/contenido-adulto.js, plataforma/publicacion-pedidos.js, plataforma/granhermano.html, worker/events-ui145.fragment.js, tests/eventos145/browser.cjs, tests/eventos145/client.cjs, .github/workflows/eventos145.yml]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright
      - run: node tests/publication-integrity.mjs
      - run: node tests/eventos145/client.cjs
      - run: node tests/eventos145/browser.cjs
