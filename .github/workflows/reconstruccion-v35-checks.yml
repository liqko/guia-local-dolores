name: Reconstruccion V35 checks

on:
  push:
    branches:
      - reconstruccion-total-03oct
    paths:
      - "reconstruccion/**"
      - ".github/workflows/reconstruccion-v35-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and imports
        run: node reconstruccion/auditoria/AUDITAR_IMPORTS_V32.mjs reconstruccion/worker/app-main-v35.js
      - name: Previous checks
        run: |
          node reconstruccion/auditoria/AUDITAR_SUSCRIPTORES_V22.mjs
          node reconstruccion/auditoria/AUDITAR_COMMERCE_V23.mjs
          node reconstruccion/auditoria/AUDITAR_PROMOS_EVENTOS_V24.mjs
          node reconstruccion/auditoria/AUDITAR_V30.mjs
          node reconstruccion/auditoria/AUDITAR_V31.mjs
          node reconstruccion/auditoria/TEST_FARMACIAS_V30.mjs
      - name: Carcasa and public guide integration
        run: node reconstruccion/auditoria/TEST_CARCASA_V32.mjs
      - name: Mutations and moderation integration
        run: node reconstruccion/auditoria/TEST_MUTACIONES_V33.mjs
      - name: Subscribers and mail contract
        run: node reconstruccion/auditoria/TEST_SUSCRIPTORES_V34.mjs
      - name: Existing workflow and image mutations
        run: |
          node reconstruccion/auditoria/TEST_FLUJO_EXISTENTE_V35.mjs
          node reconstruccion/auditoria/AUDITAR_HTML_V35.mjs
      - name: Public and advertiser operation isolation
        run: |
          node reconstruccion/auditoria/TEST_AISLAMIENTO_PUBLICO_V36.mjs
          node reconstruccion/auditoria/TEST_AISLAMIENTO_COMMERCE_V36.mjs
          node reconstruccion/auditoria/TEST_AISLAMIENTO_PROMOS_V36.mjs
          node reconstruccion/auditoria/TEST_AISLAMIENTO_MODULOS_V37.mjs
          node reconstruccion/auditoria/TEST_AISLAMIENTO_SUSCRIPTORES_V37.mjs
          node reconstruccion/auditoria/TEST_AISLAMIENTO_ADMIN_V37.mjs
          node reconstruccion/auditoria/TEST_FIRESTORE_PATCH_V37.mjs
          node reconstruccion/auditoria/TEST_PREPARACION_KV_V37.mjs
      - name: Install test browser
        run: |
          npm install --prefix /tmp/gld-ui --no-save playwright@1.62.1
          node /tmp/gld-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser integration desktop and mobile
        env:
          GLD_PLAYWRIGHT_MODULE: /tmp/gld-ui/node_modules/playwright
        run: |
          node reconstruccion/auditoria/TEST_VISUAL_V34.mjs
          node reconstruccion/auditoria/TEST_PANEL_VISUAL_V35.mjs
          node reconstruccion/auditoria/TEST_ADMIN_VISUAL_V37.mjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-v35
          path: |
            /tmp/gld-v34-ui
            /tmp/gld-v35-ui
            /tmp/gld-v37-ui
