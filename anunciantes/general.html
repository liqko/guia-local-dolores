              </div>`;
            container.appendChild(modal);
            const imgWrap = modal.querySelector('.img-wrap');
            const indicador = modal.querySelector('.indicador');
            const btnCerrar = modal.querySelector('.cerrar-modal');
            const btnIzq = modal.querySelector('.flecha-modal.izq');
            const btnDer = modal.querySelector('.flecha-modal.der');

            function show(index) {
              current = ((index % imagenes.length) + imagenes.length) % imagenes.length;
              const url = imagenes[current];
              imgWrap.innerHTML = '';
              const img = document.createElement('img');
              img.src = url; img.alt = 'Imagen'; img.style.maxWidth = '100%'; img.style.maxHeight = '80vh';
              imgWrap.appendChild(img);
              indicador.textContent = `${current + 1} / ${imagenes.length}`;
              if (imagenes.length <= 1) { btnIzq.style.display = 'none'; btnDer.style.display = 'none'; }
              else { btnIzq.style.display = 'flex'; btnDer.style.display = 'flex'; }
            }
            function close() { try { modal.remove(); } catch(e) {} document.removeEventListener('keydown', keyHandler); }
            btnCerrar.addEventListener('click', function(e){ e.stopPropagation(); close(); });
            btnIzq.addEventListener('click', function(e){ e.stopPropagation(); show(current - 1); });
            btnDer.addEventListener('click', function(e){ e.stopPropagation(); show(current + 1); });
            modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
            function keyHandler(e){ if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(current - 1); else if (e.key === 'ArrowRight') show(current + 1); }
            document.addEventListener('keydown', keyHandler);
            show(current);
          } catch (err) { console.warn('mostrarModalGaleria error', err); }
        };

        function canonicalSegmentoIds(item) {
          const rawParts = [
            item && item.segmento_id,
            item && item.segmento
          ]
            .filter(Boolean)
            .flatMap(v => String(v).split(/[;,|]+/))
            .map(v => String(v).trim())
            .filter(Boolean);

          const ids = [];

          rawParts.forEach(raw => {
            const rawNorm = normalizar(raw);

            const found = (catalogosGlobales.segmentos || []).find(s => {
              const sid = String(s.segmento_id || '').trim();
              const snombre = normalizar(s.nombre || '');
              return sid === raw || snombre === rawNorm;
            });

            if(found && found.segmento_id){
              ids.push(String(found.segmento_id).trim());
            } else {
              ids.push(raw);
            }
          });

          return [...new Set(ids)];
        }

        function canonicalCategoriaIds(item) {
          const rawParts = [
            item && item.categoria_id,
            item && item.categoria
          ]
            .filter(Boolean)
            .flatMap(v => String(v).split(/[;,|]+/))
            .map(v => String(v).trim())
            .filter(Boolean);

          const ids = [];

          rawParts.forEach(raw => {
            const rawNorm = normalizar(raw);

            const found = (catalogosGlobales.categorias || []).find(c => {
              const cid = String(c.categoria_id || '').trim();
              const cnombre = normalizar(c.nombre || '');
              return cid === raw || cnombre === rawNorm;
            });

            if(found && found.categoria_id){
              ids.push(String(found.categoria_id).trim());
            } else {
              ids.push(raw);
            }
          });

          return [...new Set(ids)];
        }

        function sedeNombreVisible(nombre){
          const raw=String(nombre||'').trim();
          if(!raw) return '';
          const n=normalizar(raw);
          if(n==='sede' || n==='sede principal') return '';
          return raw;
        }

        function sedeActIds(sede){
          return ((((sede||{}).relaciones||{}).actividades)||[])
            .map(x=>String(x.actividad_id||'').trim()).filter(Boolean);
        }
        function sedeAccIds(sede){
          return ((((sede||{}).relaciones||{}).acciones)||[])
            .map(x=>String(x.accion_id||'').trim()).filter(Boolean);
        }

        function sedeCumpleSegundoFiltro(sede,filtro){
          filtro=String(filtro||'').trim();
          if(!filtro) return true;
          if(filtro.startsWith('ACT:')) return sedeActIds(sede).includes(filtro.slice(4));
          if(filtro.startsWith('ACC:')) return sedeAccIds(sede).includes(filtro.slice(4));
          return true;
        }

        function tarjetaDeSede(item,sede){
          const out=Object.assign({},item);
          out.__sede_individual=true;
          out.sedes=[sede];

          [
            'telefono','telefono2','telefono3','telefono4','telefono5',
            'whatsapp','whatsapp2','whatsapp3','whatsapp4','whatsapp5',
            'mail','mail2','mail3','instagram','facebook','youtube','tiktok','linkedin'
          ].forEach(k=>out[k]=(sede&&sede[k])||'');

          for(let i=1;i<=10;i++) out['img'+i]=(sede&&sede['img'+i])||'';

          const rel=(sede&&sede.relaciones)||{};
          out.actividades_clave=Array.isArray(rel.actividades)?rel.actividades:[];
          out.acciones=Array.isArray(rel.acciones)?rel.acciones:[];
          out.nodos=Array.isArray(rel.nodos)?rel.nodos:[];

          out.direccion=(sede&&sede.direccion)||'';
          out.maps=(sede&&sede.maps)||'';
          out.lat=(sede&&sede.lat)||'';
          out.lng=(sede&&sede.lng)||'';
          out.ciudad=(sede&&sede.ciudad)||'';
          return out;
        }

        function textoGlobalItem(item){
          return [
            item.nombre,item.segmento,item.categoria,item.actividad,item.tags,item.adicionales,
            item.descripcion,item.link,
            ...(item.actividades_clave||[]).map(x=>x&&x.nombre),
            ...(item.acciones||[]).map(x=>x&&x.nombre),
            ...(item.nodos||[]).map(x=>x&&x.nombre),
            ...(item.sedes||[]).flatMap(s=>[s&&s.nombre_sede,s&&s.direccion,s&&s.ciudad,s&&s.provincia,s&&s.pais])
          ].filter(Boolean).join(' ');
        }

        function render() {
          const qGlobal=normalizar(buscadorGlobal.value.trim());
          const clasificacion=String(selectClasificacion.value||'').trim();
          const accionesElegidas=accionesSeleccionadas();

          let base=serviciosData.filter(item=>{
            if(clasificacion.startsWith('SEG:')){
              return canonicalSegmentoIds(item).includes(clasificacion.slice(4));
            }
            if(clasificacion.startsWith('CAT:')){
              // Un anunciante con varias categorías aparece en CADA categoría que tenga.
              return canonicalCategoriaIds(item).includes(clasificacion.slice(4));
            }
            return true;
          });

          if(clasificacion || accionesElegidas.length || qGlobal){
            base=base.flatMap(item=>{
              const sedes=Array.isArray(item.sedes)?item.sedes:[];
              const requiereSede=clasificacion.startsWith('ACT:') || accionesElegidas.length>0;

              if(!sedes.length) return requiereSede ? [] : [item];

              return sedes
                .filter(sede=>{
                  if(clasificacion.startsWith('ACT:') && !sedeActIds(sede).includes(clasificacion.slice(4))) return false;

                  const accionesSede=sedeAccIds(sede);
                  if(accionesElegidas.some(id=>!accionesSede.includes(id))) return false;

                  return true;
                })
                .map(sede=>tarjetaDeSede(item,sede));
            });
          }

          let filtrados=base.filter(item=>{
            if(!qGlobal) return true;
            return normalizar(textoGlobalItem(item)).includes(qGlobal);
          }).sort((a,b)=>{
            if(Number(b.nivel)!==Number(a.nivel)) return Number(b.nivel)-Number(a.nivel);
            return Number(a.subnivel)-Number(b.subnivel);
          });

          const destacadas=(paginaActual===1)?getDestacadas(filtrados):[];
          const normales=filtrados.filter(item=>!(Number(item.nivel)===6));
          totalPaginas=Math.max(1,Math.ceil(normales.length/resultadosPorPagina));
          if(paginaActual>totalPaginas) paginaActual=totalPaginas;
          if(paginaActual<1) paginaActual=1;

          const inicio=(paginaActual-1)*resultadosPorPagina;
          const fin=inicio+resultadosPorPagina;
          const normalesPaginadas=normales.slice(inicio,fin);

          btnAnterior.disabled=paginaActual===1;
          btnSiguiente.disabled=paginaActual===totalPaginas;
          buildPaginationBar(paginationBar);

          renderDestacadas(destacadas);
          renderNormales(normalesPaginadas,destacadas.length);
        }

        buscadorGlobal.addEventListener('input', () => {
          paginaActual = 1;
          render();
        });

        // Primer render: sólo con los datos de la guía.
        render();

        // Segundo plano: al terminar eventos/promos/banners, se enriquecen las tarjetas
        // sin haber bloqueado la primera visualización.
        Promise.all([bannersPromise, eventsPromise, promosPromise])
          .then(([bannersLoaded, eventsLoaded, promosLoaded]) => {
            rawBanners = Array.isArray(bannersLoaded) ? bannersLoaded : [];
            rawEventsResponse = eventsLoaded || [];
            rawPromosResponse = promosLoaded || [];

            if (rawBanners.length) {
              banners = rawBanners
                .filter(b => {
                  const apr = (b.aprobado !== undefined) ? String(b.aprobado).trim().toLowerCase() : '';
                  return apr === 'true' || apr === '1' || apr === 'x';
                })
                .map(b => ({
                  img: (b.img || b.url || '').trim(),
                  media: (b.media || '').trim(),
                  cta: (b.cta || '').trim(),
                  poster: (b.poster || '').trim()
                }));
            }

            rawEventsList = Array.isArray(rawEventsResponse)
              ? rawEventsResponse
              : ((rawEventsResponse && (rawEventsResponse.data || rawEventsResponse.events)) || []);
            activeEvents = rawEventsList.filter(eventIsActive);

            rawPromosList = Array.isArray(rawPromosResponse)
              ? rawPromosResponse
              : ((rawPromosResponse && (rawPromosResponse.promos || rawPromosResponse.data || rawPromosResponse.rows)) || []);
            activePromos = rawPromosList.filter(p => promoIsActive(p) && promoMatchesCurrentCity(p));

            render();
          })
          .catch(err => console.warn('Carga secundaria incompleta:', err));

        window.addEventListener('scroll', () => {
          const topBtn = document.getElementById('topBtn');
          if (window.scrollY > 200) topBtn.style.display = 'flex';
          else topBtn.style.display = 'none';
        }, { passive: true });

      } catch(e) {
        console.error('Error cargando datos:', e);
        const cont = document.getElementById('contenedor');
        if(cont) cont.innerHTML = '<div class="no-tags-msg">No se pudo cargar la guía.</div>';
      }
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(id && nombre) {
          const op = document.createElement('option');
          op.value = id;
          op.textContent = nombre;
          select.appendChild(op);
        }
      });
    }

    async function cargarUbicaciones() {
      const data = await jsonpApi({action:'ubicaciones'}, 15000);
      if(!data || data.success !== true) {
        throw new Error((data && (data.error || data.message)) || 'Ubicaciones inválidas');
      }
      return data;
    }

    function iniciarBootstrapCompleto(){
      if(!bootstrapCompletoPromise){
        bootstrapCompletoPromise = jsonpApi({action:'bootstrap'}, 30000)
          .then(data=>{
            if(!data || data.success !== true){
              throw new Error((data && (data.error || data.message)) || 'Bootstrap inválido');
            }

            catalogosGlobales.segmentos = Array.isArray(data.segmentos) ? data.segmentos : [];
            catalogosGlobales.segmentosPublicos = Array.isArray(data.segmentos_publicos)
              ? data.segmentos_publicos
              : catalogosGlobales.segmentos.filter(s => {
                  const v = String(s.visible_publico ?? '').trim().toLowerCase();
                  return v === 'true' || v === '1' || v === 'x' || v === 'si' || v === 'sí';
                });
            catalogosGlobales.categorias = Array.isArray(data.categorias) ? data.categorias : [];
            catalogosGlobales.actividades = Array.isArray(data.actividades_clave) ? data.actividades_clave : [];
            catalogosGlobales.acciones = Array.isArray(data.acciones) ? data.acciones : [];
            catalogosGlobales.nodos = Array.isArray(data.nodos) ? data.nodos : [];
            relacionesSedesGlobales = (data.relaciones_sedes && typeof data.relaciones_sedes === 'object') ? data.relaciones_sedes : {};
            metaPorIdGlobal = (data.meta_por_id && typeof data.meta_por_id === 'object') ? data.meta_por_id : {};
            return data;
          })
          .catch(err=>{
            bootstrapCompletoPromise = null;
            throw err;
          });
      }
      return bootstrapCompletoPromise;
    }

    function normId(v){
      return String(v || '').trim().toLowerCase();
    }

    function opciones(select, rows, idField) {
      const placeholder = select.options[0]
        ? select.options[0].outerHTML
        : '<option value="">Seleccionar</option>';

      select.innerHTML = placeholder;

      (rows || []).forEach(r => {
        const id = String(r[idField] || '').trim();
        const nombre = String(r.nombre || '').trim();
        if(!id || !nombre) return;

        const op = document.createElement('option');
        op.value = id;
        op.textContent = nombre;
        select.appendChild(op);
      });
    }

    function perteneceAProvincia(provincia, paisSeleccionado, paises){
      const ref = normId(provincia && (provincia.pais_id || provincia.pais));
      if(!ref) return false;

      const pais = (paises || []).find(p => normId(p.pais_id) === normId(paisSeleccionado));
      if(!pais) return false;

      return ref === normId(pais.pais_id) || ref === normId(pais.nombre);
    }

    function perteneceACiudad(ciudad, provinciaSeleccionada, provincias){
      const ref = normId(ciudad && (ciudad.provincia_id || ciudad.provincia));
      if(!ref) return false;

      const provincia = (provincias || []).find(p => normId(p.provincia_id) === normId(provinciaSeleccionada));
      if(!provincia) return false;

      return ref === normId(provincia.provincia_id) || ref === normId(provincia.nombre);
    }

    async function iniciarUbicacion() {
      const overlay = document.getElementById('ubicacionOverlay');
      const paisSel = document.getElementById('paisInicial');
      const provSel = document.getElementById('provinciaInicial');
      const ciudadSel = document.getElementById('ciudadInicial');
      const btn = document.getElementById('entrarGuia');
      const error = document.getElementById('ubicacionError');

      document.getElementById('cambiarCiudad').addEventListener('click', () => {
        document.body.classList.add('esperando-ubicacion');
        overlay.classList.remove('oculto');

        if(paisSeleccionado){
          paisSel.value = paisSeleccionado;
          cargarProvinciasLocal();
        }
        if(provinciaSeleccionada){
          provSel.value = provinciaSeleccionada;
          cargarCiudadesLocal();
        }
        if(ciudadSeleccionada){
          ciudadSel.value = ciudadSeleccionada;
          btn.disabled = false;
        }
      });

      try {
        error.textContent = 'Cargando ubicaciones…';

        // La pantalla inicial pide SOLO territorio; no espera catálogos ni relaciones.
        const boot = await cargarUbicaciones();

        const paises = Array.isArray(boot.paises) ? boot.paises : [];
        const provincias = Array.isArray(boot.provincias) ? boot.provincias : [];
        const ciudades = Array.isArray(boot.ciudades) ? boot.ciudades : [];

        if(!paises.length) throw new Error('No hay países cargados.');

        opciones(paisSel, paises, 'pais_id');
        error.textContent = '';

        function cargarProvinciasLocal() {
          const paisId = String(paisSel.value || '').trim();

          provSel.innerHTML = '<option value="">Seleccionar provincia</option>';
          ciudadSel.innerHTML = '<option value="">Seleccionar ciudad</option>';
          ciudadSel.disabled = true;
          btn.disabled = true;

          if(!paisId) {
            provSel.disabled = true;
            return [];
          }

          const filtradas = provincias.filter(p => perteneceAProvincia(p, paisId, paises));
          opciones(provSel, filtradas, 'provincia_id');
          provSel.disabled = filtradas.length === 0;

          if(!filtradas.length) {
            error.textContent = `No encuentro provincias vinculadas a ${paisId}. Revisar pais_id en la hoja provincias.`;
          } else {
            error.textContent = '';
          }

          return filtradas;
        }

        function cargarCiudadesLocal() {
          const provinciaId = String(provSel.value || '').trim();

          ciudadSel.innerHTML = '<option value="">Seleccionar ciudad</option>';
          btn.disabled = true;

          if(!provinciaId) {
            ciudadSel.disabled = true;
            return [];
          }

          const filtradas = ciudades.filter(c => perteneceACiudad(c, provinciaId, provincias));
          opciones(ciudadSel, filtradas, 'ciudad_id');
          ciudadSel.disabled = filtradas.length === 0;

          if(!filtradas.length) {
            error.textContent = `No encuentro ciudades vinculadas a ${provinciaId}. Revisar provincia_id en la hoja ciudades.`;
          } else {
            error.textContent = '';
          }

          return filtradas;
        }

        paisSel.addEventListener('change', () => {
          const ps = cargarProvinciasLocal();
          if(ps.length === 1) {
            provSel.value = String(ps[0].provincia_id || '').trim();
            const cs = cargarCiudadesLocal();
            if(cs.length === 1) {
              ciudadSel.value = String(cs[0].ciudad_id || '').trim();
              btn.disabled = false;
              prefetchGuia(paisSel.value, provSel.value, ciudadSel.value);
            }
          }
        });

        provSel.addEventListener('change', () => {
          const cs = cargarCiudadesLocal();
          if(cs.length === 1) {
            ciudadSel.value = String(cs[0].ciudad_id || '').trim();
            btn.disabled = false;
          }
        });

        ciudadSel.addEventListener('change', () => {
          btn.disabled = !ciudadSel.value;
          if(ciudadSel.value && paisSel.value && provSel.value){
            prefetchGuia(paisSel.value, provSel.value, ciudadSel.value);
          }
        });

        btn.addEventListener('click', async () => {
          if(!paisSel.value || !provSel.value || !ciudadSel.value) return;

          paisSeleccionado = paisSel.value;
          provinciaSeleccionada = provSel.value;
          ciudadSeleccionada = ciudadSel.value;

          const u = new URL(window.location.href);
          u.searchParams.set('pais_id', paisSeleccionado);
          u.searchParams.set('provincia_id', provinciaSeleccionada);
          u.searchParams.set('ciudad_id', ciudadSeleccionada);
          history.replaceState(null, '', u.toString());

          const paisNombre = paisSel.options[paisSel.selectedIndex]?.text || '';
          const provNombre = provSel.options[provSel.selectedIndex]?.text || '';
          const ciudadNombre = ciudadSel.options[ciudadSel.selectedIndex]?.text || '';

          document.getElementById('tituloGuia').textContent = ciudadNombre || '';
          guardarContextoCiudad(ciudadNombre);
          document.getElementById('ubicacionSubtitulo').textContent =
            [paisNombre, provNombre].filter(Boolean).join(' · ');

          overlay.classList.add('oculto');
          document.body.classList.remove('esperando-ubicacion');
          await cargarGuiaSeleccionada();
        });

        // Si sólo hay una opción en cada nivel, entra prácticamente sin espera.
        if(paises.length === 1) {
          paisSel.value = String(paises[0].pais_id || '').trim();

          const ps = cargarProvinciasLocal();
          if(ps.length === 1) {
            provSel.value = String(ps[0].provincia_id || '').trim();

            const cs = cargarCiudadesLocal();
            if(cs.length === 1) {
              ciudadSel.value = String(cs[0].ciudad_id || '').trim();
              btn.disabled = false;
              prefetchGuia(paisSel.value, provSel.value, ciudadSel.value);
            }
          }
        }

        // Restaurar selección desde URL.
        if(paisSeleccionado && provinciaSeleccionada && ciudadSeleccionada) {
          paisSel.value = paisSeleccionado;
          cargarProvinciasLocal();

          provSel.value = provinciaSeleccionada;
          cargarCiudadesLocal();

          ciudadSel.value = ciudadSeleccionada;
          btn.disabled = false;

          const paisNombre = paisSel.options[paisSel.selectedIndex]?.text || '';
          const provNombre = provSel.options[provSel.selectedIndex]?.text || '';
          const ciudadNombre = ciudadSel.options[ciudadSel.selectedIndex]?.text || '';

          document.getElementById('tituloGuia').textContent = ciudadNombre || '';
          document.getElementById('ubicacionSubtitulo').textContent =
            [paisNombre, provNombre].filter(Boolean).join(' · ');

          overlay.classList.add('oculto');
          document.body.classList.remove('esperando-ubicacion');
          await cargarGuiaSeleccionada();
        }

      } catch(e) {
        console.error('Error inicializando ubicación:', e);
        error.textContent = 'Error: ' + (e && e.message ? e.message : String(e));
      }
    }

    iniciarUbicacion();

  </script>
